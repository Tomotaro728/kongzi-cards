  setTimeout(function(){
    sess.i++;
    if (sess.i >= sess.order.length) { busy = false; resetDrag(true); showDone(); return; }
    swEl.style.transition = 'none';
    renderCard();
    swEl.style.transform = 'translateY(14px)'; swEl.style.opacity = '0';
    void swEl.offsetWidth;
    swEl.style.transition = REDUCED ? 'none' : 'transform .2s ease-out, opacity .2s ease-out';
    swEl.style.transform = ''; swEl.style.opacity = '';
    busy = false;
  }, dur);
}
function undo(){
  if (busy || !sess || !sess.hist.length) return;
  var h = sess.hist.pop(), d = sess.dir;
  if (h.prev) P[d][h.id] = h.prev; else delete P[d][h.id];
  saveP();
  delete sess.results[h.id];
  sess.i = h.i;
  renderCard(); show('study');
}
function showDone(){
  var k = 0, u = 0;
  Object.keys(sess.results).forEach(function(id){ if (sess.results[id] === 'known') k++; else u++; });
  $('#d-known').textContent = k; $('#d-unknown').textContent = u;
  var rest = sess.order.length - Object.keys(sess.results).length;
  $('#d-note').textContent = '全 ' + sess.order.length + ' 枚（' + DIR_LABEL[sess.dir] + '）' + (rest > 0 ? '・未判定 ' + rest + ' 枚' : '');
  $('#b-again').disabled = !u;
  $('#b-done-prev').hidden = !sess.hist.length;
  $('#s-bar').style.width = '100%';
  show('done');
}
cardEl.addEventListener('click', function(e){
  if (suppressClick || busy) return;
  var a = e.target.closest('[data-act]');
  if (a && cardEl.contains(a)) {
    var act = a.dataset.act, c = curCard();
    if (act === 'ruby' || act === 'pin') togglePin();
    else if (act === 'speak') speak(c.zh);
    else if (act === 'speak-ex') speak(c.examples[Number(a.dataset.i)].zh);
    else if (act === 'more') cardEl.classList.add('ex-open');
    return;
  }
  flip();
});
cardEl.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target === cardEl) { e.preventDefault(); flip(); }
});
$('#b-known').addEventListener('click', function(){ judge('known'); });
$('#b-unknown').addEventListener('click', function(){ judge('unknown'); });
$('#b-prev').addEventListener('click', undo);
$('#b-done-prev').addEventListener('click', undo);
$('#b-quit').addEventListener('click', function(){ if (sess) showDone(); });
$('#b-shuffle').addEventListener('click', function(){
  if (!sess || busy) return;
  sess.shuffle = !sess.shuffle;
  S.shuffle = sess.shuffle; saveS();
  // 表示中のカードはそのまま、残りの順番だけを並べ替える
  var head = sess.order.slice(0, sess.i + 1), rest = sess.order.slice(sess.i + 1);
  rest = sess.shuffle ? shuffled(rest) : rest.sort(byOrder);
  sess.order = head.concat(rest);
  $('#b-shuffle').setAttribute('aria-pressed', String(sess.shuffle));
  toast(sess.shuffle ? '残りのカードをシャッフルしました' : '残りのカードを資料順に戻しました');
});
$('#b-again').addEventListener('click', function(){
  var cs = sess.order.filter(function(c){ return sess.results[c.id] === 'unknown'; });
  if (cs.length) startSession(cs.sort(byOrder));
});
$('#b-restart').addEventListener('click', function(){ startSession(sess.base); });
$('#b-home').addEventListener('click', function(){ renderHome(); show('home'); });

document.addEventListener('keydown', function(e){
  if (curView !== 'study' || !$('#modal').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); judge('known'); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); judge('unknown'); }
  else if (e.key === 'Backspace' || e.key === 'ArrowUp') { e.preventDefault(); undo(); }
  else if (e.key === 'p' || e.key === 'P') togglePin();
  else if (e.key === 's' || e.key === 'S') speak(curCard().zh);
  else if ((e.key === ' ' || e.key === 'Enter') && tag !== 'button') { e.preventDefault(); flip(); }
});

/* ---------- スワイプ ---------- */
var tx = null;
function setDrag(dx){
  swEl.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
  var o = Math.min(1, Math.abs(dx) / 60);
  $('#tag-known').style.opacity = dx > 0 ? o : 0;
  $('#tag-unknown').style.opacity = dx < 0 ? o : 0;
}
function resetDrag(instant){
  swEl.style.transition = (instant || REDUCED) ? 'none' : 'transform .2s ease-out';
  swEl.style.transform = ''; swEl.style.opacity = '';
  $('#tag-known').style.opacity = 0; $('#tag-unknown').style.opacity = 0;
}
swEl.addEventListener('touchstart', function(e){
  if (busy || e.touches.length !== 1) { tx = null; return; }
  var t = e.touches[0];
  tx = {x: t.clientX, y: t.clientY, dx: 0, axis: null};
  swEl.style.transition = 'none';
}, {passive: true});
swEl.addEventListener('touchmove', function(e){
  if (!tx) return;
  var t = e.touches[0], dx = t.clientX - tx.x, dy = t.clientY - tx.y;
  if (!tx.axis) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    tx.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (tx.axis !== 'x') return;   // 縦方向はスクロールに任せる
  e.preventDefault();
  tx.dx = dx; setDrag(dx);
}, {passive: false});
function touchEnd(){
  if (!tx) return;
  var axis = tx.axis, dx = tx.dx; tx = null;
  if (axis !== 'x') return;
  suppressClick = true; setTimeout(function(){ suppressClick = false; }, 350);
  if (Math.abs(dx) >= 60) {
    $('#tag-known').style.opacity = 0; $('#tag-unknown').style.opacity = 0;
    judge(dx > 0 ? 'known' : 'unknown');
  } else resetDrag(false);
}
swEl.addEventListener('touchend', touchEnd);
swEl.addEventListener('touchcancel', function(){ tx = null; resetDrag(false); });

/* ---------- 一覧 ---------- */
var listRows = [];
function renderList(){
  var q = $('#l-q').value.trim().toLowerCase(), qp = plainPy(q);
  listRows = filtered().filter(function(c){
    if (!q) return true;
    return c.zh.indexOf(q) >= 0 || c.ja.toLowerCase().indexOf(q) >= 0 || c.ja_note.toLowerCase().indexOf(q) >= 0 ||
      c.pinyin.toLowerCase().indexOf(q) >= 0 || (qp && plainPy(c.pinyin).indexOf(qp) >= 0);
  });
  $('#l-info').textContent = listRows.length + ' 件 ・ ホームの絞り込み条件を適用 ・ 状況は ' + DIR_LABEL[S.dir] + ' の記録';
  $('#l-body').innerHTML = listRows.map(function(c, i){
    var s = status(c);
    var st = s === 'known' ? '<span class="st known">覚えた</span>' : s === 'unknown' ? '<span class="st unknown">まだ</span>' : '<span class="st none">未学習</span>';
    return '<tr data-i="' + i + '" tabindex="0"><td class="c-zh" lang="zh-Hans">' + esc(c.zh) + '</td><td class="c-py">' + pinyinHTML(c.pinyin) +
      '</td><td class="c-ja">' + esc(c.ja) + (c.ja_ai ? AI : '') + '</td><td class="c-ls">第' + c.lesson + '課</td><td class="c-ty">' + esc(c.type) +
      '</td><td class="c-st">' + st + '</td></tr>';
  }).join('');
  $('#l-table').hidden = !listRows.length;
  $('#l-empty').hidden = !!listRows.length;
}
$('#l-q').addEventListener('input', renderList);
function openRow(tr){ if (!tr) return; startSession(listRows, Number(tr.dataset.i)); }
$('#l-body').addEventListener('click', function(e){ openRow(e.target.closest('tr')); });
$('#l-body').addEventListener('keydown', function(e){ if (e.key === 'Enter') openRow(e.target.closest('tr')); });

/* ---------- 設定 ---------- */
function applySettings(){
  document.documentElement.style.setProperty('--base', S.font + '%');
  document.documentElement.classList.toggle('tone-on', !!S.tone);
}
function renderTtsStatus(){
  var el = $('#tts-status'); if (!el) return;
  if (!TTS) { el.textContent = 'この環境では読み上げが使えません'; return; }
  var v = pickVoice();
  el.textContent = v ? '使用する音声: ' + v.name + '（' + v.lang + '）' : voices.length ? '中国語の音声が見つかりません（端末の設定で追加できます）' : '読み上げ: 利用可能（音声の一覧を取得中）';
}
function renderSettings(){
  $$('#v-settings .seg[data-key]').forEach(function(seg){
    var k = seg.dataset.key, v = k === 'font' ? S.font : (S[k] ? '1' : '0');
    setSegPressed(seg, v);
  });
  renderTtsStatus();
  $('#b-reset-filter').textContent = '表示中の絞り込み（' + filtered().length + ' 枚）をリセット';
  var total = SEMS.reduce(function(a, s){ return a + s.cards.length; }, 0);
  $('#about').textContent = (USING_SAMPLE ? 'サンプルデータで動作中 ・ ' : '') + SEMS.map(function(s){ return s.semester; }).join('・') + ' ・ 全 ' + total + ' 枚';
}
$$('#v-settings .seg[data-key]').forEach(function(seg){
  seg.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var k = seg.dataset.key;
    S[k] = k === 'font' ? b.dataset.v : b.dataset.v === '1';
    saveS(); applySettings(); renderSettings();
  });
});
$('#b-reset-filter').addEventListener('click', function(){
  var cs = filtered();
  if (!cs.length) { toast('該当するカードがありません'); return; }
  confirmDialog('表示中の絞り込みに当てはまる ' + cs.length + ' 枚の進捗（日→中・中→日）を消去します。\nよろしいですか？', 'リセット').then(function(ok){
    if (!ok) return;
    cs.forEach(function(c){ delete P.ja2zh[c.id]; delete P.zh2ja[c.id]; });
    saveP(); renderSettings(); toast('進捗をリセットしました');
  });
});
$('#b-reset-all').addEventListener('click', function(){
  confirmDialog('すべてのカードの進捗（日→中・中→日）を消去します。\nよろしいですか？', 'リセット').then(function(ok){
    if (!ok) return;
    P = {ja2zh: {}, zh2ja: {}}; saveP(); renderSettings(); toast('すべての進捗をリセットしました');
  });
});

/* ---------- 起動 ---------- */
applySettings();
renderHome();
show('home');
})();
</script>
