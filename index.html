:true,"examples":[],"related":[],"parent":"","pages":[75],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p75 討論（超前消费）ページの書き込み。ピンイン補完。"},{"id":"2026春-2-049","lesson":2,"type":"単語","role":"関連語","zh":"保值","pinyin":"bǎo zhí","ja":"価値を保つ","ja_ai":true,"ja_note":"","def_zh":"保持原有价值，不贬值","def_zh_ai":true,"examples":[{"zh":"当买房不再是一种保值增值的投资，而更像是一次大额消费时，人们的买房逻辑也在变化。","ja":"住宅購入がもはや価値を保ち増やすための投資ではなく、むしろ一度の大きな消費のようになったとき、人々の住宅購入の考え方も変わりつつある。","ja_ai":true}],"related":["贬值","保值增值"],"parent":"","pages":[71,75],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p75 討論ページの書き込み「保值 贬值」。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-050","lesson":2,"type":"単語","role":"関連語","zh":"贬值","pinyin":"biǎn zhí","ja":"価値が下がる","ja_ai":true,"ja_note":"","def_zh":"价值降低；货币购买力下降","def_zh_ai":true,"examples":[],"related":["保值","资产缩水"],"parent":"","pages":[55,60,75],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p75 討論ページの書き込み「保值 贬值」。资产缩水 の語釈（p55）にも出現。ピンイン補完。"},{"id":"2026春-2-051","lesson":2,"type":"単語","role":"関連語","zh":"孝顺","pinyin":"xiào shùn","ja":"親孝行（である）","ja_ai":true,"ja_note":"","def_zh":"尽心奉养父母，顺从父母的意愿","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[75],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p75 討論ページの書き込み。ピンイン補完。"},{"id":"2026春-2-052","lesson":2,"type":"単語","role":"見出し語","zh":"骤降","pinyin":"zhòu jiàng","ja":"急激に下がる／急落する","ja_ai":true,"ja_note":"","def_zh":"（数量、温度等）突然大幅度下降","def_zh_ai":true,"examples":[{"zh":"人到中年，正好赶上裁员高峰，月收入从3万骤降到0。","ja":"中年になって、ちょうどリストラのピークにぶつかり、月収は3万元から一気にゼロになった。","ja_ai":true}],"related":[],"parent":"","pages":[76,89],"notes":"まとめ p89 掲載、語釈なし。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-053","lesson":2,"type":"慣用句","role":"見出し語","zh":"给……狠狠上了一课","pinyin":"gěi … hěn hěn shàng le yí kè","ja":"（〜に）痛烈な教訓を与えた／身にしみる教訓となった","ja_ai":true,"ja_note":"","def_zh":"某件事让一个人深刻吸取了教训。","def_zh_ai":false,"examples":[{"zh":"朋友的境遇给苏苏狠狠上了一课，“买房真是把一代中产坑惨了，努力奋斗十年，还不如躺平十年，起码没有债。”","ja":"友人の境遇は蘇蘇にとって痛烈な教訓となった。「家を買ったせいで、一世代の中間層が本当にひどい目に遭った。10年必死に頑張るより、10年寝そべっていたほうがましだ。少なくとも借金はないのだから」","ja_ai":true}],"related":["上了一课"],"parent":"","pages":[76],"notes":"本文 p76 末尾で語釈付き解説（まとめには無し）。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-054","lesson":2,"type":"単語","role":"見出し語","zh":"坑惨","pinyin":"kēng cǎn","ja":"ひどい目に遭わされる／散々な目に遭わせる","ja_ai":true,"ja_note":"","def_zh":"被害得特别惨。","def_zh_ai":false,"examples":[{"zh":"朋友的境遇给苏苏狠狠上了一课，“买房真是把一代中产坑惨了，努力奋斗十年，还不如躺平十年，起码没有债。”","ja":"友人の境遇は蘇蘇にとって痛烈な教訓となった。「家を買ったせいで、一世代の中間層が本当にひどい目に遭った。10年必死に頑張るより、10年寝そべっていたほうがましだ。少なくとも借金はないのだから」","ja_ai":true}],"related":[],"parent":"","pages":[76],"notes":"本文 p76 末尾で語釈付き解説（まとめには無し）。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-055","lesson":2,"type":"成語","role":"見出し語","zh":"资不抵债","pinyin":"zī bù dǐ zhài","ja":"債務超過、資産が負債に届かない","ja_ai":false,"ja_note":"","def_zh":"个人或企业的全部资产，不足以抵偿所欠的债务，处于负债超过资产的状态。","def_zh_ai":false,"examples":[{"zh":"盲目投资房产又遭遇失业，他背负多笔贷款早已资不抵债。","ja":"やみくもに不動産投資をしたうえ失業にも見舞われ、複数のローンを抱えた彼はとっくに債務超過に陥っている。","ja_ai":true},{"zh":"这家企业管理混乱又无力盈利，短短几年就走到资不抵债的地步。","ja":"この企業は経営が混乱し利益も出せず、わずか数年で債務超過に陥った。","ja_ai":true},{"zh":"他借遍亲友还无力偿还欠款，资产早已变卖一空，完全处于资不抵债的尴尬（gān gà 窮屈、板挟み）境地。","ja":"彼は親戚や友人じゅうから借金をしてもなお返済できず、資産もとっくにすべて売り払い、完全に債務超過という苦しい状況にある。","ja_ai":true},{"zh":"更紧要的是，即便卖掉房子还不够还银行贷款，“属于是资不抵债，没法卖。”","ja":"さらに深刻なのは、家を売っても銀行ローンを返しきれないことで、「債務超過だから売るに売れない」ということだ。","ja_ai":true}],"related":[],"parent":"","pages":[76,77,89],"notes":"資料ではピンインと語釈が連続（zī bù dǐ zhài个人或…）していたため分離。3つ目の例文の（gān gà 窮屈、板挟み）は資料の注釈をそのまま残した。4つ目は本文（p76）から。"},{"id":"2026春-2-056","lesson":2,"type":"単語","role":"見出し語","zh":"尴尬","pinyin":"gān gà","ja":"窮屈、板挟み","ja_ai":false,"ja_note":"","def_zh":"处境困难，不好处理；神情、态度不自然","def_zh_ai":true,"examples":[],"related":["尴尬境地","尴尬的局面"],"parent":"","pages":[77,95],"notes":"本文中の注釈語（本文に読み・日本語注のみ付記、まとめスライドには無し）。採否要確認。資不抵債 の例文（p77）と 陷入……困境 の搭配（p95）に読み・訳の注釈のみ。"},{"id":"2026春-2-057","lesson":2,"type":"単語","role":"見出し語","zh":"延迟满足","pinyin":"yán chí mǎn zú","ja":"満足の先送り（目先の欲求を我慢する）","ja_ai":true,"ja_note":"","def_zh":"为了获得更长远、更有价值的结果，主动放弃眼前的即时满足","def_zh_ai":true,"examples":[],"related":["超前消费"],"parent":"","pages":[77,89],"notes":"p77 下部に書き込み、まとめ p89 掲載。資料に語釈・例文なし。ピンイン補完。"},{"id":"2026春-2-058","lesson":2,"type":"慣用句","role":"見出し語","zh":"一团糟","pinyin":"yì tuán zāo","ja":"めちゃくちゃ、ひどく混乱している、収拾がつかない状態","ja_ai":false,"ja_note":"","def_zh":"形容事情、生活、局面、环境等极度混乱，毫无秩序、无法收拾。","def_zh_ai":false,"examples":[{"zh":"失业叠加房贷和育儿压力，他的收入和支出完全失衡，整个人的生活变得一团糟。","ja":"失業に住宅ローンと子育ての重圧が重なり、彼の収支は完全にバランスを崩し、生活全体がめちゃくちゃになった。","ja_ai":true},{"zh":"突然遭遇家庭变故又无人帮忙，她的情绪和日常事务全都搅在一起，过得一团糟。","ja":"突然家庭の不幸に見舞われたうえ助けてくれる人もおらず、彼女は感情も日常の用事もすべてがごちゃ混ぜになり、ひどく混乱した日々を送っている。","ja_ai":true},{"zh":"长期熬夜、作息不规律，饮食也毫无节制，他的身体健康和精神状态早已一团糟。","ja":"長期間の夜更かしや不規則な生活に加え、食事もまったく節制しないため、彼の体の健康も精神状態もとっくにぼろぼろだ。","ja_ai":true},{"zh":"房子月供，孩子教育，父母养老，简直一团糟，他不得不跑滴滴挣点外快，甚至拿父母的养老钱和自己的一点存款去填窟窿。","ja":"住宅ローンの返済、子どもの教育、親の老後と、まさにめちゃくちゃな状態で、彼は滴滴（配車サービス）の運転手をして副収入を稼がざるを得ず、さらには親の老後資金や自分のわずかな貯金まで使って穴埋めをしている。","ja_ai":true}],"related":["一言难尽"],"parent":"","pages":[76,78,89],"notes":"三字慣用語として 慣用句 扱い。4つ目の例文は本文（p76）から。"},{"id":"2026春-2-059","lesson":2,"type":"成語","role":"関連語","zh":"一言难尽","pinyin":"yì yán nán jìn","ja":"一言では言い尽くせない","ja_ai":true,"ja_note":"","def_zh":"事情复杂，不是一句话能说清楚的","def_zh_ai":true,"examples":[],"related":["一团糟"],"parent":"一团糟","pages":[78],"notes":"p78 一团糟 スライド下部の書き込み。ピンイン補完。"},{"id":"2026春-2-060","lesson":2,"type":"単語","role":"見出し語","zh":"外快","pinyin":"wài kuài","ja":"臨時収入、副収入、アルバイト代","ja_ai":false,"ja_note":"","def_zh":"在本职工作固定工资之外，额外通过兼职、副业等获得的收入。","def_zh_ai":false,"examples":[{"zh":"面对高额的房贷压力，很多上班族都会利用业余时间做副业，顺便挣点外快补贴家用。","ja":"高額な住宅ローンのプレッシャーを前に、多くのサラリーマンは余暇に副業をし、臨時収入を得て家計を補っている。","ja_ai":false},{"zh":"他擅长写作和翻译，常常接线上兼职挣外快，既能发挥特长又能增加收入。","ja":"彼は文章作成や翻訳が得意で、よくオンライン副業をして副収入を稼ぎ、特技を活かしながら収入を増やしている。","ja_ai":false},{"zh":"中年失业后很难找到合适全职工作，他只能靠跑网约车挣外快，勉强维持基本生活。","ja":"中年で失業した後は適した正社員の仕事が見つかりにくく、配車アプリのドライバーで臨時収入を稼ぎ、どうにか生活を維持している。","ja_ai":false},{"zh":"房子月供，孩子教育，父母养老，简直一团糟，他不得不跑滴滴挣点外快，甚至拿父母的养老钱和自己的一点存款去填窟窿。","ja":"住宅ローンの返済、子どもの教育、親の老後と、まさにめちゃくちゃな状態で、彼は滴滴（配車サービス）の運転手をして副収入を稼がざるを得ず、さらには親の老後資金や自分のわずかな貯金まで使って穴埋めをしている。","ja_ai":true}],"related":["挣外快"],"parent":"","pages":[76,79,89],"notes":"ピンイン補完。資料の日本語訳は例文3→1→2の順に並んでいたため対応付けを整理。4つ目の例文は本文（p76）から。"},{"id":"2026春-2-061","lesson":2,"type":"慣用句","role":"見出し語","zh":"填窟窿","pinyin":"tián kū long","ja":"損失を補う、借金の穴を埋める、赤字を補填する","ja_ai":false,"ja_note":"","def_zh":"比喻弥补欠下的债务、亏损的缺口，填补经济上的亏空。","def_zh_ai":false,"examples":[{"zh":"投资失败欠下一大笔债，他只能拿出多年积蓄（jīxù）去填窟窿，瞬间花光了所有存款。","ja":"投資に失敗して多額の借金を抱え、彼は長年の貯蓄を出して穴埋めするしかなく、あっという間に貯金をすべて使い果たした。","ja_ai":true},{"zh":"每月房贷压力太大，工资根本不够还款，他只好靠父母的钱来填窟窿维持周转。","ja":"毎月の住宅ローンの負担が大きすぎて給料では到底返済が足りず、彼は親のお金で穴埋めしてやりくりするしかなかった。","ja_ai":true},{"zh":"他不敢告诉家人负债实情，只能借钱填窟窿，生活过得十分煎熬。","ja":"彼は借金の実情を家族に打ち明けられず、借金をして穴埋めするしかなく、苦しい毎日を送っている。","ja_ai":true},{"zh":"房子月供，孩子教育，父母养老，简直一团糟，他不得不跑滴滴挣点外快，甚至拿父母的养老钱和自己的一点存款去填窟窿。","ja":"住宅ローンの返済、子どもの教育、親の老後と、まさにめちゃくちゃな状態で、彼は滴滴（配車サービス）の運転手をして副収入を稼がざるを得ず、さらには親の老後資金や自分のわずかな貯金まで使って穴埋めをしている。","ja_ai":true}],"related":["拆东墙补西墙"],"parent":"","pages":[76,80,89],"notes":"資料のピンイン表記は「tián kūlong」。三字慣用語として 慣用句 扱い。3つ目の例文の行間に「拆东墙补西墙」が挿入されていたが書き込みとみなし関連語カードへ。ページ末「jiān'áo」は例文中「煎熬」の読み。4つ目の例文は本文（p76）から。"},{"id":"2026春-2-062","lesson":2,"type":"慣用句","role":"関連語","zh":"拆东墙补西墙","pinyin":"chāi dōng qiáng bǔ xī qiáng","ja":"その場しのぎのやりくり／借金で借金を返す","ja_ai":true,"ja_note":"","def_zh":"拆掉东边的墙去修补西边的墙；比喻临时勉强应付，借新债还旧债","def_zh_ai":true,"examples":[],"related":["填窟窿"],"parent":"填窟窿","pages":[80],"notes":"p80 填窟窿 の例文の行間に書き込み。ピンイン補完。"},{"id":"2026春-2-063","lesson":2,"type":"成語","role":"見出し語","zh":"省吃俭用","pinyin":"shěng chī jiǎn yòng","ja":"質素倹約、つましく暮らす、食費や生活費を切り詰める","ja_ai":false,"ja_note":"","def_zh":"在吃穿和日常花费上极力节省，不铺张浪费，尽量减少开支积攒钱财。","def_zh_ai":false,"examples":[{"zh":"为了早日还清巨额负债，他开始省吃俭用缩减一切非必要开支，慢慢积累还款资金。","ja":"巨額の借金を早く完済するため、彼は生活を切り詰めて不要な支出を一切削り、少しずつ返済資金を貯めている。","ja_ai":true},{"zh":"他多年省吃俭用攒下一笔积蓄，本想安稳养老，却被意外变故拿去填了债务窟窿。","ja":"彼は長年つましく暮らして貯金を作り、穏やかな老後を送るつもりだったが、思いがけない出来事で借金の穴埋めに使われてしまった。","ja_ai":true},{"zh":"“几代人省吃俭用的这点钱，最后又贴补给了银行。”","ja":"「何世代にもわたって切り詰めて貯めたこのお金も、結局はまた銀行に注ぎ込まれてしまった。」","ja_ai":true}],"related":["节衣缩食"],"parent":"","pages":[76,81,89],"notes":"資料のピンイン表記は「shěngchī jiǎnyòng」。3つ目の例文は本文（p76）から。"},{"id":"2026春-2-064","lesson":2,"type":"成語","role":"見出し語","zh":"节衣缩食","pinyin":"jié yī suō shí","ja":"衣食を切り詰める／極めて質素に暮らす","ja_ai":true,"ja_note":"","def_zh":"节省穿衣、缩减伙食，形容生活极度节俭，尽量减少开支。","def_zh_ai":false,"examples":[{"zh":"为了早日还清巨额贷款，他不得不节衣缩食，砍掉所有不必要的娱乐开销。","ja":"巨額のローンを早く完済するため、彼は衣食を切り詰め、不要な娯楽費をすべて削らざるを得なかった。","ja_ai":true}],"related":["省吃俭用"],"parent":"","pages":[81,89],"notes":"省吃俭用 のスライド内で解説、まとめ p89 掲載のため見出し語。"},{"id":"2026春-2-065","lesson":2,"type":"単語","role":"見出し語","zh":"贴补","pinyin":"tiē bǔ","ja":"穴を埋める、補填する、自腹で補う、家計を補う","ja_ai":false,"ja_note":"","def_zh":"从经济上拿出钱财，补助不足、填补亏空；用自有资金补上生活、债务、开销的缺口。","def_zh_ai":false,"examples":[{"zh":"工资不够偿还房贷，她只能拿父母的钱贴补家用。","ja":"給料では住宅ローンの返済に足りず、彼女は親のお金で家計を補うしかない。","ja_ai":true},{"zh":"生意常年亏损，老板只能用自己的存款贴补店铺，勉强维持经营。","ja":"商売が長年赤字続きで、店主は自分の貯金で店の赤字を補填し、なんとか経営を続けるしかない。","ja_ai":true},{"zh":"“几代人省吃俭用的这点钱，最后又贴补给了银行。”","ja":"「何世代にもわたって切り詰めて貯めたこのお金も、結局はまた銀行に注ぎ込まれてしまった。」","ja_ai":true}],"related":["补贴"],"parent":"","pages":[76,82,83,89],"notes":"「贴补 VS 补贴」の対比。p82 の例文1・2を 贴补 に割り当て。ピンイン補完。3つ目の例文は本文（p76）から。"},{"id":"2026春-2-066","lesson":2,"type":"単語","role":"見出し語","zh":"补贴","pinyin":"bǔ tiē","ja":"補助する、手当を支給する、補助金、手当","ja_ai":false,"ja_note":"","def_zh":"政府、单位、集体额外给的经费、物资，补助生活、工作、物价开销；也指额外补助的钱款。","def_zh_ai":false,"examples":[{"zh":"很多公司都会给员工发放住房补贴，用来减轻大家租房或买房的经济压力。","ja":"多くの会社は社員に住宅手当を支給し、賃貸や住宅購入の経済的負担を軽減している。","ja_ai":true},{"zh":"当地政府给困难学生发放生活补贴，让他们可以安心完成学业不用为生活费发愁。","ja":"地元政府は生活の苦しい学生に生活補助金を支給し、生活費の心配をせずに安心して学業を終えられるようにしている。","ja_ai":true}],"related":["贴补","住房补贴","生活补贴"],"parent":"","pages":[82,83,89],"notes":"「贴补 VS 补贴」の対比。p82 の例文3・4を 补贴 に割り当て。ピンイン補完。なお p79 外快 の例文「补贴家用」は 贴补 に近い意味での用法。"},{"id":"2026春-2-067","lesson":2,"type":"慣用句","role":"見出し語","zh":"眼不见为净","pinyin":"yǎn bú jiàn wéi jìng","ja":"見なければ気にならない；目を閉じて平然とする","ja_ai":false,"ja_note":"","def_zh":"出自民间俗语，指眼睛看不到杂乱、不堪或令人心烦的事物，内心就会觉得清净、安稳；常用来形容刻意回避糟心事、烦心事，以求心境平和。","def_zh_ai":false,"examples":[{"zh":"两人当众发生争执，我不想卷入纠纷，只能转身离开，眼不见为净。","ja":"二人が人前で言い争いを始め、私はもめ事に巻き込まれたくなかったので、その場を離れるしかなかった。見なければ気にならない。","ja_ai":true},{"zh":"网络上充斥着负面言论，不必逐条反驳，有时候眼不见为净也是一种生活智慧。","ja":"ネットに否定的な言葉があふれているので、一つ一つ反論する必要はなく、見ないことも生きる知恵だ。","ja_ai":false},{"zh":"客厅里杂物堆积、无人整理，我不愿烦心，干脆出门躲开，眼不见为净。","ja":"リビングにはがらくたが積み上がって誰も片付けない。いらいらしたくないので、いっそ外出して見ないようにしている。","ja_ai":true}],"related":[],"parent":"","pages":[84],"notes":"ピンイン補完（不 は変調表記 bú）。"},{"id":"2026春-2-068","lesson":2,"type":"単語","role":"見出し語","zh":"视奸","pinyin":"shì jiān","ja":"SNSをこっそり盗み見る；他人のページを無断で覗き見る","ja_ai":false,"ja_note":"","def_zh":"网络专用词，指未经对方允许，暗中反复浏览他人社交平台、朋友圈、个人主页等动态，只偷看、不点赞、不评论、不互动，侧重窥探他人线上隐私，带有贬义。","def_zh_ai":false,"examples":[{"zh":"不少人出于好奇心视奸陌生人的账号，这种行为很容易越过人际交往的隐私边界。","ja":"好奇心から見知らぬ人のアカウントをこっそりのぞく人は少なくないが、こうした行為は人付き合いにおけるプライバシーの境界を越えやすい。","ja_ai":true},{"zh":"不要反复视奸前任的社交主页，过度沉溺过往只会让自己迟迟走不出负面情绪。","ja":"元恋人のSNSページを何度も盗み見てはいけない、過去に執着すると気持ちが立ち直れなくなる。","ja_ai":false},{"zh":"她察觉到有人长期视奸自己的动态，于是立刻设置了主页访问限制保护隐私。","ja":"自分の投稿を長期間盗み見ている人がいると気づき、彼女はすぐ閲覧制限を設定してプライバシーを守った。","ja_ai":false}],"related":["监视"],"parent":"","pages":[85],"notes":""},{"id":"2026春-2-069","lesson":2,"type":"単語","role":"見出し語","zh":"监视","pinyin":"jiān shì","ja":"監視する；見張る","ja_ai":false,"ja_note":"","def_zh":"从旁严密、持续地观察人、场所或事物，带有监督、防范、管控、排查的目的；可用于公务安保、生产管理，也可指恶意盯梢、限制他人自由。","def_zh_ai":false,"examples":[{"zh":"安保人员在路口严密监视来往行人，全力维护这片区域的公共安全与秩序。","ja":"警備員は交差点で行き交う通行人を厳重に監視し、この地域の公共の安全と秩序を全力で守っている。","ja_ai":true},{"zh":"警方持续监视嫌疑人的行踪，等待合适时机开展统一抓捕行动。","ja":"警察は容疑者の行方を監視し続け、適切なタイミングで一斉逮捕を実施する。","ja_ai":false},{"zh":"家长不要过度监视孩子的一举一动，过度管控反而会疏远亲子之间的感情。","ja":"親は子どもの一挙一動を過度に監視すべきではない。管理しすぎるとかえって親子の気持ちが離れてしまう。","ja_ai":true}],"related":["视奸"],"parent":"","pages":[86],"notes":"資料 p86 のピンインは「shì jiān」（视奸 と同じ表記）で誤りと思われるため jiān shì とした。"},{"id":"2026春-2-070","lesson":2,"type":"単語","role":"見出し語","zh":"信息茧房","pinyin":"xìn xī jiǎn fáng","ja":"情報の繭（フィルターバブル）","ja_ai":true,"ja_note":"興味や好み、プラットフォームのアルゴリズムによるおすすめ機能などの要因によって、人々が長期間にわたり同質的な情報ばかりに触れるようになり、まるで繭（まゆ）の中に閉じ込められているような状態になることがある。その結果、多様な意見や新しい情報に触れる機会が徐々に失われ、視野が狭くなったり、認識や考え方が固定化したりする現象を指す。","def_zh":"由兴趣偏好、平台算法推送等因素导致，人们长期只接触同质化信息，如同被困在蚕茧之中，逐渐失去接触多元观点、新鲜资讯的机会，造成视野狭窄、认知固化的现象。","def_zh_ai":false,"examples":[{"zh":"长期只浏览同类资讯很容易陷入信息茧房，我们要主动接触不同观点拓宽眼界。","ja":"同じ種類の情報ばかり見ていると情報の繭に閉じ込められやすいので、積極的に多様な意見に触れ視野を広げよう。","ja_ai":false},{"zh":"很多网民被困在信息茧房之中，久而久之便难以理解他人不一样的想法。","ja":"多くのネットユーザーは情報の繭の中に閉じ込められ、時間がたつにつれて他人の異なる考えを理解しにくくなる。","ja_ai":true},{"zh":"想要真正打破信息茧房，就要主动跳出固有圈子，耐心倾听多元的声音。","ja":"情報の繭を本当に打ち破りたいなら、自分から固定化した仲間内の世界を飛び出し、多様な声に辛抱強く耳を傾けなければならない。","ja_ai":true}],"related":["算法"],"parent":"","pages":[87],"notes":"資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-071","lesson":2,"type":"単語","role":"見出し語","zh":"算法","pinyin":"suàn fǎ","ja":"アルゴリズム（通用外来语，日本全网通用）；配信アルゴリズム","ja_ai":false,"ja_note":"","def_zh":"本义指计算机领域的计算规则；本课专指互联网平台的个性化推送技术：平台分析用户浏览、点击、停留等行为数据，自动推送用户偏好的内容，是网络信息分发的核心技术，也是形成信息茧房的主要诱因。","def_zh_ai":false,"examples":[{"zh":"平台的算法会持续推送你感兴趣的内容，不要被算法控制，更不要被一种声音洗脑。","ja":"プラットフォームのアルゴリズムは興味のあるコンテンツを次々配信する。アルゴリズムに支配されず、一方的な意見に洗脳されてはならない。","ja_ai":false},{"zh":"很多用户被动接收算法推送的内容，久而久之个人视野会变得越来越狭隘（xiá ài）。","ja":"多くの利用者がアルゴリズム配信のコンテンツを受け身で見続け、視野がだんだん狭くなっていく。","ja_ai":false},{"zh":"我们要学会主动筛选信息而非依赖算法，这样才能长久保持独立思考的能力。","ja":"アルゴリズムに依存せず自ら情報を選別する習慣をつければ、長く独力で考える力を保てる。","ja_ai":false}],"related":["信息茧房"],"parent":"","pages":[88],"notes":"ja の括弧内（通用外来语，日本全网通用）は資料どおり中国語の補足。"},{"id":"2026春-2-072","lesson":2,"type":"単語","role":"見出し語","zh":"老破小","pinyin":"lǎo pò xiǎo","ja":"築古・狭小・老朽化した中古住宅／古くて狭いボロ物件","ja_ai":false,"ja_note":"","def_zh":"名词（网络俗语、房地产用语）指房龄老、设施旧、面积小的住宅，一般位置较好但居住条件较差。","def_zh_ai":false,"examples":[{"zh":"父母觉得老破小再怎么便宜，也不适合长期居住，因为环境和物业都太差了。","ja":"両親は、古くて狭いボロ物件はいくら安くても長く住むのには向かないと考えている。環境も管理もひどすぎるからだ。","ja_ai":true},{"zh":"虽然这套房子是典型的老破小，但因为离地铁站很近，价格一直没有降下来。","ja":"この物件は典型的な古くて狭いボロ物件だが、地下鉄の駅に近いため、価格がずっと下がっていない。","ja_ai":true},{"zh":"老破小第一个被她排除掉。","ja":"古くて狭いボロ物件は真っ先に候補から外した。","ja_ai":true}],"related":[],"parent":"","pages":[50,90,91,100,103],"notes":"ピンイン補完。p50 にも書き込みあり。ja の2つの訳語は資料では空白区切り。3つ目の例文は本文（p90）から。"},{"id":"2026春-2-073","lesson":2,"type":"単語","role":"見出し語","zh":"窝囊","pinyin":"wō nang","ja":"みじめだ／情けない／息苦しくて惨めな気分","ja_ai":false,"ja_note":"","def_zh":"① 因受委屈或压抑而感到难受。② 没有出息、软弱无能。","def_zh_ai":false,"examples":[{"zh":"他努力工作了很多年，却还是买不起房子，心里觉得特别窝囊。","ja":"彼は何年も懸命に働いてきたのに、まだ家を買えず、ひどく情けない気持ちになっている。","ja_ai":true},{"zh":"在会议上被领导批评以后，他一句话也没说，默默坐在那里，样子很窝囊。","ja":"会議で上司に叱られた後、彼は一言も言わずに黙って座っていて、とても情けない様子だった。","ja_ai":true},{"zh":"“看完那些房子，我都觉得好窝囊。再便宜我都不会去买。”","ja":"「ああいう家を見終わったら、本当にみじめな気分になった。どんなに安くても絶対に買わない」","ja_ai":true}],"related":[],"parent":"","pages":[90,91,103],"notes":"資料のピンイン表記は「wōnang」（nang は軽声）。3つ目の例文は本文（p90）から。"},{"id":"2026春-2-074","lesson":2,"type":"成語","role":"見出し語","zh":"歪七扭八","pinyin":"wāi qī niǔ bā","ja":"ゆがんで乱れている／ぐにゃぐにゃ","ja_ai":true,"ja_note":"整っておらず、きちんとしておらず、ゆがんで乱れていること。文字・物・道・姿勢・構造などが曲がったり乱雑だったりする様子を表す。","def_zh":"不整齐、不端正、歪斜错乱，可形容文字、物品、道路、姿态、结构。","def_zh_ai":false,"examples":[{"zh":"弟弟刚开始学毛笔字的时候，写出来的字歪七扭八，老师看了半天才认出来。","ja":"弟が毛筆の練習を始めたばかりの頃、書いた字はぐにゃぐにゃに曲がっていて、先生は長い時間かけてやっと読み取れた。","ja_ai":true},{"zh":"山区里的小路歪七扭八，下雨以后特别难开车，新手司机根本不敢进去。","ja":"山間部の小道はくねくねと曲がりくねっていて、雨が降ると特に運転しにくく、初心者ドライバーはとても入っていけない。","ja_ai":true},{"zh":"有些人坐姿总是歪七扭八，长期下来很容易影响脊柱的正常发育。","ja":"座る姿勢がいつも崩れている人がいるが、長く続くと背骨の正常な発達に影響しやすい。","ja_ai":true},{"zh":"有些老房子外立面掉渣，户型也歪七扭八，“进去逛一圈出来，感觉走道都走不正了。”","ja":"古い家の中には外壁がぼろぼろと剥がれ落ち、間取りもゆがんでいるものがあり、「中を一回りして出てくると、まっすぐ歩けなくなった気がする」。","ja_ai":true}],"related":[],"parent":"","pages":[90,92,103],"notes":"ピンインはページ末尾に離れて記載（wāi qī niǔ bā）。同ページの「jǐ zhù」は例文中「脊柱」の読み。4つ目の例文は本文（p90）から。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-075","lesson":2,"type":"単語","role":"見出し語","zh":"挥发","pinyin":"huī fā","ja":"蒸発する／資産が消える／含み益が吹き飛ぶ","ja_ai":false,"ja_note":"","def_zh":"液体变成气体散发到空气中。金钱、资产、市值迅速减少或消失。","def_zh_ai":false,"examples":[{"zh":"短短半年时间，这个小区的房价跌了很多，不少业主的资产直接挥发了上百万。","ja":"わずか半年で、この団地の住宅価格は大きく下がり、多くの所有者の資産が100万元以上も一気に吹き飛んだ。","ja_ai":true},{"zh":"很多年轻人开玩笑说，工资刚发下来就挥发了，因为房租和信用卡一下子全扣掉了。","ja":"多くの若者は、給料は振り込まれた途端に蒸発してしまうと冗談を言う。家賃とクレジットカードの支払いで一気に引き落とされるからだ。","ja_ai":true},{"zh":"这家公司发布财报以后，市值一天之内挥发了几十亿，引发了市场恐慌。","ja":"この会社は決算発表後、時価総額が1日で数十億元も消え、市場にパニックが広がった。","ja_ai":false},{"zh":"仅过了一个春节，她看好的楼盘单价从7.5万-8万之间，降到了如今的6万多，一套房的总价又挥发掉近百万。","ja":"春節を一度過ぎただけで、彼女が目をつけていた物件の単価は7.5万〜8万元から現在の6万元余りまで下がり、1戸あたりの総額がまた100万元近く消えてしまった。","ja_ai":true}],"related":["酒精挥发"],"parent":"","pages":[90,93,103],"notes":"資料のピンイン表記は「huīfā」。def_zh は2つの意味を並べたもの（資料では第1義の後に「酒精挥发」を併記）。ja の3訳語は資料では空白・改行区切り。4つ目の例文は本文（p90）から。"},{"id":"2026春-2-076","lesson":2,"type":"単語","role":"見出し語","zh":"陷入……困境","pinyin":"xiàn rù … kùn jìng","ja":"困難な状況に陥る","ja_ai":false,"ja_note":"","def_zh":"陷入，指落在（不利的境地）；困境，指困难的境地。合指进入难以摆脱的困难局面。","def_zh_ai":false,"examples":[{"zh":"这家公司因为投资决策失误，一下子陷入了资金链断裂的困境，差点儿破产。","ja":"この会社は投資判断を誤ったため、一気に資金繰りが途絶える苦境に陥り、危うく倒産するところだった。","ja_ai":true},{"zh":"他同时打三份工还贷款，结果累倒了，陷入了身体和经济的双重困境。","ja":"彼はローン返済のために3つの仕事を掛け持ちした結果、過労で倒れ、体と経済の二重の苦境に陥った。","ja_ai":true},{"zh":"2023年以来，随着全国房价持续下行，一部分高杠杆购房者陷入“负资产”困境，房子市值低于未还贷款余额。","ja":"2023年以降、全国の住宅価格が下落し続ける中、高レバレッジで家を購入した人の一部は「負の資産」という苦境に陥り、住宅の時価がローン残高を下回っている。","ja_ai":true}],"related":["陷入经济困境","陷入资金困境","陷入债务困境","陷入进退两难的境地","陷入尴尬的局面","陷入被动","陷入孤独"],"parent":"","pages":[94,95,103],"notes":"まとめ p103 の表記は「陷入……的困境」（表記ゆれ）。資料のピンイン表記は「xiànrù … kùnjìng」。p95 の搭配: 陷入＋经济/资金/债务＋困境／陷入＋进退两难的境地／陷入＋尴尬（gān gà）的局面／陷入＋被动/孤独。3つ目の例文は本文（p94）から。"},{"id":"2026春-2-077","lesson":2,"type":"単語","role":"見出し語","zh":"动辄","pinyin":"dòng zhé","ja":"ちょっとしたことで～する、とかく～しがちだ","ja_ai":false,"ja_note":"","def_zh":"动不动就。指事情经常发生，且常带有负面评价。","def_zh_ai":false,"examples":[{"zh":"这个老板脾气很差，对员工动辄责骂，导致很多老员工都辞职了。","ja":"この社長は気性が荒く、何かにつけて社員を叱りつけるので、多くのベテラン社員が辞めてしまった。","ja_ai":true},{"zh":"大城市的生活成本太高了，出去吃一顿饭动辄几百块。","ja":"大都市は生活費が高すぎて、外食を一回すればともすると数百元かかる。","ja_ai":true},{"zh":"没有养成理财习惯的人，花钱没有规划，动辄超前消费，很容易陷入债务困境。","ja":"お金の管理の習慣がない人は計画なくお金を使い、何かと先取り消費をしがちで、借金苦に陥りやすい。","ja_ai":true},{"zh":"在小红书等社交平台上，“断供实录”类帖子动辄获得数万点赞，成为年轻购房者心中挥之不去的阴影。","ja":"小紅書などのSNSでは、「返済停止の実録」といった投稿がしばしば数万の「いいね」を集め、若い住宅購入者の心から消えない影となっている。","ja_ai":true}],"related":[],"parent":"","pages":[94,96,103],"notes":"資料のピンイン表記は「dòngzhé」。4つ目の例文は本文（p94）から。"},{"id":"2026春-2-078","lesson":2,"type":"成語","role":"見出し語","zh":"挥之不去","pinyin":"huī zhī bú qù","ja":"（心から）消え去らない、しつこく残る","ja_ai":false,"ja_note":"","def_zh":"（印象、情绪、感觉等）在脑海中残留，无法消除。原指用手赶也赶不走，比喻记忆或情感难以忘记。","def_zh_ai":false,"examples":[{"zh":"那场车祸已经过去三年了，但他每次开车时，恐惧的感觉仍然挥之不去。","ja":"あの交通事故から3年が経ったが、彼は運転するたびに恐怖感がいまだに消えない。","ja_ai":true},{"zh":"成功者的光环有时也会变成一种负担，让他们对失败的恐惧挥之不去。","ja":"成功者の栄光は時に重荷にもなり、失敗への恐怖がつきまとって離れない。","ja_ai":true},{"zh":"童年时留下的心理阴影，往往会在长大后依然挥之不去，悄悄影响一个人的性格和选择。","ja":"子供時代に受けた心のトラウマは、大人になってもなかなか払拭できず、性格や選択に静かに影響を与える。","ja_ai":false},{"zh":"在小红书等社交平台上，“断供实录”类帖子动辄获得数万点赞，成为年轻购房者心中挥之不去的阴影。","ja":"小紅書などのSNSでは、「返済停止の実録」といった投稿がしばしば数万の「いいね」を集め、若い住宅購入者の心から消えない影となっている。","ja_ai":true}],"related":[],"parent":"","pages":[94,97,103],"notes":"4つ目の例文は本文（p94）から。"},{"id":"2026春-2-079","lesson":2,"type":"単語","role":"見出し語","zh":"跌幅","pinyin":"diē fú","ja":"下げ幅；下落幅","ja_ai":false,"ja_note":"","def_zh":"（物价、指数等）下跌的幅度，通常用百分比（%）表示。","def_zh_ai":false,"examples":[{"zh":"这家公司的季度财报发布后，股价立刻跳水，最大跌幅达到了百分之八。","ja":"この会社の四半期決算発表後、株価はすぐに急落し、最大下落幅は8%に達した。","ja_ai":true},{"zh":"受国际油价下跌影响，汽油价格上周出现了百分之五的跌幅。","ja":"国際原油価格の下落を受けて、先週ガソリン価格は5%下落した。","ja_ai":true},{"zh":"股市连续三天大跌，累计跌幅超过了百分之十","ja":"株式市場は3日連続で大きく下落し、累計の下落幅は10%を超えた。","ja_ai":true},{"zh":"要加杠杆去买一个跌幅空间挺大的东西，确实不划算，风险也很大。","ja":"下落の余地がかなり大きいものをレバレッジをかけて買うのは、確かに割に合わないし、リスクも大きい。","ja_ai":true}],"related":["幅度","涨幅"],"parent":"","pages":[94,98,103],"notes":"資料のピンイン表記は「diēfú」。3つ目の例文は資料で句点なし（そのまま）。4つ目の例文は本文（p94）から。"},{"id":"2026春-2-080","lesson":2,"type":"単語","role":"見出し語","zh":"幅度","pinyin":"fú dù","ja":"幅／変動幅","ja_ai":true,"ja_note":"","def_zh":"事物变动的大小程度","def_zh_ai":true,"examples":[],"related":["跌幅","涨幅"],"parent":"","pages":[98,103],"notes":"p98 跌幅 スライドに「幅度 涨幅」と併記、まとめ p103 掲載。語釈・例文なし。ピンイン補完。"},{"id":"2026春-2-081","lesson":2,"type":"単語","role":"見出し語","zh":"涨幅","pinyin":"zhǎng fú","ja":"上げ幅／上昇幅","ja_ai":true,"ja_note":"","def_zh":"（物价、指数等）上涨的幅度","def_zh_ai":true,"examples":[{"zh":"物价涨幅落入可控区间，不会影响日常生活。","ja":"物価の上昇幅が管理可能な範囲に収まっており、日常生活には影響しない。","ja_ai":true}],"related":["跌幅","幅度"],"parent":"","pages":[51,98,103],"notes":"p98 跌幅 スライドに併記、まとめ p103 掲載。語釈なし。ピンイン補完。例文は 落入……区间 の例文（p51）から。"},{"id":"2026春-2-082","lesson":2,"type":"単語","role":"見出し語","zh":"刷到……帖子","pinyin":"shuā dào … tiě zi","ja":"（SNSで）～という投稿を目にする","ja_ai":false,"ja_note":"","def_zh":"刷，指在社交媒体上快速浏览信息；帖子，指在论坛、微博、小红书等平台上发布的文章或内容。合指在浏览信息时偶然看到某个帖子。","def_zh_ai":false,"examples":[{"zh":"昨天晚上我无聊刷手机，突然刷到一个帖子，说这家餐厅的菜很好吃，今天我就来试试了。","ja":"昨夜、暇つぶしにスマホを見ていたら、この店の料理がおいしいという投稿がたまたま目に入ったので、今日さっそく試しに来てみた。","ja_ai":true},{"zh":"他心情不好的时候，刷到前女友发的旅行帖子，心里更难受了。","ja":"気分が落ち込んでいるときに元恋人の旅行の投稿を目にして、彼はさらにつらくなった。","ja_ai":true},{"zh":"有时候刷到负面情绪的帖子，我会选择快速划过去，免得影响自己的心情。","ja":"ネガティブな投稿が目に入ったときは、自分の気分に影響しないよう、さっとスクロールして飛ばすようにしている。","ja_ai":true},{"zh":"那你这200万的贷款怎么还？我总能刷到这种帖子，太吓人了。","ja":"じゃあその200万元のローンはどうやって返すの？こういう投稿をしょっちゅう目にして、本当に怖い。","ja_ai":true}],"related":[],"parent":"","pages":[94,99,103],"notes":"まとめ p103 の表記は「刷到……的帖子」（表記ゆれ）。資料のピンイン表記は「shuā dào … tiězi」。4つ目の例文は本文（p94）から。"},{"id":"2026春-2-083","lesson":2,"type":"単語","role":"見出し語","zh":"叠buff","pinyin":"dié buff","ja":"バフを重ねる（好条件が重なる）","ja_ai":true,"ja_note":"ゲーム用語に由来する。本来の意味：ゲームにおける「buff」とは、キャラクターに追加の強化効果を与え、その能力を最大限に発揮させることを指す。「バフを重ねる（バフを盛る）」とは、複数の強化効果を同時に発動させ、キャラクターをさらに強くすることを意味する。派生した口語的な意味：有利な条件・強み・幸運などが次々と重なることを指す。また逆に、不利な条件や悪い出来事・不運が重なる場合にも使われる。","def_zh":"源自游戏用语；本义：在游戏中，\"buff\" 指的是为角色添加额外的增强效果，可以使角色的能力得到最大化发挥。\"叠 buff\" 则是指激活多个增益效果，使得角色的能力更强。引申口语义：接连凑齐多个有利条件、优势、好运；也可指凑齐多个不利因素、坏运气（正反都能用）。","def_zh_ai":false,"examples":[{"zh":"这款手机本来性能就很强，再加上定价比竞争对手低百分之二十，相当于给产品叠了双重buff，一上市就被抢购一空。","ja":"この携帯電話はもともと性能が高いうえ、価格も競合より20%安く、製品にバフを二重に重ねたようなもので、発売と同時に売り切れた。","ja_ai":true},{"zh":"他学历过硬，能力突出，性格也沉稳靠谱，求职优势buff叠满。","ja":"彼は学歴も申し分なく、能力も抜きん出ていて、性格も落ち着いていて頼りになり、就職での強みというバフが全部盛りだ。","ja_ai":true},{"zh":"长期熬夜、饮食混乱、压力过大、缺乏运动，负面buff直接叠满了。","ja":"長期間の夜更かし、乱れた食生活、過度のストレス、運動不足と、マイナスのバフが完全に積み重なっている。","ja_ai":true},{"zh":"房贷多付的利息＋房产持续缩水的风险，相当于给自己的财务风险叠了双重buff，这也是大多数全款买房的人所共同面临的购房处境。","ja":"住宅ローンで余分に払う利息と、不動産価値が目減りし続けるリスクは、自分の財務リスクに二重のバフを重ねるようなものであり、これは一括で家を買う人の多くが共通して直面している状況でもある。","ja_ai":true}],"related":["叠debuff"],"parent":"","pages":[100,101,103],"notes":"ピンインは資料に「dié」のみ。buff は英語のまま（音節数チェックで不一致になる）。例文2・3の「buff 叠满」「负面 buff」の空白は詰めた。4つ目の例文は本文（p100）から。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-085","lesson":2,"type":"単語","role":"関連語","zh":"精装","pinyin":"jīng zhuāng","ja":"内装仕上げ済み（の住宅）／高品質な内装","ja_ai":true,"ja_note":"","def_zh":"（房屋）精细装修；交房时已完成较高标准的装修","def_zh_ai":true,"examples":[],"related":["硬装","软装"],"parent":"","pages":[102],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p102 討論（租房・买房）ページの書き込み「精装 硬装 软装」。ピンイン補完。"},{"id":"2026春-2-086","lesson":2,"type":"単語","role":"関連語","zh":"硬装","pinyin":"yìng zhuāng","ja":"（内装の）基礎工事・固定部分の内装","ja_ai":true,"ja_note":"","def_zh":"房屋装修中固定、不能移动的部分，如水电、墙面、地面、吊顶等","def_zh_ai":true,"examples":[],"related":["精装","软装"],"parent":"","pages":[102],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p102 の書き込み「精装 硬装 软装」。ピンイン補完。"},{"id":"2026春-2-087","lesson":2,"type":"単語","role":"関連語","zh":"软装","pinyin":"ruǎn zhuāng","ja":"インテリア装飾（家具・カーテンなど可動の装飾）","ja_ai":true,"ja_note":"","def_zh":"装修完成后可移动、可更换的装饰，如家具、窗帘、灯具、布艺等","def_zh_ai":true,"examples":[],"related":["精装","硬装"],"parent":"","pages":[102],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p102 の書き込み「精装 硬装 软装」。ピンイン補完。"},{"id":"2026春-2-088","lesson":2,"type":"成語","role":"関連語","zh":"集思广益","pinyin":"jí sī guǎng yì","ja":"衆知を集める／広く意見を募る","ja_ai":true,"ja_note":"","def_zh":"集中众人的智慧，广泛吸收有益的意见","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[102],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p102 討論ページ末尾の書き込み。ピンイン補完。"},{"id":"2026春-2-089","lesson":2,"type":"単語","role":"見出し語","zh":"重启","pinyin":"chóng qǐ","ja":"再起動する／再スタートする","ja_ai":true,"ja_note":"","def_zh":"重新启动；比喻重新开始（工作、生活等）","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[103],"notes":"まとめ p103 のみ掲載。本文・語釈・例文なし（本文中に該当語が見当たらない）。ピンイン補完。"},{"id":"2026春-2-090","lesson":2,"type":"単語","role":"見出し語","zh":"淡化","pinyin":"dàn huà","ja":"薄れる、弱まる","ja_ai":false,"ja_note":"","def_zh":"逐渐变淡、减弱","def_zh_ai":true,"examples":[{"zh":"国人对房子的执念，在90后这代人身上并没有被淡化，随着年岁渐长，房子给人带来的安全感和归属感反而日渐浓烈。","ja":"中国人の家に対するこだわりは、90年代生まれの世代でも薄れておらず、年齢を重ねるにつれて、家がもたらす安心感や帰属感はむしろ日に日に強まっている。","ja_ai":true}],"related":[],"parent":"","pages":[104,105],"notes":"まとめ p105 掲載。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-091","lesson":2,"type":"単語","role":"見出し語","zh":"日渐浓烈","pinyin":"rì jiàn nóng liè","ja":"日に日に強まる／ますます強くなる","ja_ai":false,"ja_note":"","def_zh":"一天比一天浓厚、强烈","def_zh_ai":true,"examples":[{"zh":"国人对房子的执念，在90后这代人身上并没有被淡化，随着年岁渐长，房子给人带来的安全感和归属感反而日渐浓烈。","ja":"中国人の家に対するこだわりは、90年代生まれの世代でも薄れておらず、年齢を重ねるにつれて、家がもたらす安心感や帰属感はむしろ日に日に強まっている。","ja_ai":true}],"related":[],"parent":"","pages":[104,105],"notes":"まとめ p105 掲載。ピンイン補完。四字だが成語ではない語句のため 単語 扱い。例文は本文から採録。"},{"id":"2026春-2-092","lesson":2,"type":"成語","role":"見出し語","zh":"随心所欲","pinyin":"suí xīn suǒ yù","ja":"思いのままに、好き勝手に","ja_ai":false,"ja_note":"","def_zh":"完全按照自己的心意，想怎么做就怎么做","def_zh_ai":true,"examples":[{"zh":"璀璨收房后，最近一直在忙着装修，她自己动手刷墙，搬家，随心所欲地把小房子一点一点布置成自己喜欢的风格，不用担心租房时因为改装得太好而被房东收回。","ja":"璀璨は家の引き渡しを受けた後、最近はずっと内装に追われている。自分で壁を塗り、引っ越しをし、小さな家を思いのままに少しずつ自分好みのスタイルに整えている。賃貸のときのように、改装しすぎて大家に部屋を取り上げられる心配もない。","ja_ai":true}],"related":[],"parent":"","pages":[104,105],"notes":"まとめ p105 掲載。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-093","lesson":2,"type":"単語","role":"見出し語","zh":"原木风","pinyin":"yuán mù fēng","ja":"ナチュラルウッド風、無垢材風インテリア","ja_ai":false,"ja_note":"","def_zh":"以天然木材的原色、原纹理为主要元素的装修风格","def_zh_ai":true,"examples":[{"zh":"原木风的家里，每一个细节都是两人精心设计的。","ja":"ナチュラルウッド風の家は、細部の一つひとつまで二人が丹念に設計したものだ。","ja_ai":true}],"related":[],"parent":"","pages":[104,105],"notes":"まとめ p105 掲載。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-094","lesson":2,"type":"単語","role":"見出し語","zh":"承重墙","pinyin":"chéng zhòng qiáng","ja":"耐力壁","ja_ai":false,"ja_note":"","def_zh":"建筑中承受上部重量、不能随意拆除的墙体","def_zh_ai":true,"examples":[{"zh":"他们砸掉了非承重墙，做成开放式厨房，通铺了地板，追求“一推开门就能从厨房看到餐厅客厅的通透感”。","ja":"二人は耐力壁ではない壁を取り壊してオープンキッチンにし、床材を全面に張り、「ドアを開けた瞬間にキッチンからダイニングやリビングまで見渡せる開放感」を追求した。","ja_ai":true}],"related":["非承重墙"],"parent":"","pages":[104,105],"notes":"まとめ p105 掲載。ピンイン補完。本文は「非承重墙」。例文は本文から採録。"},{"id":"2026春-2-095","lesson":2,"type":"単語","role":"見出し語","zh":"通铺","pinyin":"tōng pù","ja":"全面張り（床材などを部屋全体に張り巡らす）","ja_ai":false,"ja_note":"","def_zh":"把地板等材料连续地铺满整个房间","def_zh_ai":true,"examples":[{"zh":"他们砸掉了非承重墙，做成开放式厨房，通铺了地板，追求“一推开门就能从厨房看到餐厅客厅的通透感”。","ja":"二人は耐力壁ではない壁を取り壊してオープンキッチンにし、床材を全面に張り、「ドアを開けた瞬間にキッチンからダイニングやリビングまで見渡せる開放感」を追求した。","ja_ai":true}],"related":[],"parent":"","pages":[104,105],"notes":"まとめ p105 掲載。ピンイン補完（「通铺」は大部屋の雑魚寝ベッドの意味もあるが、本課は床材の全面張り）。例文は本文から採録。"},{"id":"2026春-2-096","lesson":2,"type":"単語","role":"見出し語","zh":"通透感","pinyin":"tōng tòu gǎn","ja":"開放感、抜け感（部屋の広々とした視覚的な感じ）","ja_ai":false,"ja_note":"","def_zh":"空间开阔、视线通畅、采光通风良好的感觉","def_zh_ai":true,"examples":[{"zh":"他们砸掉了非承重墙，做成开放式厨房，通铺了地板，追求“一推开门就能从厨房看到餐厅客厅的通透感”。","ja":"二人は耐力壁ではない壁を取り壊してオープンキッチンにし、床材を全面に張り、「ドアを開けた瞬間にキッチンからダイニングやリビングまで見渡せる開放感」を追求した。","ja_ai":true}],"related":[],"parent":"","pages":[104,105],"notes":"まとめ p105 の日本語欄に掲載（中国語欄には無く、日本語欄の並びから対応付け）。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-097","lesson":2,"type":"成語","role":"見出し語","zh":"直截了当","pinyin":"zhí jié liǎo dàng","ja":"ストレートに、遠回しなく、率直に、ずばりと","ja_ai":false,"ja_note":"","def_zh":"形容说话、做事不绕弯子，不兜圈子，开门见山，爽快坦率，直接点明本意或态度。","def_zh_ai":false,"examples":[{"zh":"和成熟的人沟通不用拐弯抹角，有想法就可以直截了当说出来，反而能节省彼此的时间和精力。","ja":"成熟した人とのコミュニケーションでは遠回しに言う必要はなく、考えがあればストレートに言えばいい。そのほうがかえってお互いの時間と労力の節約になる。","ja_ai":true},{"zh":"面对工作中的不合理安排，他敢于直截了当提出意见，从不刻意迎合领导的想法。","ja":"仕事上の不合理な割り振りに対して、彼は率直に意見を言うことができ、決してわざと上司の考えに迎合しない。","ja_ai":true},{"zh":"在感情里与其互相猜测纠结，不如直截了当表达心意，避免产生不必要的误会和内耗（nèihào）。","ja":"恋愛ではお互いに探り合って悩むより、率直に気持ちを伝えたほうが、不要な誤解や消耗を避けられる。","ja_ai":true},{"zh":"她可以直截了当地留父亲多住几天，“这个房子不是谁的家，是我的家。”","ja":"彼女は父親にもう何日か泊まっていってと率直に引き留められる。「この家は誰かの家じゃなくて、私の家なんだ」","ja_ai":true}],"related":["拐弯抹角","开门见山"],"parent":"","pages":[106,107],"notes":"本文 p106 の語を p107 で解説（まとめスライドは無し）。p107 末尾の「guǎiwān mòjiǎo」「cāicè jiūjié」は例文中の 拐弯抹角・猜测纠结 の読み。4つ目の例文は本文（p106）から。"},{"id":"2026春-2-098","lesson":2,"type":"成語","role":"関連語","zh":"拐弯抹角","pinyin":"guǎi wān mò jiǎo","ja":"遠回しに言う／回りくどい","ja_ai":true,"ja_note":"","def_zh":"沿着弯弯曲曲的路走；比喻说话、写文章不直截了当","def_zh_ai":true,"examples":[{"zh":"和成熟的人沟通不用拐弯抹角，有想法就可以直截了当说出来，反而能节省彼此的时间和精力。","ja":"成熟した人とのコミュニケーションでは遠回しに言う必要はなく、考えがあればストレートに言えばいい。そのほうがかえってお互いの時間と労力の節約になる。","ja_ai":true}],"related":["直截了当"],"parent":"直截了当","pages":[107],"notes":"直截了当 の例文中の語で、ページ末尾に読み「guǎiwān mòjiǎo」が記載（反義語として関連語化）。"},{"id":"2026春-2-099","lesson":2,"type":"単語","role":"見出し語","zh":"串串房","pinyin":"chuàn chuàn fáng","ja":"安普請の細切れ賃貸物件","ja_ai":true,"ja_note":"不動産仲介業者や又貸し業者、投資目的のオーナーなどによって、低コストで短期間にリフォームされたあと、高い家賃で貸し出される物件のこと。特徴としては、部屋が非常に狭い、仕切りが多い（1つの部屋をいくつもの小部屋に分けている）、内装が安っぽくデザインも画一的、家具は一見おしゃれだが実際の品質は低い、風通しや日当たりが悪い、主に若い賃貸入居者向けである、などが挙げられる。","def_zh":"被中介、二房东、投资客低成本快速装修后，再高价出租的房子。特点通常有：面积很小，隔断很多（一个房子被分成很多小间），装修廉价、风格统一，家具看起来“精致”，实际质量差，通风采光不好，专门面向年轻租客。","def_zh_ai":false,"examples":[{"zh":"以前她住在高碑店十几平的串串房里，猫晒不到太阳，她担心猫会生病。","ja":"以前彼女は高碑店にある十数平米の「串串房」に住んでいて、猫が日光浴できず、病気にならないか心配していた。","ja_ai":true}],"related":[],"parent":"","pages":[108,109,110],"notes":"ピンイン補完。同じ日本語説明が p110（优绩主义 のページ）にも重複掲載。例文は本文から採録。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-100","lesson":2,"type":"単語","role":"見出し語","zh":"优绩主义","pinyin":"yōu jì zhǔ yì","ja":"能力主義／メリトクラシー","ja_ai":true,"ja_note":"","def_zh":"以能力、成绩和努力为标准，分配社会资源与地位的价值观。","def_zh_ai":false,"examples":[{"zh":"她反思过去的自己，容易被优绩主义捆绑，为了在事业上干出点成绩，时常没日没夜地剪片子，日子过得天昏地暗。","ja":"彼女はかつての自分を振り返り、能力主義に縛られやすく、仕事で成果を出そうと昼夜を問わず動画を編集し、目の回るような日々を送っていたと反省している。","ja_ai":true}],"related":[],"parent":"","pages":[108,110],"notes":"ピンイン補完。p110 の特徴: 学历高才有价值／工作厉害才值得被认可／必须一直努力／必须不断进步／不能停下来／休息会有罪恶感。p110 の日本語文は 串串房 の説明の重複で 优绩主义 の訳ではないため不採用、ja は AI 補完。例文は本文から採録。"},{"id":"2026春-2-101","lesson":2,"type":"単語","role":"見出し語","zh":"托底","pinyin":"tuō dǐ","ja":"下支えする／セーフティネットになる","ja_ai":true,"ja_note":"下から支えること。比喩的には、最低限の基準やラインを守り、最も基本的な保障を提供することを指す。また比喩的には、後ろ盾となって支援したり、責任を引き受けたり、リスクをカバーしたりすることを指す。","def_zh":"从底部托住；比喻守住最低标准、底线，提供最基础保障。比喻作为后盾，给予支持、兜底承担风险。","def_zh_ai":false,"examples":[{"zh":"“没贷款就没那么慌，”即便暂时失业，还有小家给自己托底。","ja":"「ローンがなければそんなに慌てない」。たとえ一時的に失業しても、自分を支えてくれる小さな家がある。","ja_ai":true}],"related":["托举","兜底"],"parent":"","pages":[111,113],"notes":"資料ではピンインと語釈が連続（tuō dǐ 从底部…）していたため分離。例文は本文から採録。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-102","lesson":2,"type":"単語","role":"見出し語","zh":"停摆","pinyin":"tíng bǎi","ja":"停止する／ストップする","ja_ai":true,"ja_note":"元々は時計の振り子が止まり、時計が進まなくなることを指す。現在は主に、物事・業界・イベント・事業などが途中で稼働を停止し、実施を一時中断して停滞した状態になることを比喩的に言う。","def_zh":"原指钟表停止摆动不走了；现多用于比喻事情、行业、活动、事业等中途停止运行、暂停开展，陷入停滞状态。","def_zh_ai":false,"examples":[{"zh":"受到市场影响，不少线下门店被迫停摆，大家只能暂时调整经营方式。","ja":"市場の影響を受けて、多くの実店舗が営業停止を余儀なくされ、皆一時的に経営方法を見直すしかなかった。","ja_ai":true},{"zh":"连续多日暴雨让户外工程全面停摆，工作人员只好等待天气好转再开工。","ja":"連日の豪雨で屋外工事が全面的にストップし、作業員は天気が回復するのを待って工事を再開するしかなかった。","ja_ai":true},{"zh":"对徐熙以及与她处境相似的年轻人而言，全款买房的意义在于，虽然工作停摆了，但房子还在，人生也没有彻底失控。","ja":"徐熙や彼女と似た境遇の若者にとって、一括で家を買う意味は、仕事が止まっても家は残り、人生が完全にコントロールを失うことはないという点にある。","ja_ai":true}],"related":[],"parent":"","pages":[112],"notes":"3つ目の例文は本文（p112）から。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-103","lesson":2,"type":"成語","role":"関連語","zh":"感同身受","pinyin":"gǎn tóng shēn shòu","ja":"我が身のことのように感じる","ja_ai":true,"ja_note":"","def_zh":"虽然没有亲身经历，但感受就像亲身经历一样","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[113],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p113 討論ページの書き込み。ピンイン補完。"},{"id":"2026春-2-104","lesson":2,"type":"単語","role":"関連語","zh":"首付比例","pinyin":"shǒu fù bǐ lì","ja":"頭金比率","ja_ai":true,"ja_note":"","def_zh":"首付款占房屋总价的比例","def_zh_ai":true,"examples":[{"zh":"对年轻人来说，首付比例直接影响刚需门槛。","ja":"若者にとって、頭金の比率は実需の参入ハードルに直接影響する。","ja_ai":true}],"related":["首付"],"parent":"首付","pages":[50,55,60,113],"notes":"p113 討論ページの書き込み。刚需门槛 の例文（p50）、高杠杆买房 の語釈（p55）にも出現。ピンイン補完。"},{"id":"2 le":"見出し語","zh":"爆款","pinyin":"bào kuǎn","ja":"ヒット作","ja_ai":false,"ja_note":"","def_zh":"非常受欢迎、销量或关注度极高的作品或商品","def_zh_ai":true,"examples":[{"zh":"对电影业来说，比今天有没有爆款更重要的是，明天还有没有人、有没有耐心去等待一部电影这样慢慢长出来。","ja":"映画業界にとって、今日ヒット作があるかどうかよりも大切なのは、明日もなお、人々が一つの映画がゆっくりと育っていくのを待つ気持ちや忍耐を持ち続けられるかどうかである。","ja_ai":false}],"related":[],"parent":"","pages":[127,138,174,175],"notes":"ピンイン補完。日本語訳は p130 の本文訳より。例文は資料の本文から採録（訳は資料の本文訳）。p174・p175（「年度爆款」）にも出る。"},{"id":"2026春-3-009","lesson":3,"type":"慣用句","role":"見出し語","zh":"名不见经传","pinyin":"míng bú jiàn jīng zhuàn","ja":"無名（名は経伝に見えず）","ja_ai":false,"ja_note":"古代の経典や歴史書に名前や事績が記されていないこと。転じて、名声がなく無名であり、世間にあまり知られていないことをいう。人・企業・地域・作品などに用いられる。","def_zh":"经传：古代被奉为典范的典籍、史书。名字没有记载在典籍史书里，形容没有名气、不出名、不起眼，很少被世人知晓；可用于人、企业、地方、作品。","def_zh_ai":false,"examples":[{"zh":"这家小店的创始人早年名不见经传，靠着扎实的产品品质慢慢收获了全国各地的忠实顾客。","ja":"この店の創業者は昔は無名で世に知られていなかったが、確かな商品の品質によって全国各地の固定客を徐々に獲得した。","ja_ai":false},{"zh":"赛前这名运动员还名不见经传，凭借决赛超常发挥一举拿下了全国赛事的冠军。","ja":"試合前までこの選手は無名の存在だったが、決勝で絶好のパフォーマンスを見せ一気に全国大会優勝を手にした。","ja_ai":false}],"related":[],"parent":"","pages":[127,129,138],"notes":"五字のため type は慣用句（一般には成語とも）。日本語訳は p130 の本文訳より。p129 の日本語解説は ja_note へ。例文1の「扎实」に資料ではピンイン注記（zhā shi）あり、例文からは除いた。"},{"id":"2026春-3-010","lesson":3,"type":"単語","role":"見出し語","zh":"整块时间","pinyin":"zhěng kuài shí jiān","ja":"まとまった時間","ja_ai":true,"ja_note":"","def_zh":"完整、连续而不被打断的一段时间","def_zh_ai":true,"examples":[{"zh":"《给阿嬷的情书》热映证明，观众乐于消费故事、人物、冲突和情感，好电影会吸引人走进电影院，把整块时间和情绪信任地交出来。","ja":"『おばあちゃんへの手紙』の大ヒットは、観客が物語や登場人物、葛藤、そして感情に喜んでお金を払うことを証明している。優れた映画は人々を映画館へと引き寄せ、自分の時間と感情をまるごと作品に委ねようという気持ちにさせるのである。","ja_ai":false}],"related":[],"parent":"","pages":[127,138],"notes":"ピンイン補完。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-011","lesson":3,"type":"単語","role":"見出し語","zh":"拓荒者","pinyin":"tuò huāng zhě","ja":"開拓者","ja_ai":false,"ja_note":"","def_zh":"开垦荒地的人；比喻在某一领域开创新局面的先行者","def_zh_ai":true,"examples":[{"zh":"很多人认为，蓝鸿春让更多中国观众开始注意潮汕文化，因此他也被称为“潮汕电影拓荒者”。","ja":"多くの人は、藍鴻春が中国の観客に潮汕文化への関心を抱かせるきっかけを作ったと評価しており、そのため彼はしばしば「潮汕映画の開拓者（潮汕映画のパイオニア）」とも呼ばれている。","ja_ai":false}],"related":[],"parent":"","pages":[132,138],"notes":"本文中に「拓荒者（tuò huāng zhě 開拓者）」と注記。例文は資料の本文から採録（訳は資料の本文訳）。本文中のピンイン注記は例文から除いた。"},{"id":"2026春-3-012","lesson":3,"type":"単語","role":"見出し語","zh":"票房飘红","pinyin":"piào fáng piāo hóng","ja":"興行成績が伸びる","ja_ai":false,"ja_note":"","def_zh":"原指股市中红色代表上涨，引申为票房成绩非常好、持续增长。","def_zh_ai":false,"examples":[{"zh":"10多年前，以《爸爸去哪儿》《奔跑吧！兄弟》为代表的综艺大电影接连上映，票房飘红。","ja":"10数年前には、爸爸去哪儿 や 奔跑吧！兄弟 に代表される「バラエティー番組発の映画」が次々と公開され、興行的な成功を収めた。","ja_ai":false}],"related":[],"parent":"","pages":[134,135,138,139],"notes":"ピンイン補完。四字だが成語ではないため単語扱い。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-013","lesson":3,"type":"慣用句","role":"見出し語","zh":"尝到甜头","pinyin":"cháng dào tián tou","ja":"うまみを知る；味をしめる","ja_ai":true,"ja_note":"","def_zh":"得到了好处或利益，因而想继续这样做","def_zh_ai":true,"examples":[{"zh":"这让行业尝到了甜头，原来，热度可以平移成票房，电影可以先是别的东西，再顺便“变”成电影。","ja":"この成功によって業界は大きな手応えを得た。つまり、人気や話題性はそのまま興行収入へと転換できること、そして映画はまず別のコンテンツとして人気を集め、その後で「映画化」されることも可能だと分かったのである。","ja_ai":false}],"related":[],"parent":"","pages":[134,138,139],"notes":"ピンイン補完。本文は「尝到了甜头」。訳は p137 で「大きな手応えを得た」。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-014","lesson":3,"type":"単語","role":"見出し語","zh":"大数据电影","pinyin":"dà shù jù diàn yǐng","ja":"ビッグデータ映画／データ分析主導型映画","ja_ai":false,"ja_note":"","def_zh":"利用用户数据、搜索趋势、社交媒体数据等分析观众喜好，并据此开发、制作和营销的电影。","def_zh_ai":false,"examples":[{"zh":"然后，是“大数据电影”的兴起。","ja":"その後、「ビッグデータ映画」と呼ばれる潮流が台頭した。","ja_ai":false}],"related":[],"parent":"","pages":[134,135,138,139],"notes":"ピンイン補完。資料の訳は空白区切りで2つ（「／」で区切った）。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-015","lesson":3,"type":"単語","role":"見出し語","zh":"用户基础","pinyin":"yòng hù jī chǔ","ja":"ユーザー基盤","ja_ai":false,"ja_note":"","def_zh":"已经拥有的用户数量和用户群体。","def_zh_ai":false,"examples":[{"zh":"这类电影项目不再首先被当成作品来构思，而被当作一个已经有用户基础、热搜潜力和传播模板的工业化产品。","ja":"この種の映画プロジェクトは、もはや最初から一つの作品として構想されるのではなく、既にユーザー基盤を持ち、SNSで話題化する可能性や拡散のテンプレートを備えた工業製品として扱われるようになった。","ja_ai":false}],"related":["粉丝群","会员群","固定观众群"],"parent":"","pages":[134,135,138,139],"not ン補完。まとめページには無いが p140 で語釈付き解説。日本語訳は p137 の本文訳より。資料の補足：因此：选年轻偶像演员/强调爱情线。例文2は本文から採録。"},{"id":"2026春-3-023","lesson":3,"type":"単語","role":"見出し語","zh":"宣发路径","pinyin":"xuān fā lù jìng","ja":"宣伝・プロモーションの導線","ja_ai":false,"ja_note":"","def_zh":"(宣传+发行)一部电影如何被推广给观众。","def_zh_ai":false,"examples":[{"zh":"有些电影项目，甚至一开始就被放在“品牌联营”“影剧联动”的逻辑里讨论，制作方更关心的是IP效应、是演员流量、是用户画像、是宣发路径。","ja":"中には、企画段階からすでに「ブランドとの共同展開」や「映画とドラマの連動」という発想のもとで議論される作品もあった。制作側がより重視したのは、作品そのものよりも、IP効果、俳優の集客力・ファン流入効果、ユーザー属性の分析、宣伝・プロモーションの導線といった要素だったのである。","ja_ai":false}],"related":["宣传","发行"],"parent":"","pages":[134,139,140,141],"notes":"ピンイン補完。まとめページには無いが p140 で語釈付き解説。日本語訳は p137 の本文訳より。資料の例：第一步：微博热搜／第二步：短视频营销／第三步：明星直播宣传／第四步：主演参加电视节目。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-024","lesson":3,"type":"単語","role":"見出し語","zh":"凸显","pinyin":"tū xiǎn","ja":"際立たせる；顕著に表れる；浮き彫りにする","ja_ai":false,"ja_note":"","def_zh":"像凸起一样明显地被看到或感知到。清楚地显露出来；使鲜明突出。","def_zh_ai":false,"examples":[{"zh":"随着经验不断积累，他的领导能力逐渐凸显出来。","ja":"経験を積み重ねるにつれて、彼のリーダーシップが次第に際立ってきた。","ja_ai":true},{"zh":"这次合作中，团队沟通的重要性被进一步凸显。","ja":"今回の協力で、チーム内コミュニケーションの重要性がいっそう浮き彫りになった。","ja_ai":true},{"zh":"这次事故凸显了安全生产管理中的长期漏洞。","ja":"今回の事故は、安全生産管理における長年の欠陥を浮き彫りにした。","ja_ai":true},{"zh":"青少年视力下降是个日渐凸显的问题。","ja":"青少年の視力低下は、日に日に顕著になっている問題だ。","ja_ai":true}],"related":["凹凸不平"],"parent":"","pages":[145,146,155,171],"notes":""},{"id":"2026春-3-025","lesson":3,"type":"成語","role":"関連語","zh":"凹凸不平","pinyin":"āo tū bù píng","ja":"でこぼこしている","ja_ai":true,"ja_note":"","def_zh":"表面高低不平，不平整","def_zh_ai":true,"examples":[],"related":["凸显"],"parent":"凸显","pages":[146],"notes":"p146 の凸显の解説中に名前とピンインのみ掲載。"},{"id":"2026春-3-026","lesson":3,"type":"単語","role":"見出し語","zh":"样本","pinyin":"yàng běn","ja":"サンプル；標本；見本；事例","ja_ai":false,"ja_note":"","def_zh":"从整体里抽取出来的一部分，用作同类事物的代表，供研究、检验、参考。也可指范例、典型案例。","def_zh_ai":false,"examples":[{"zh":"我们挑选不同年龄的人群作为样本，开展这次社会调查。","ja":"私たちは異なる年齢層の人々をサンプルとして選び、今回の社会調査を実施した。","ja_ai":true},{"zh":"这份作品可以当作优秀样本，供初学者学习和参考。","ja":"この作品は優れた見本として、初心者の学習や参考に役立てることができる。","ja_ai":true},{"zh":"如果样本数量太少，那么结论可能不够准确。","ja":"サンプル数が少なすぎると、結論が十分に正確でない可能性がある。","ja_ai":true},{"zh":"网络平台总喜欢复制成功样本，因此类似的作品越来越多。","ja":"ネットのプラットフォームはいつも成功事例をコピーしたがるので、似たような作品がますます増えている。","ja_ai":true}],"related":["抽取样本","收集样本","数据样本","调查样本","典型样本","样本分析"],"parent":"","pages":[145,148,155],"notes":""},{"id":"2026春-3-027","lesson":3,"type":"単語","role":"見出し語","zh":"倾斜","pinyin":"qīng xié","ja":"傾く；（関心・資源が）偏る","ja_ai":true,"ja_note":"","def_zh":"偏向某一方；（资源、关注等）向某一方面集中","def_zh_ai":true,"examples":[{"zh":"而平台和大数据最擅长识别的，是已经成功过的模式，因此会向熟悉的明星、熟悉的题材、熟悉的情绪和熟悉的成功样本倾斜。","ja":"そして、プラットフォームやビッグデータが最も得意としているのは、すでに成功したパターンを見つけ出すことである。そのため、よく知られたスター、定番の題材、馴染みのある感情表現、そして過去に成功した事例へと資源や関心が集中しやすくなる。","ja_ai":false}],"related":[],"parent":"","pages":[145,155],"notes":"ピンイン補完。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-028","lesson":3,"type":"単語","role":"見出し語","zh":"循着","pinyin":"xún zhe","ja":"～に沿って；～をたどって；～に従って；～を手掛かりにして","ja_ai":false,"ja_note":"","def_zh":"沿着某个方向、线索、规律、路径前进。“循”有“遵循、依照”的意思，强调被动地跟随既有痕迹，带有探索、寻找的意味。","def_zh_ai":false,"examples":[{"zh":"他循着儿时的记忆，再次回到了故乡的那棵老树下。","ja":"彼は幼い頃の記憶をたどって、再び故郷のあの古い木の下に戻ってきた。","ja_ai":true},{"zh":"企业如果只循着过去成功的经验发展，就可能失去创新能力。","ja":"企業が過去の成功体験に従って発展するだけなら、イノベーションの力を失いかねない。","ja_ai":true},{"zh":"循着淡淡的花香望去，才发现墙角开满了小花。","ja":"ほのかな花の香りをたどって目をやると、壁の隅に小さな花が一面に咲いているのに気づいた。","ja_ai":true},{"zh":"循着前人留下的经验前行，能让我们少走许多弯路。","ja":"先人が残した経験に沿って進めば、多くの回り道をせずに済む。","ja_ai":true}],"related":["循规蹈矩","循序渐进"],"parent":"","pages":[145,147,155],"notes":""},{"id":"2026春-3-029","lesson":3,"type":"成語","role":"見出し語","zh":"循规蹈矩","pinyin":"xún guī dǎo jǔ","ja":"規則を守り堅く行う；型にはまる；杓子定規","ja_ai":false,"ja_note":"","def_zh":"指严格遵守规矩、法度，一举一动都依照准则行事；也形容人保守、拘泥旧例，不敢变通。","def_zh_ai":false,"examples":[],"related":["循着","循序渐进"],"parent":"","pages":[147,155,171],"notes":"p147 で循着の関連成語として解説され、まとめページ p155・p171 に掲載されているため見出し語扱い。p147 では日本語訳2組が語釈の後にまとめて並んでおり、内容から対応付けた。"},{"id":"2026春-3-030","lesson":3,"type":"成語","role":"見出し語","zh":"循序渐进","pinyin":"xún xù jiàn jìn","ja":"段階を追って進める；順を追って徐々に進む","ja_ai":false,"ja_note":"","def_zh":"按照一定的步骤、顺序逐步推进、提高，不急于求成。多用于学习、训练、做事等场景。","def_zh_ai":false,"examples":[],"related":["循着","循规蹈矩"],"parent":"","pages":[147,155,171],"notes":"p147 で循着の関連成語として解説され、まとめページ p155・p171 に掲載されているため見出し語扱い。p147 では日本語訳2組が語釈の後にまとめて並んでおり、内容から対応付けた。"},{"id":"2026春-3-031","lesson":3,"type":"単語","role":"見出し語","zh":"切片传播","pinyin":"qiē piàn chuán bō","ja":"切り抜き動画による拡散","ja_ai":true,"ja_note":"映画を数十秒から数分程度の見どころだけに切り出し、ショート動画プラットフォームで素早く拡散して注目や流量を獲得する手法を指す。例えば、印象的なセリフ、盛り上がるシーンやクライマックス、意外な展開やどんでん返し、俳優の魅力が際立つ映像などを短く編集して配信し、視聴者の興味を瞬時に引きつけることで拡散を狙う。","def_zh":"把一部电影剪成几十秒到几分钟的高能片段放到短视频平台快速扩散、博取流量。","def_zh_ai":false,"examples":[{"zh":"从把电影当成流量兑现的工具，到把已有的热度当成作品生命力，再到平台和数据反过来定义电影应该长什么样：更快、更准、更能切片传播、更能快速激发多巴胺分泌。","ja":"映画を「話題性や流量を収益化するための道具」として捉えることから始まり、やがて既存の人気や注目度そのものを作品の生命力とみなすようになり、さらに進んでは、プラットフォームやデータが逆に「映画とはどうあるべきか」を定義するようになった。すなわち、より速く、より正確に、より短く切り分けて拡散しやすく、そしてより素早く人々のドーパミン分泌を刺激できるものが求められるようになったのである。","ja_ai":false}],"related":["精彩台词","爆点场面","反转","颜值镜头"],"parent":"","pages":[149,159,160],"notes":"ピンイン補完。まとめページには無いが p160 で語釈付き解説。資料には短い訳語が無いため ja は AI の短訳、p160 の日本語解説は ja_note へ。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-032","lesson":3,"type":"単語","role":"見出し語","zh":"多巴胺","pinyin":"duō bā àn","ja":"ドーパミン","ja_ai":false,"ja_note":"ドーパミンは脳内で分泌される神経伝達物質の一種であり、その本質的な役割は「快楽を生み出すこと」ではなく、「欲求や期待を駆り立てること」にある。ドーパミンは報酬を実際に得たときよりも、むしろ「これから報酬が得られる」と期待しているときに最も多く分泌され、実際に報酬を手にした瞬間には、かえって分泌量が低下する傾向がある。","def_zh":"大脑分泌的一种神经递质，核心功能不是“产生快乐”，而是驱动欲望和期待。它在“预期获得奖励”时分泌最多，在“实际获得奖励”时反而下降。","def_zh_ai":false,"examples":[{"zh":"从把电影当成流量兑现的工具，到把已有的热度当成作品生命力，再到平台和数据反过来定义电影应该长什么样：更快、更准、更能切片传播、更能快速激发多巴胺分泌。","ja":"映画を「話題性や流量を収益化するための道具」として捉えることから始まり、やがて既存の人気や注目度そのものを作品の生命力とみなすようになり、さらに進んでは、プラットフォームやデータが逆に「映画とはどうあるべきか」を定義するようになった。すなわち、より速く、より正確に、より短く切り分けて拡散しやすく、そしてより素早く人々のドーパミン分泌を刺激できるものが求められるようになったのである。","ja_ai":false}],"related":[],"parent":"","pages":[149,155,159,160,171],"notes":"語釈は p160「多巴胺是大脑分泌（fēn mì）的一种神经递质…」から冒頭の「是」とピンイン注記を除いて採録。日本語訳は p150・p160 の訳より。p160 の日本語解説は ja_note へ。例文は資料の本文から採録（訳は資料の本文訳）。"},{"id":"2026春-3-033","lesson":3,"type":"単語","role":"見出し語","zh":"发酵","pinyin":"fā jiào","ja":"発酵する；（評判などが）じわじわ広がる","ja_ai":true,"ja_note":"","def_zh":"原指微生物分解有机物的过程；比喻事情、舆论、影响等逐渐扩大、加深","def_zh_ai":true,"examples":[{"zh":"有明星，有导演，有预算，有工业外壳，可电影最难被替代的那些东西——人物的陌生感、命运的重量、创作的个性、缓慢发酵出来的余韵却变得稀缺。","ja":"そこにはスターがいて、監督がいて、予算があり、映画産業としての外形も備わっている。しかし、映画において最も代替しがたい要素――人物との未知なる出会い、運命の重み、創作者の個性、そして時間をかけて静かに醸成される余韻――は、かえって希少なものになってしまったのである。","ja_ai":false},{"zh":"《周处除三害》不是传统意义上的“潜力股”，《破·地狱》也不是那种一眼看上去会“赢”的项目，但都靠着观众口碑慢慢发酵出来。","ja":"また、『周处除三害』は従来の意味での「有望株」ではなく、『破·地狱』も一見して「勝てる」と思われるような企画ではなかった。しかし、これらの作品はいずれも観客の口コミによって評価が広がり、時間をかけてじわじわと支持を獲得していったのである。","ja_ai":false}],"related":[],"parent":"","pages":[149,155,159,161],"notes":"ピンイン補完。例文は資料の本文から採録（訳は資料の本文訳）。本文中のピンイン注記は例文から除いた。"},{"id":"2026春-3-034","lesson":3,"type":"単語","role":"見出し語","zh":"余韵","pinyin":"yú yùn","ja":"余韻","ja_ai":false,"ja_note":"","def_zh":"事情过去后留下的韵味、回味","def_zh_ai":true,"examples":[{"zh":"有明星，有导演，有预算，有工业外壳，可电影最难被替代的那些东西——人物的陌生感、命运的重量、创作的个性、缓慢发酵出来的余韵却变得稀缺。","ja":"そこにはスターがいて、監督がいて、予算があり、映画産業としての外形も備わっている。しかし、映画において最も代替しがたい要素――人物との未知なる出会い、運命の重み、創作者の個性、そして時間をかけて静かに醸成される余韻――は、かえって希少なものになってしまったのである。","ja_ai":false}],"related":[],"parent":"","pages":[149,155,159],"notes":"日本語訳は p150 の本文訳より。例文は資料の本文から採録（訳は資料の本文訳）。本文中のピンイン注記は例文から除いた。"},{"id":"2026春-3-035","lesson":3,"type":"単語","role":"見出し語","zh":"稀缺","pinyin":"xī quē","ja":"希少である；乏しい","ja_ai":true,"ja_note":"","def_zh":"稀少而缺乏","def_zh_ai":true,"examples":[{"zh":"有明星，有导演，有预算，有工业外壳，可电影最难被替代的那些东西——人物的陌生感、命运的重量、创作的个性、缓慢发酵出来的余韵却变得稀缺。","ja":"そこにはスターがいて、監督がいて、予算があり、映画産業としての外形も備わっている。しかし、映画において最も代替しがたい要素――人物との未知なる出会い、運命の重み、創作者の個性、そして時間をかけて静かに醸成される余韻――は、かえって希少なものになってしまったのである。","ja_ai":false}],"related":[],"parent":"","pages":[149,155,159,171],"notes":"ピンイン補完。p150 の本文訳では「希少なもの」。例文は資料の本文から採録（訳は資料の本文訳）。本文中のピンイン注記は例文から除いた。"},{"id":"2026春-3-036","lesson":3,"type":"単語","role":"見出し語","zh":"话语权","pinyin":"huà yǔ quán","ja":"発言権；発言力","ja_ai":true,"ja_note":"","def_zh":"指说话、表达观点并让他人采纳、影响决策的权力与分量；指群体、个人拥有表达诉求、左右舆论与判断的资格。","def_zh_ai":false,"examples":[{"zh":"女性从业者正在逐步争取更多话语权，打破职场中长期存在的性别偏见。","ja":"女性の就業者は徐々により多くの発言権を勝ち取り、職場に長く存在してきたジェンダー偏見を打ち破りつつある。","ja_ai":true}],"related":[],"parent":"","pages":[151,153],"notes":"まとめページには無いが p151 で語釈・例文付き解説。"},{"id":"2026春-3-037","lesson":3,"type":"単語","role":"見出し語","zh":"饭圈","pinyin":"fàn quān","ja":"ファンコミュニティ、アイドル追っかけ集団","ja_ai":false,"ja_note":"","def_zh":"“粉丝圈子”的简称，指喜爱同一明星、偶像的群体形成的社交圈层，包含追星、应援、舆论互动等整套行为体系。","def_zh_ai":false,"examples":[{"zh":"饭圈内部有一套专属用语和规则，不追星的路人很难看懂他们的聊天内容。","ja":"ファン界隈の内部には独自の用語やルールがあり、推し活をしない一般の人には彼らの会話の内容がなかなか理解できない。","ja_ai":true}],"related":["粉丝圈子","黑粉","粉头","粉转路","路转黑","粉转黑","脱粉","正主"],"parent":"","pages":[151,152,153,154],"notes":"まとめページには無いが p151 で語釈・例文付き解説。"},{"id":"2026春-3-038","lesson":3,"type":"単語","role":"見出し語","zh":"吃瓜群众","pinyin":"chī guā qún zhòng","ja":"傍観者、ネットでゴシップを見物する一般人","ja_ai":false,"ja_note":"","def_zh":"网络流行语，指不参与事件纷争，仅旁观娱乐八卦、社会争议、明星纠纷，单纯看热闹、搜集消息的普通网友。","def_zh_ai":false,"examples":[{"zh":"大部分吃瓜群众只愿意看热闹不愿查证真相，很容易被片面截图误导判断。","ja":"ゴシップを見物する人の大半は野次馬として楽しむだけで真相を確かめようとはせず、一部だけ切り取ったスクリーンショットに判断を惑わされやすい。","ja_ai":true}],"related":["吃瓜","吃瓜吃到正主了"],"parent":"","pages":[151],"notes":"まとめページには無いが p151 で語釈・例文付き解説。四字の新語のため単語扱い。"},{"id":"2026春-3-039","lesson":3,"type":"単語","role":"見出し語","zh":"路人","pinyin":"lù rén","ja":"（ファン界隈で）どのファンでもない一般人","ja_ai":true,"ja_note":"","def_zh":"饭圈衍生词义：既不喜欢也不讨厌某位明星，不加入任何粉丝群体，仅作为普通旁观者的网民；与粉丝、黑粉相对。","def_zh_ai":false,"examples":[{"zh":"路人对明星没有固有偏爱，评价艺人只会依靠对方的作品与公众行为。","ja":"一般の人はスターに特別な思い入れがないので、芸能人を評価するときはその作品や公の場での振る舞いだけを基準にする。","ja_ai":true}],"related":["粉丝","黑粉","粉转路","路转黑"],"parent":"","pages":[151,152,153,154,164],"notes":"まとめページには無いが p151・p152 で語釈・例文付き解説（同じ内容が2ページに重複掲載）。"},{"id":"2026春-3-040","lesson":3,"type":"単語","role":"見出し語","zh":"无脑","pinyin":"wú nǎo","ja":"思考停止した；何も考えない","ja_ai":true,"ja_note":"","def_zh":"形容人缺乏独立思考能力，不分辨是非对错，盲目跟风、盲从他人观点，冲动做出极端言行。","def_zh_ai":false,"examples":[{"zh":"部分无脑粉丝不分对错维护偶像，哪怕艺人犯错也拒绝接受客观批评。","ja":"一部の思考停止したファンは善悪の区別なくアイドルを擁護し、たとえ本人が過ちを犯しても客観的な批判を受け入れようとしない。","ja_ai":true}],"related":[],"parent":"","pages":[152],"notes":"まとめページには無いが p152 で語釈・例文付き解説。"},{"id":"2026春-3-041","lesson":3,"type":"単語","role":"見出し語","zh":"立人设","pinyin":"lì rén shè","ja":"キャラ設定を作る；イメージ作りをする","ja_ai":true,"ja_note":"","def_zh":"人设：人物设定；立人设指明星、网红刻意对外塑造统一、讨喜的公众形象（如温柔、自律、学霸、耿直等），以此吸引观众、收获好感。","def_zh_ai":false,"examples":[{"zh":"很多新人明星刚出道会刻意立人设，依靠鲜明标签快速让观众记住自己。","ja":"多くの新人スターはデビュー直後に意図的にキャラ設定を作り、はっきりしたイメージで素早く視聴者に覚えてもらおうとする。","ja_ai":true}],"related":["人设倒了"],"parent":"","pages":[152],"notes":"まとめページには無いが p152 で語釈・例文付き解説。三字の動詞フレーズのため単語扱い。"},{"id":"2026春-3-042","lesson":3,"type":"慣用句","role":"見出し語","zh":"人设倒了","pinyin":"rén shè dǎo le","ja":"キャラ（イメージ）が崩壊する","ja_ai":true,"ja_note":"","def_zh":"明星、网红维持的公众正面形象因负面事件、言行反差彻底崩塌，大众不再相信其塑造的完美形象。","def_zh_ai":false,"examples":[{"zh":"被媒体拍到撒谎、耍大牌后，这位温柔绅士偶像人设倒了。","ja":"うそをついたり大物ぶった態度を取ったりする様子をメディアに撮られてから、この優しい紳士系アイドルのキャラは崩壊した。","ja_ai":true}],"related":["立人设"],"parent":"","pages":[152],"notes":"まとめページには無いが p152 で語釈・例文付き解説。四字だが成語ではない決まり文句のため慣用句扱い。"},{"id":"2026春-3-043","lesson":3,"type":"単語","role":"関連語","zh":"黑粉","pinyin":"hēi fěn","ja":"アンチ（特定のスターを嫌う人）","ja_ai":true,"ja_note":"","def_zh":"对特定明星抱有反感，常常刻意关注、放大明星的负面消息，甚至会发布不实言论抹黑他人，容易引发网络矛盾。","def_zh_ai":false,"examples":[],"related":["路人","粉转黑","路转黑"],"parent":"饭圈","pages":[151,152,153],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の「他们对特定明星…」から主語を除いて採録。p151・p152 の路人の語釈にも名前が出る。"},{"id":"2026春-3-044","lesson":3,"type":"単語","role":"関連語","zh":"粉头","pinyin":"fěn tóu","ja":"ファンのリーダー格","ja_ai":true,"ja_note":"","def_zh":"饭圈里十分关键的角色，他们是资深的老粉丝，拥有大量粉丝关注，掌握着饭圈的主要话语权。","def_zh_ai":false,"examples":[],"related":["脱粉","话语权"],"parent":"饭圈","pages":[153,154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の「粉头是…」から採録。"},{"id":"2026春-3-045","lesson":3,"type":"単語","role":"関連語","zh":"粉转路","pinyin":"fěn zhuǎn lù","ja":"ファンから一般人に戻ること","ja_ai":true,"ja_note":"","def_zh":"原本喜欢偶像的粉丝，因为对偶像失望、厌倦饭圈的纷争，不再主动支持和关注，就会变成普通路人","def_zh_ai":false,"examples":[],"related":["路转黑","粉转黑","路人"],"parent":"饭圈","pages":[154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の該当文から採録。"},{"id":"2026春-3-046","lesson":3,"type":"単語","role":"関連語","zh":"路转黑","pinyin":"lù zhuǎn hēi","ja":"一般人からアンチになること","ja_ai":true,"ja_note":"","def_zh":"原本对明星毫无感觉的路人，因为反感明星的言行或者极端粉丝的行为，开始讨厌这位明星","def_zh_ai":false,"examples":[],"related":["粉转路","粉转黑","黑粉"],"parent":"饭圈","pages":[154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の該当文から採録。"},{"id":"2026春-3-047","lesson":3,"type":"単語","role":"関連語","zh":"粉转黑","pinyin":"fěn zhuǎn hēi","ja":"ファンからアンチに転じること","ja_ai":true,"ja_note":"","def_zh":"曾经的忠实粉丝彻底对偶像失望，甚至开始批判、抹黑偶像","def_zh_ai":false,"examples":[],"related":["粉转路","路转黑","黑粉"],"parent":"饭圈","pages":[154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の該当文から採録。"},{"id":"2026春-3-048","lesson":3,"type":"単語","role":"関連語","zh":"脱粉","pinyin":"tuō fěn","ja":"ファンをやめる","ja_ai":true,"ja_note":"","def_zh":"不再做某位明星的粉丝，退出粉丝群体","def_zh_ai":true,"examples":[],"related":["粉头"],"parent":"饭圈","pages":[154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。読み物では「粉头脱粉」として出るが明示的な語釈は無い。"},{"id":"2026春-3-049","lesson":3,"type":"単語","role":"関連語","zh":"吃瓜","pinyin":"chī guā","ja":"（野次馬として）ゴシップを見物する","ja_ai":true,"ja_note":"","def_zh":"普通人围观网络八卦、舆论纠纷，只是单纯看热闹。","def_zh_ai":false,"examples":[],"related":["吃瓜群众","吃瓜吃到正主了"],"parent":"吃瓜群众","pages":[151,154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の「“吃瓜”是指…」から採録。"},{"id":"2026春-3-050","lesson":3,"type":"単語","role":"関連語","zh":"正主","pinyin":"zhèng zhǔ","ja":"（ファンにとっての）推し本人","ja_ai":true,"ja_note":"","def_zh":"粉丝对自己喜欢的偶像的称呼。","def_zh_ai":false,"examples":[],"related":["吃瓜吃到正主了"],"parent":"饭圈","pages":[154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の「而“正主”是…」から採録。"},{"id":"2026春-3-051","lesson":3,"type":"慣用句","role":"関連語","zh":"吃瓜吃到正主了","pinyin":"chī guā chī dào zhèng zhǔ le","ja":"野次馬で見ていたら推し本人が当事者だった","ja_ai":true,"ja_note":"","def_zh":"本来只是围观别人的网络纷争和八卦，意外发现自己喜欢的偶像也被牵扯进事件当中","def_zh_ai":false,"examples":[],"related":["吃瓜","正主","吃瓜群众"],"parent":"吃瓜群众","pages":[154],"notes":"ピンイン補完。p153–154 の饭圈についての読み物で説明された語。語釈は読み物の「这句话的意思是…」から採録。資料では「俗语」と説明。"},{"id":"2026春-3-052","lesson":3,"type":"成語","role":"見出し語","zh":"扬名立万","pinyin":"yáng míng lì wàn","ja":"名を成して出世する；名声を轟かせ成功を収める","ja_ai":false,"ja_note":"","def_zh":"指在社会上声名远扬、成就大业，获得名望与地位，多用于追逐事业、名利的语境。","def_zh_ai":false,"examples":[{"zh":"不少新人渴望在大赛中脱颖而出，借此机会扬名立万。","ja":"多くの新人が大会で頭角を現し、それをきっかけに名を上げたいと願っている。","ja_ai":true},{"zh":"想要靠一部作品就扬名立万并不容易，背后需要长久的积累。","ja":"一つの作品だけで名を成すのは簡単ではなく、その裏には長い積み重ねが必要だ。","ja_ai":true},{"zh":"早年他四处闯荡，一心只想在大城市扬名立万。","ja":"若い頃、彼は各地を渡り歩き、大都市で名を上げようと一心に頑張っていました。","ja_ai":false}],"related":[],"parent":"","pages":[161,163,171],"notes":"本文 p161 では映画タイトル《扬名立万》として登場。例文1の「脱颖而出」に資料ではピンイン注記（tuōyǐng érchū）が離れて記載。"},{"id":"2026春-3-053","lesson":3,"type":"成語","role":"見出し語","zh":"孤注一掷","pinyin":"gū zhù yí zhì","ja":"一か八か賭ける","ja_ai":false,"ja_note":"注： 赌注（かけ金）。孤注：持っている金をすべて一つの賭けに注ぎ込むこと。掷：賭博でサイコロを投げること。負けが込んで追い詰められたときに、持ち金のすべてを一度に賭けて勝負を決することをいう。転じて、危機的な状況において、持てる力のすべてを注ぎ込み、最後の一回の冒険や勝負に出ることのたとえ。","def_zh":"注：赌注；孤注：把所有的钱并作一注；掷：赌钱时掷骰子。在输急时把所有的钱一次押上去，决一输赢。比喻在危急时把所有力量拿出来做最后一次冒险。","def_zh_ai":false,"examples":[{"zh":"这一步风险极高，但凡理智的人都不会轻易孤注一掷。","ja":"この選択はリスクが非常に高く、理性のある人は簡単に全てを賭けたりしません。","ja_ai":false},{"zh":"团队已经陷入困境，他们只能孤注一掷，尝试全新的创作思路。","ja":"チームは窮地に立たされ、すべてをかけて新たな制作方針に挑むしかありません。","ja_ai":false}],"related":[],"parent":"","pages":[161,163,171],"notes":"本文 p161 では映画タイトル《孤注一掷》として登場。ピンインは資料表記（一→yí の変調表記）のまま。「一か八か賭ける」は p163 に単独で記載された訳。p163 の日本語解説は ja_note へ（資料中の ** 強調記号は除去）。"},{"id":"2026春-3-054","lesson":3,"type":"単語","role":"見出し語","zh":"潜力股","pinyin":"qián lì gǔ","ja":"将来有望な人材；将来性のある存在；伸びしろのあるコンテンツ","ja_ai":false,"ja_note":"","def_zh":"原指价格有上涨潜力的股票；比喻具备发展潜能、未来容易取得成功的人或事物。","def_zh_ai":false,"examples":[{"zh":"他做事踏实又善于学习，是公司里公认的潜力股。","ja":"彼は仕事ぶりが堅実で学ぶのも上手く、社内で誰もが認める将来有望な人材だ。","ja_ai":true},{"zh":"这位新人演员演技自然灵动，很多导演都把他看作潜力股。","ja":"この新人俳優の演技は自然で生き生きとしており、多くの監督が彼を将来有望な存在と見ている。","ja_ai":true},{"zh":"这家初创团队创意十足执行力强，被业内视作一支潜力股。","ja":"この新興チームはアイデアにあふれ実行力も高く、業界から将来性のある集団と見られています。","ja_ai":false}],"related":[],"parent":"","pages":[161,164,171],"notes":"p162 の本文訳では「有望株」。"},{"id":"2026春-3-055","lesson":3,"type":"単語","role":"見出し語","zh":"口碑","pinyin":"kǒu bēi","ja":"口コミ；評判；世間の評価","ja_ai":false,"ja_note":"","def_zh":"指群众口头上的评价、名声，多用于文艺作品、商品、服务、人物等领域。","def_zh_ai":false,"examples":[{"zh":"他为人正直、待人真诚，在职场和朋友圈里都有着极佳的口碑。","ja":"彼は人柄が正直で人に誠実に接するので、職場でも友人の間でもとても評判が良い。","ja_ai":true},{"zh":"酒店不断优化住宿体验，短短半年就让整体口碑大幅提升。","ja":"ホテルは宿泊体験の改善を続け、わずか半年で全体の評判を大きく高めた。","ja_ai":true},{"zh":"过度炒作只会消耗路人好感，最终严重损害作品的口碑。","ja":"過度な話題づくりや宣伝は、一般層からの好感度を消耗させるだけであり、最終的には作品の評判を大きく損なうことになる。","ja_ai":false}],"related":["有口皆碑"],"parent":"","pages":[153,154,161,164,171],"notes":"例文3は資料では日本語訳が中国語より前に置かれている。例文3の「消耗」に資料ではピンイン注記（xiāohào）が離れて記載。"},{"id":"2026春-3-056","lesson":3,"type":"成語","role":"見出し語","zh":"有口皆碑","pinyin":"yǒu kǒu jiē bēi","ja":"誰もが褒めたたえる；評判が高い","ja_ai":true,"ja_note":"すべての人の口が生きた記念碑であるという意味で、人々が皆称賛し、広く高い評価を受けていることのたとえ。","def_zh":"所有人的嘴都是活的纪念碑。比喻人人称赞，普遍受到好评。","def_zh_ai":false,"examples":[{"zh":"虽然这家公司规模不大，但是产品质量稳定，因此在业内有口皆碑。","ja":"この会社は規模こそ大きくないが、製品の品質が安定しているので、業界内で誰もが称賛している。","ja_ai":true},{"zh":"这家餐厅开业很多年了，而且价格合理、服务周到，有口皆碑。","ja":"このレストランは開業して長年になり、しかも価格が手頃でサービスも行き届いているので、誰もが褒めている。","ja_ai":true},{"zh":"这部纪录片没有邀请明星参与，不过内容真实感人，上映后有口皆碑。","ja":"このドキュメンタリーは、特別ゲストとして人気芸能人を出演させていない。しかし内容はリアルで心に響くものがあり、公開後は評判になった。","ja_ai":false}],"related":["口碑"],"parent":"","pages":[165,171],"notes":"資料ではピンインと語釈が連続（分離した）。資料には短い訳語が無いため ja は AI の短訳、p165 の日本語解説は ja_note へ。"},{"id":"2026春-3-057","lesson":3,"type":"単語","role":"見出し語","zh":"葆有","pinyin":"bǎo yǒu","ja":"保ち続ける、持ち続ける","ja_ai":false,"ja_note":"","def_zh":"保持并拥有（积极抽象品质、心态、信念），侧重长久守住珍贵的内在状态。","def_zh_ai":false,"examples":[{"zh":"前路难免遇到困难，始终葆有信心，才能平稳渡过所有难关。","ja":"この先困難に出会うのは避けられないが、常に自信を持ち続けてこそ、すべての難関を無事に乗り越えられる。","ja_ai":true},{"zh":"即便工作重复枯燥，也要葆有热情，认真做好手里每一件事。","ja":"たとえ仕事が単調で退屈でも、情熱を持ち続け、手元の一つひとつの仕事を丁寧にこなすべきだ。","ja_ai":true},{"zh":"即便工作平淡重复，也要葆有初心，记住自己最初选择这份事业的理由。","ja":"たとえ仕事が平凡で繰り返しでも、初心を持ち続け、自分が最初にこの仕事を選んだ理由を忘れないようにしよう。","ja_ai":true},{"zh":"对新鲜事物葆有好奇，不断学习新东西，心灵就能永葆青春。","ja":"新しい物事への好奇心を持ち続け、絶えず新しいことを学べば、心はいつまでも若さを保てる。","ja_ai":true}],"related":["永葆青春"],"parent":"","pages":[166,167,172,173],"notes":"ピンイン補完。まとめページには無いが p167（=p173）で語釈・例文付き解説。見出しは本文の「需要对不确定性葆有耐心」。"},{"id":"2026春-3-058","lesson":3,"type":"単語","role":"見出し語","zh":"编剧","pinyin":"biān jù","ja":"脚本家","ja_ai":false,"ja_note":"","def_zh":"创作或改编剧本的人","def_zh_ai":true,"examples":[{"zh":"这个中间地带，是电影生态的重要组成，包括中腰部项目、青年导演的实验空间、非头部的编剧和剪辑岗位以及一整套不那么耀眼却决定电影厚度的工作。","ja":"この中間層とは、映画産業のエコシステムを支える重要な領域を指す。具体的には、中規模作品（中堅プロジェクト）、若手監督が挑戦や実験を行うための創作空間、トップ層ではない脚本家や編集者の活躍の場、そして派手ではないものの映画の厚みや完成度を支える数多くの仕事が含まれる。","ja_ai":false}],"related":["剪辑"],"parent":"","pages":[166,172],"notes":"本文中に「编剧（biānjù 脚本家）」と注記のみ（まとめページには無い）。ピンインは音節ごとに分けた。例文は資料の本文から採録（訳は資料の本文訳）。本文中のピンイン注記は例文から除いた。"},{"id":"2026春-3-059","lesson":3,"type":"単語","role":"見出し語","zh":"剪辑","pinyin":"jiǎn jí","ja":"カット編集","ja_ai":false,"ja_note":"","def_zh":"对影片素材进行挑选、剪接和编排的工作","def_zh_ai":true,"examples":[{"zh":"这个中间地带，是电影生态的重要组成，包括中腰部项目、青年导演的实验空间、非头部的编剧和剪辑岗位以及一整套不那么耀眼却决定电影厚度的工作。","ja":"この中間層とは、映画産業のエコシステムを支える重要な領域を指す。具体的には、中規模作品（中堅プロジェクト）、若手監督が挑戦や実験を行うための創作空間、トップ層ではない脚本家や編集者の活躍の場、そして派手ではないものの映画の厚みや完成度を支える数多くの仕事が含まれる。","ja_ai":false}],"related":["编剧"],"parent":"","pages":[166,172],"notes":"本文中に「剪辑（jiǎnjí カット編集）」と注記のみ（まとめページには無い）。ピンインは音節ごとに分けた。例文は資料の本文から採録（訳は資料の本文訳）。本文中のピンイン注記は例文から除いた。"},{"id":"2026春-3-060","lesson":3,"type":"単語","role":"見出し語","zh":"梯队","pinyin":"tī duì","ja":"（人材の）層；段階的に引き継ぐ人材体制","ja_ai":true,"ja_note":"一定の階層や順序に従って編成・配置された隊列。さらに、持続的な発展を実現するために構築される、層構造を持ち、継続性があり、次世代へ引き継ぐことのできる人材または組織力の体系を指す。","def_zh":"按照一定层次、顺序排列形成的队伍。为了保证持续发展而建立的分层、连续、能够接替的人才或力量结构。","def_zh_ai":false,"examples":[{"zh":"学校不仅要关注优秀学生，也要建立长期的人才梯队。","ja":"学校は優秀な学生に目を向けるだけでなく、長期的な人材の層も築かなければならない。","ja_ai":true},{"zh":"企业如果忽视梯队建设，那么核心员工离职后容易出现断层。","ja":"企業が人材層の構築を怠れば、中核社員が辞めたあとに断絶が生じやすい。","ja_ai":true},{"zh":"这支球队之所以长期保持竞争力，是因为形成了完整的年龄梯队。","ja":"このチームが長く競争力を保っているのは、年齢ごとの選手層がしっかり形成されているからだ。","ja_ai":true},{"zh":"一个行业真正的竞争力，不只是头部人才，而是完整的梯队结构。","ja":"ある業界の本当の競争力とは、トップ人材だけでなく、切れ目のない人材の層にある。","ja_ai":true}],"related":["梯队培养","人才梯队","梯队建设","年龄梯队","梯队结构"],"parent":"","pages":[177,178],"notes":"まとめページには無いが p178 で語釈・例文付き解説。見出しは本文の「还应正视电影人才成长和梯队培养的重要性」。資料には短い訳語が無いため ja は AI の短訳、p178 の日本語解説は ja_note へ。資料ではピンインと語釈が連続（分離した）。"},{"id":"2026春-3-061","lesson":3,"type":"成語","role":"関連語","zh":"脱颖而出","pinyin":"tuō yǐng ér chū","ja":"頭角を現す；抜きん出る","ja_ai":true,"ja_note":"","def_zh":"比喻有才能的人显露出来，从众多人或事物中突出出来","def_zh_ai":true,"examples":[{"zh":"不少新人渴望在大赛中脱颖而出，借此机会扬名立万。","ja":"多くの新人が大会で頭角を現し、それをきっかけに名を上げたいと願っている。","ja_ai":true},{"zh":"《给阿嬷的情书》就是从中间地带脱颖而出的佳作。","ja":"『おばあちゃんへのラブレター（《给阿嬷的情书》）』は、まさにその「中間地帯」から頭角を現した優れた作品である。","ja_ai":false}],"related":["扬名立万"],"parent":"","pages":[163,174],"notes":"コーディネーター指示により追加した関連語。p163 の扬名立万の例文中に資料のピンイン注記「tuōyǐng érchū」あり（音節ごとに分けた）。例文1は p163 の扬名立万の例文、例文2は p174 の本文（訳は資料の本文訳）。"},{"id":"2026春-3-062","lesson":3,"type":"成語","role":"関連語","zh":"参差不齐","pinyin":"cēn cī bù qí","ja":"ばらつきがある；玉石混交","ja_ai":true,"ja_note":"","def_zh":"长短、高低、好坏不一致，很不整齐","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[142],"notes":"コーディネーター指示により追加した関連語。ピンイン補完。p142 の学習者の発言メモに語のみ記載。"},{"id":"2026春-3-063","lesson":3,"type":"成語","role":"関連語","zh":"急于求成","pinyin":"jí yú qiú chéng","ja":"成果を急ぐ；功を焦る","ja_ai":true,"ja_note":"","def_zh":"急着要取得成功，不顾客观条件和应有的步骤","def_zh_ai":true,"examples":[{"zh":"不能急于求成","ja":"成果を急いではいけない。","ja_ai":true}],"related":["循序渐进"],"parent":"","pages":[147,183],"notes":"コーディネーター指示により追加した関連語。ピンイン補完。p183 の学習者の発言メモ（「…能训练出来。不能急于求成」）に記載。p147 の循序渐进の語釈中にも「不急于求成」として出る。例文は p183 の発言メモの一句。"},{"id":"2026春-3-064","lesson":3,"type":"慣用句","role":"関連語","zh":"用脚投票","pinyin":"yòng jiǎo tóu piào","ja":"（購入・来場などの）行動で支持を示す","ja_ai":true,"ja_note":"","def_zh":"观众通过购票观影的实际行动来表达对好电影的支持；泛指人们用实际行动（选择去留、买或不买）来表达态度","def_zh_ai":true,"examples":[{"zh":"过去10多年里，观众用脚投票选出来的“年度爆款”几乎都是真正有内容、有质感、有情感的电影。","ja":"この十数年、観客が実際の鑑賞行動で支持してきた「年間大ヒット作品」は、ほぼ例外なく中身、質感、情感にあふれた真の映画ばかりだ。","ja_ai":false}],"related":[],"parent":"","pages":[175,176],"notes":"コーディネーター指示により追加した関連語。ピンイン補完。語釈前半は p176 の設問の正解選択肢 A「观众通过购票观影的实际行动来表达对好电影的支持」を採用（設問は正解を明示していないため A を正解と判断）。例文は p175 の本文（訳は資料の本文訳）。pages は指示の [176] に本文の p175 を加えた。"},{"id":"2026春-4-001","lesson":4,"type":"単語","role":"見出し語","zh":"草根","pinyin":"cǎo gēn","ja":"草の根／一般庶民","ja_ai":true,"ja_note":"本来は草の根を意味する。転じて、一般市民や民間の人々、専門家ではない人々、または大きな資本や政府の支援に依存しない活動や組織を指す。エリートや専門組織、商業化されたものと対比されることが多い。","def_zh":"原指草的根部；引申义：普通底层民众、民间非专业、非官方、无资本加持的群体 / 事物，区别于精英、专业、商业化上层群体。","def_zh_ai":false,"examples":[{"zh":"这场草根足球赛事没有专业外援（wài yuán），普通村民和上班族都能站上赛场。","ja":"この草の根サッカー大会にはプロの外部助っ人選手はおらず、一般の村民や会社員でも試合に出場できる。","ja_ai":true},{"zh":"很多草根创作者依靠短视频表达想法，不用依赖大型媒体公司宣传自己。","ja":"多くの草根クリエイターはショート動画を使って思いを伝え、大手メディア企業に頼らず自身を発信できる。","ja_ai":false},{"zh":"草根文化拥有强大的生命力，它源自群众真实的生活，不受商业规则束缚（shù fù）。","ja":"草の根文化は強い生命力を持っている。それは人々の実際の暮らしから生まれ、商業的なルールに縛られない。","ja_ai":true}],"related":["草根群体","草根赛事","草根体育","草根创作者","草根品牌","草根文化","草根力量"],"parent":"","pages":[197,201,215],"notes":"例文中の 外援（wài yuán）・束缚（shù fù）はピンイン注のみで語釈が無いため独立カードにしていない。"},{"id":"2026春-4-002","lesson":4,"type":"単語","role":"見出し語","zh":"壁垒","pinyin":"bì lěi","ja":"障壁／隔たり","ja_ai":true,"ja_note":"人と人、集団、国家の間におけるコミュニケーションや交流、相互理解、融合を妨げる目に見えない隔たり・境界・障害。本課での中心的な意味：目に見えない隔たり、考え方や価値観による障害。","def_zh":"阻碍人与人、群体、国家之间沟通、来往、融合的无形隔阂、界限与障碍。本课核心义：无形隔阂、观念障碍。","def_zh_ai":false,"examples":[{"zh":"真诚的沟通可以打破观念的壁垒，让不同文化背景的人互相理解包容。","ja":"誠実なコミュニケーションは考え方の壁を打ち破り、異なる文化的背景を持つ人々が互いに理解し、受け入れ合えるようにする。","ja_ai":true},{"zh":"求同存异的相处方式能跨越文化壁垒，拉近不同国家民众之间的距离。","ja":"共通点を求めつつ違いを認め合う付き合い方は、文化の壁を越え、異なる国の人々の距離を縮めることができる。","ja_ai":true},{"zh":"语言的壁垒会阻碍跨国合作，所以我们需要学习对方国家的语言与文化。","ja":"言葉の壁は国際協力の妨げになるため、私たちは相手国の言語と文化を学ぶ必要がある。","ja_ai":true},{"zh":"尽管两家公司在业务上存在许多合作的可能，但由于企业文化差异形成的无形壁垒，使得双方的合作谈判始终难以推进。","ja":"2社の間には業務上多くの協力の可能性があるものの、企業文化の違いによって生じた目に見えない壁のために、双方の提携交渉はなかなか進まなかった。","ja_ai":true}],"related":[],"parent":"","pages":[197,202,215,236],"notes":""},{"id":"2026春-4-003","lesson":4,"type":"単語","role":"見出し語","zh":"摊贩","pinyin":"tān fàn","ja":"露店商 屋台の店主","ja_ai":false,"ja_note":"","def_zh":"摆摊子做小买卖的人。","def_zh_ai":false,"examples":[],"related":[],"parent":"","pages":[203,204,215,236],"notes":"資料はピンインがページ下部に分離して記載（tān fàn）。"},{"id":"2026春-4-004","lesson":4,"type":"単語","role":"見出し語","zh":"一扫疲惫","pinyin":"yī sǎo pí bèi","ja":"疲れが一気に吹き飛ぶ、疲労を一掃する","ja_ai":false,"ja_note":"","def_zh":"一下子把全身的劳累、疲倦全部消除干净。","def_zh_ai":false,"examples":[],"related":[],"parent":"","pages":[203,204,215],"notes":"ピンイン補完（資料 p204 にピンイン無し。一 は本調で表記）。「一扫＋疲惫」の組み合わせ表現のため type は単語とした。"},{"id":"2026春-4-005","lesson":4,"type":"単語","role":"見出し語","zh":"绿茵场","pinyin":"lǜ yīn chǎng","ja":"芝生の競技場 サッカー場","ja_ai":false,"ja_note":"","def_zh":"铺满绿色草坪的场地，多指足球场。","def_zh_ai":false,"examples":[],"related":[],"parent":"","pages":[203,204,215],"notes":"資料はピンインがページ下部に分離して記載。"},{"id":"2026春-4-006","lesson":4,"type":"単語","role":"見出し語","zh":"精湛","pinyin":"jīng zhàn","ja":"巧みな、見事な","ja_ai":false,"ja_note":"","def_zh":"技艺、技术精深纯熟，水平极高。","def_zh_ai":false,"examples":[],"related":[],"parent":"","pages":[203,204,215],"notes":"資料はピンインが語釈の後に分離して記載。"},{"id":"2026春-4-007","lesson":4,"type":"単語","role":"見出し語","zh":"精英叙事","pinyin":"jīng yīng xù shì","ja":"エリート叙事、エリート向けストーリー、エリート中心の物語","ja_ai":false,"ja_note":"","def_zh":"以社会精英、高端成功人士为核心视角，围绕财富、地位、专业顶层成就构建的故事表达逻辑；常突出优越资源、高端圈层、专业化高标准，与“草根叙事”相对。","def_zh_ai":false,"examples":[],"related":["草根叙事"],"parent":"","pages":[203,204,215],"notes":"資料はピンインが語釈の後に分離して記載。"},{"id":"2026春-4-008","lesson":4,"type":"単語","role":"関連語","zh":"草根叙事","pinyin":"cǎo gēn xù shì","ja":"草の根の物語、庶民目線のストーリー","ja_ai":true,"ja_note":"","def_zh":"以普通民众、基层群体的视角和日常生活为核心的故事表达方式，与“精英叙事”相对。","def_zh_ai":true,"examples":[],"related":["精英叙事","草根"],"parent":"精英叙事","pages":[204],"notes":"精英叙事の語釈中で対義語として名前のみ言及。ピンイン補完。"},{"id":"2026春-4-009","lesson":4,"type":"単語","role":"見出し語","zh":"代入感","pinyin":"dài rù gǎn","ja":"没入感、感情移入","ja_ai":false,"ja_note":"","def_zh":"读者、观众、观者能够走进故事或场景，切身感受到人物处境、情绪的心理感受。","def_zh_ai":false,"examples":[],"related":[],"parent":"","pages":[203,204,215],"notes":"ピンイン補完（資料 p204 にピンイン無し）。"},{"id":"2026春-4-010","lesson":4,"type":"単語","role":"見出し語","zh":"久违","pinyin":"jiǔ wéi","ja":"久しぶり","ja_ai":false,"ja_note":"","def_zh":"好久没有见到、好久没有体验，时隔许久再次遇见。","def_zh_ai":false,"examples":[],"related":[],"parent":"","pages":[203,204,215],"notes":"資料はピンインがページ下部に分離して記載。"},{"id":"2026春-4-011","lesson":4,"type":"慣用句","role":"見出し語","zh":"接地气","pinyin":"jiē dì qì","ja":"庶民的で親しみやすい／地に足がついた","ja_ai":true,"ja_note":"本来の意味：地面に近づくこと、地面に接すること。引申義（現在の主な用法）：一般の人々の実際の生活に寄り添い、庶民の暮らしに密着していること。飾り気がなく親しみやすく、堅苦しくも現実離れもしておらず、人々に共感や親近感を与えやすいこと。","def_zh":"本义：贴近地面、接触地气；引申义（现主流用法）：贴近普通老百姓的真实生活，朴实通俗，不空洞、不脱离大众，容易让人产生亲近感。","def_zh_ai":false,"examples":[{"zh":"主播说话风趣又接地气，直播间每天都有大量忠实观众停留。","ja":"配信者の話し方はユーモラスで堅苦しくなく、毎日多くの固定視聴者が配信ルームに残っている。","ja_ai":false},{"zh":"这位作家的文字特别接地气，普通人都能读懂其中的生活感悟。","ja":"この作家の文章はとても庶民に寄り添っており、一般の人でも文中の暮らしの感じ取りを理解できる。","ja_ai":false}],"related":[],"parent":"","pages":[210,211,215,216],"notes":"動目構造の三字慣用語として type を慣用句とした（単語扱いも可）。資料では例文1の訳が例文2の後に置かれている。"},{"id":"2026春-4-012","lesson":4,"type":"単語","role":"見出し語","zh":"纽带","pinyin":"niǔ dài","ja":"絆／つながり／架け橋","ja_ai":true,"ja_note":"本来の意味：物を縛ったり、まとめたり、つないだりするための帯状のもの。引申義（現在よく使われる意味）：人や物事を結び付ける役割を果たす人・物・手段・媒体のこと。両者のつながりを深めたり、関係を築いたりするものを指す。","def_zh":"本义：用来缠绕、捆扎、连接物品的带子；引申义（主流）：起联系、联结作用的人、事物、媒介，让两方建立稳固关联。","def_zh_ai":false,"examples":[{"zh":"共同的爱好成为我们之间的情感纽带，多年来我们始终保持往来。","ja":"共通の趣味が私たちの心の絆となり、長年にわたってずっと付き合いが続いている。","ja_ai":true},{"zh":"美食是联结各国文化的纽带，不同地域的人能借食物拉近距离。","ja":"美食は各国の文化を結ぶ架け橋であり、異なる地域の人々は食べ物を通じて距離を縮めることができる。","ja_ai":true}],"related":[],"parent":"","pages":[210,211,215,216],"notes":"本文 p242/p244（情感纽带）にも出るが解説ページではないため pages には含めていない。"},{"id":"2026春-4-013","lesson":4,"type":"単語","role":"見出し語","zh":"营销梗","pinyin":"yíng xiāo gěng","ja":"マーケティングの話題づくり／宣伝目的のネタ","ja_ai":false,"ja_note":"","def_zh":"为营销宣传而刻意策划、制造出来的话题或噱头。","def_zh_ai":true,"examples":[{"zh":"这些细节，不是策划出来的“营销梗”，而是来自乡土市井的泥土味、烟火气。","ja":"こうした細かな場面は、企画された「マーケティングの話題づくり」ではなく、地域に根ざした暮らしならではの素朴な雰囲気や、人々の日常生活の温かみから生まれたものです。","ja_ai":false}],"related":["梗"],"parent":"","pages":[210,212,216],"notes":"p212 で本文の一文とともに日本語訳が付された語。中国語語釈は資料に無い。"},{"id":"2026春-4-014","lesson":4,"type":"単語","role":"見出し語","zh":"乡土市井","pinyin":"xiāng tǔ shì jǐng","ja":"地域に根ざした暮らし／庶民の暮らし","ja_ai":false,"ja_note":"","def_zh":"乡村与城镇里普通百姓的日常生活环境。","def_zh_ai":true,"examples":[{"zh":"这些细节，不是策划出来的“营销梗”，而是来自乡土市井的泥土味、烟火气。","ja":"こうした細かな場面は、企画された「マーケティングの話題づくり」ではなく、地域に根ざした暮らしならではの素朴な雰囲気や、人々の日常生活の温かみから生まれたものです。","ja_ai":false}],"related":[],"parent":"","pages":[210,212,216],"notes":"ピンイン補完。中国語語釈は資料に無い。乡土＋市井の組み合わせ表現のため type は単語とした。"},{"id":"2026春-4-015","lesson":4,"type":"単語","role":"見出し語","zh":"泥土味","pinyin":"ní tǔ wèi","ja":"素朴さ／土の香りを感じるような素朴さ","ja_ai":false,"ja_note":"","def_zh":"像泥土一样的气息，比喻朴实、不加修饰的乡土风格。","def_zh_ai":true,"examples":[{"zh":"这些细节，不是策划出来的“营销梗”，而是来自乡土市井的泥土味、烟火气。","ja":"こうした細かな場面は、企画された「マーケティングの話題づくり」ではなく、地域に根ざした暮らしならではの素朴な雰囲気や、人々の日常生活の温かみから生まれたものです。","ja_ai":false}],"related":[],"parent":"","pages":[210,212,216],"notes":"ピンイン補完。中国語語釈は資料に無い。"},{"id":"2026春-4-016","lesson":4,"type":"単語","role":"見出し語","zh":"烟火气","pinyin":"yān huǒ qì","ja":"生活感／人間味／日常生活の温かみ","ja_ai":false,"ja_note":"","def_zh":"原指做饭时的烟火气息，比喻普通百姓热闹、温暖的日常生活气息。","def_zh_ai":true,"examples":[{"zh":"这些细节，不是策划出来的“营销梗”，而是来自乡土市井的泥土味、烟火气。","ja":"こうした細かな場面は、企画された「マーケティングの話題づくり」ではなく、地域に根ざした暮らしならではの素朴な雰囲気や、人々の日常生活の温かみから生まれたものです。","ja_ai":false}],"related":[],"parent":"","pages":[210,212,216],"notes":"ピンイン補完。中国語語釈は資料に無い。"},{"id":"2026春-4-017","lesson":4,"type":"単語","role":"見出し語","zh":"梗","pinyin":"gěng","ja":"ネタ／（ネットの）ミーム","ja_ai":true,"ja_note":"インターネットで生まれた新しい意味（現在の主な用法。「哏（gén）」という伝統芸能の用語が、同音の「梗（gěng）」として広く使われるようになったことに由来する）映画やドラマ、ショート動画、お笑いネタ、会話などに登場する笑いどころや定番のネタ、多くの人に知られているエピソード、印象的なセリフ、名場面などを指す。また、若者同士が共通の理解を示すために使う文化的な合言葉（共通コード）という意味でも使われる。","def_zh":"名词：植物的枝、茎，例：菜梗、花梗 网络衍生新义（当代主流用法，源自曲艺词「哏 gén」，同音误用普及）指影视剧、短视频、段子、对话里自带笑点、专属典故、大众熟知的桥段、名台词、名画面，是年轻人社交的文化暗号。","def_zh_ai":false,"examples":[{"zh":"年轻人聚会总爱互相玩梗，不懂网络热点的人很难跟上话题。","ja":"若者の集まりではお互いネタを使って話すのが習わしで、ネットの話題を知らない人は会話についていくのが難しい。","ja_ai":false},{"zh":"每年都会诞生大批全新网梗，很多热度只能维持一两个月。","ja":"毎年たくさんの新しいネットミームが生まれるが、多くは1～2ヶ月で話題が冷めてしまう。","ja_ai":false},{"zh":"他反应很快总能完美接梗，和他聊天永远不会出现冷场。","ja":"彼は反射神経が良くいつも上手くネタに乗れるので、彼と話すと場が白けることがない。","ja_ai":false},{"zh":"聊天时他总喜欢主动抛梗，希望身边人能顺着他的玩笑互动。","ja":"会話の時彼は自発的にネタを振るのが好きで、周りの人にジョークに乗ってもらいたい。","ja_ai":false},{"zh":"这部喜剧电影全是十年前的老梗，年轻观众很难产生共鸣。","ja":"このコメディ映画は10年前の古いネタばかりで、若い観客にはなかなか共感されない。","ja_ai":true},{"zh":"评论区总有人反复刷同款烂梗，大量重复内容会破坏观看体验。","ja":"コメント欄に同じつまらないネタを連投する人が多く、反復投稿が視聴体験を損なう。","ja_ai":false}],"related":["玩梗","接梗","抛梗","老梗","新梗","热梗","爆梗","网络梗","有梗","没梗","网梗","烂梗","营销梗","菜梗","花梗","哏"],"parent":"","pages":[210,213,214,215,216,236],"notes":"資料の日本語訳はネット由来の新義のみで、本義（植物の枝・茎）の訳は無い。def_zh の「花梗」と「网络衍生新义」の間は資料で改行のみ（句読点なし）。p214・p215 に並ぶコロケーション（玩梗 接梗 抛梗 老梗 新梗 热梗 爆梗 网络梗 有梗 没梗）は 草根 と同様に related に入れ、独立カードにはしていない。"},{"id":"2026春-4-018","lesson":4,"type":"単語","role":"見出し語","zh":"侗族","pinyin":"Dòng zú","ja":"トン族（中国の少数民族の一つ）","ja_ai":true,"ja_note":"","def_zh":"侗族（Dòngzú）是中国的一个少数民族，主要分布在贵州、湖南、广西等地，其中贵州省的侗族人口最多。","def_zh_ai":false,"examples":[{"zh":"近年来，在贵州榕江举办的“村超”足球赛事中，侗族大歌、侗族舞蹈等民族文化表演也成为比赛的一大特色，向来自各地的游客展示了侗族文化的独特魅力。","ja":"近年、貴州省榕江県で開催されている「村超」サッカー大会では、トン族大歌やトン族の踊りなどの民族文化パフォーマンスも大会の大きな特色となり、各地から訪れる観光客にトン族文化の独特な魅力を伝えている。","ja_ai":true}],"related":["侗语","侗族大歌","鼓楼","风雨桥","苗族"],"parent":"","pages":[210,216,217,218,236],"notes":"資料ピンインは「Dòngzú」（連続表記）。音節区切りに合わせ「Dòng zú」とした。日本語訳は資料に見出しとしては無い（p188 の本文訳では「トン族」）。def_zh は p218 の解説（背景知識ページ）冒頭文を採用、例文も同ページ末段の文を採用。p218 の 侗语（Dòngyǔ）・鼓楼（gǔlóu）・风雨桥（fēngyǔqiáo）・侗族大歌（Dòngzú dàgē）は背景知識として related のみに入れた。"},{"id":"2026春-4-019","lesson":4,"type":"成語","role":"見出し語","zh":"一腔热血","pinyin":"yì qiāng rè xuè","ja":"燃え上がるような情熱；一腔の熱血","ja_ai":false,"ja_note":"","def_zh":"指满含热烈真挚的感情，比喻为正义事业而献身的热情。","def_zh_ai":false,"examples":[{"zh":"他当初凭着一腔热血辞去了稳定的工作去创业，然而现实很快让他明白，光靠热情是远远不够的。","ja":"彼は当時、情熱だけを頼りに安定した仕事を辞めて起業したが、現実はすぐに、情熱だけでは到底うまくいかないことを思い知らせた。","ja_ai":false},{"zh":"虽然屡次遭遇挫折，但他那一腔热血从未冷却，始终坚信自己能够改变现状。","ja":"彼は何度も挫折を経験したが、その情熱が冷めることは一度もなく、いつか必ず現状を変えられると信じ続けていた。","ja_ai":false},{"zh":"很多年轻人都怀着一腔热血投身于公益事业，但他们往往缺乏应对复杂局面的经验。","ja":"多くの若者は熱い思いを胸に社会貢献活動に飛び込むが、複雑な状況に対応する経験が不足していることが少なくない。","ja_ai":false}],"related":[],"parent":"","pages":[225,230,236],"notes":"ピンインは資料どおり変調表記（yì）。"},{"id":"2026春-4-020","lesson":4,"type":"成語","role":"見出し語","zh":"双向奔赴","pinyin":"shuāng xiàng bēn fù","ja":"互いに向かって進む。双方が努力し合う関係","ja_ai":false,"ja_note":"","def_zh":"指为了实现共同的目标或愿景，双方彼此靠近、共同努力。常用于形容人际关系中的平等付出。","def_zh_ai":false,"examples":[{"zh":"粉丝与偶像之间最理想的状态莫过于双向奔赴，一方给予支持，另一方则用优秀的作品来回馈(huí kuì)。","ja":"ファンとアイドルの間で最も理想的な状態は、互いに努力し合う関係であり、一方が支持を与え、もう一方が優秀な作品で応えることだ。","ja_ai":false},{"zh":"在职场中，员工与公司的关系也需要双向奔赴，公司提供发展平台，员工则贡献自己的才华与忠诚。","ja":"職場においても、社員と会社の関係は互いに努力し合うことが必要だ。会社は発展の場を提供し、社員は自分の才能と忠誠心を捧げる。","ja_ai":false},{"zh":"我们都在抱怨朋友越来越难交，却忘了友谊本身就是一场双向奔赴，需要彼此投入时间和精力去维系。","ja":"私たちは友達が作りにくくなったと愚痴りながらも、友情そのものが互いに努力し合う関係であり、時間と労力を投じて維持する必要があることを忘れがちだ。","ja_ai":false}],"related":[],"parent":"","pages":[225,231,236],"notes":"伝統的な成語ではない新しい四字表現だが、四字の固定表現として type を成語とした。例文1の(huí kuì)は資料で半角括弧。"},{"id":"2026春-4-021","lesson":4,"type":"成語","role":"見出し語","zh":"大包大揽","pinyin":"dà bāo dà lǎn","ja":"何もかも一人で抱え込む","ja_ai":true,"ja_note":"すべての仕事や責任、役割を一人で引き受けること。自分の能力や役割の範囲を考えず、一人ですべてを抱え込んでしまうことを指し、仕事を独り占めしたり、適切に役割分担をしなかったりするという否定的な意味で使われることが多い。","def_zh":"把全部事情、责任、工作全部承揽下来；多指不顾自身能力、不分边界，独自包揽所有事务，常带有“做事独断、不懂得分工分担”的负面倾向。","def_zh_ai":false,"examples":[{"zh":"团队合作切忌凡事大包大揽，合理分工才能提升整体的工作效率。","ja":"チームで協力する際、何もかも一人で引き受けるのは厳に避けるべきで、適切な役割分担こそ全体の業務効率を高める。","ja_ai":false},{"zh":"管理者如果遇事大包大揽，下属会慢慢失去主动思考、自主解决问题的意识。","ja":"管理者が問題が起きるたび全て一人で対応すると、部下は次第に自主的に考え、問題を解決する意識を失ってしまう。","ja_ai":false},{"zh":"就算你的能力十分出众，也不能在项目里大包大揽，要给其他同事锻炼的空间。","ja":"たとえあなたの実力が非常に優れていても、プロジェクトの業務を全部一人で抱え込んではいけず、他の同僚に練習の場を与えなければならない。","ja_ai":false}],"related":[],"parent":"","pages":[225,232,236],"notes":""},{"id":"2026春-4-022","lesson":4,"type":"単語","role":"見出し語","zh":"前瞻性","pinyin":"qián zhān xìng","ja":"先見性","ja_ai":true,"ja_note":"将来の発展の流れを見通し、潜在的なチャンスやリスクを前もって予測できる考え方や視点、能力を指す。「前瞻（前瞻性）」とは、将来を見据え、長期的な視点で物事を考えることを意味する。","def_zh":"指能够提前预判未来发展趋势、提前看到潜在机遇与风险的特性、眼光与能力；“前瞻”即向前眺望、预判长远局势。","def_zh_ai":false,"examples":[{"zh":"优秀的企业决策者拥有极强的前瞻性，总能提前布局行业未来的发展赛道。","ja":"優れた企業の意思決定者は強い先見性を備えており、業界の将来の発展分野に事前に布石を打つことができる。","ja_ai":false},{"zh":"这份城市交通规划富有前瞻性，充分考虑了十年后人口增长带来的出行需求。","ja":"この都市交通計画は先見性にあふれており、10年後の人口増加に伴う移動ニーズを十分に考慮している。","ja_ai":false},{"zh":"只看重短期收益的项目方案缺乏前瞻性，很容易在行业变革中被市场淘汰（táo tài）。","ja":"短期的な利益ばかり重視するプランは先見性に欠け、業界の変革の波に市場から淘汰されやすい。","ja_ai":false}],"related":["前瞻","瞻前顾后","马首是瞻"],"parent":"","pages":[226,233,236],"notes":""},{"id":"2026春-4-023","lesson":4,"type":"成語","role":"見出し語","zh":"瞻前顾后","pinyin":"zhān qián gù hòu","ja":"あれこれ迷う／優柔不断","ja_ai":true,"ja_note":"もともとは、前を見たり後ろを振り返ったりすることを指す。転じて、物事を慎重に進める様子を表すほか、あれこれ心配しすぎて決断できず、優柔不断であることもいう。","def_zh":"原指看看前面，又看看后面。形容做事谨慎，也形容顾虑太多、犹豫不决。","def_zh_ai":false,"examples":[{"zh":"我们必须在月底前做出决定，已经没有时间让你瞻前顾后了，现在需要的是果断地采取行动。","ja":"私たちは月末までに決定を下さなければならない。あなたがためらっている時間はもうない。今必要なのは断固として行動を起こすことだ。","ja_ai":false}],"related":["前瞻性","马首是瞻"],"parent":"","pages":[234,236],"notes":"「成语学习」として 前瞻性 の「瞻」つながりで掲載。単語のまとめ p236 にあるため見出し語とした。資料ではピンインと語釈が連続していたのを分離。"},{"id":"2026春-4-024","lesson":4,"type":"成語","role":"見出し語","zh":"马首是瞻","pinyin":"mǎ shǒu shì zhān","ja":"人の指揮に従う／言いなりになる","ja_ai":true,"ja_note":"もともとは、戦場で兵士が主将の馬の向きを見て進退を決めたことを指す。そこから転じて、指揮に従ったり、人の行動に従って行動したりすることを意味する。","def_zh":"原指作战时士卒看着主将的马头决定进退方向，后泛指服从指挥或追随别人行动。","def_zh_ai":false,"examples":[{"zh":"我们鼓励团队合作，但不希望成员们盲目地唯领导马首是瞻，而丧失（sàng shī）了独立思考的能力。","ja":"私たちはチームワークを奨励するが、メンバーがリーダーの指揮に盲目的に従い、独立して考える能力を失うことは望んでいない。","ja_ai":false}],"related":["前瞻性","瞻前顾后"],"parent":"","pages":[235,236],"notes":"「成语学习」として掲載。例文は「唯～马首是瞻」の形。資料ではピンインと語釈が連続していたのを分離。"},{"id":"2026春-4-025","lesson":4,"type":"単語","role":"見出し語","zh":"交织","pinyin":"jiāo zhī","ja":"織り交ざる、入り混じる、複雑に絡み合う、絡み合う、交錯する","ja_ai":false,"ja_note":"","def_zh":"①多条线、事物互相穿插缠绕；②多种情感、因素、景象错综复杂地融合在一起。","def_zh_ai":false,"examples":[{"zh":"不同民族的文化在这里交织，长久的融合造就了包容多元的城市氛围。","ja":"複数の民族文化がここで交わり、長年の融合が寛容で多様な都市の雰囲気を生み出しました。","ja_ai":false},{"zh":"这座城市既保留了传统建筑，又建起了许多现代化高楼，传统文化与现代文明在这里相互交织。","ja":"この町には伝統的な建物が残る一方で近代的な高層ビルも建ち並び、伝統文化と現代文明が互いに交錯している。","ja_ai":false},{"zh":"回顾这几年的经历，我的心里交织着感激、遗憾和希望，因为每一次选择都让我成长了不少。","ja":"ここ数年を振り返ると、私の心には感謝、後悔、そして希望が入り交じっている。どの選択も私を大きく成長させてくれたからだ。","ja_ai":false}],"related":[],"parent":"","pages":[237,238],"notes":"単語のまとめページには無いが、語釈・例文付きで解説されているため見出し語とした。"},{"id":"2026春-4-026","lesson":4,"type":"単語","role":"見出し語","zh":"催生","pinyin":"cuī shēng","ja":"誘発する、生み出す、促して登場させる、促進する","ja_ai":false,"ja_note":"","def_zh":"①用外力促使事物加速产生、出现；②原指助产，现多用于经济、文化、行业语境，推动新业态、新需求诞生。","def_zh_ai":false,"examples":[{"zh":"大众对短途文旅的需求持续上涨，催生了串联城乡的一站式消费模式。","ja":"大衆の短期観光需要が伸び続け、都市と田舎をつなぐワンストップ消費モデルが誕生しました。","ja_ai":false},{"zh":"数字化办公的普及催生了线上协同工具，大幅降低了跨地域团队沟通成本。","ja":"デジタルオフィスの普及がオンライン共同作業ツールを生み出し、地域をまたぐチームの連絡コストを大きく削減しました。","ja_ai":false},{"zh":"短视频传播的浪潮催生了本地生活博主，为线下实体门店带来全新客流。","ja":"ショート動画の普及が地域生活インフルエンサーを生み出し、実店舗に新たな来店客をもたらしました。","ja_ai":false}],"related":[],"parent":"","pages":[237,239],"notes":"単語のまとめページには無いが、語釈・例文付きで解説されているため見出し語とした。"},{"id":"2026春-4-027","lesson":4,"type":"単語","role":"見出し語","zh":"撬动","pinyin":"qiào dòng","ja":"梃子で動かす、少ない資源で大きな資金 / 市場を動かす、呼び水となって牽引する","ja_ai":false,"ja_note":"","def_zh":"①本义用杠杆拨开、抬起重物；②引申义：以少量资源、政策、投入作为支点，带动大规模的资金、市场、资源流动。经济、议论文高频书面词。","def_zh_ai":false,"examples":[{"zh":"一次成功的城市体育赛事，足以撬动跨城市文旅联动，带动餐饮住宿全线增收。","ja":"成功した都市スポーツ大会は都市をまたぐ観光連携を動かし、飲食・宿泊業全体の売上増加を引き起こします。","ja_ai":false},{"zh":"只要我们能找到问题的关键点，就可以用有限的资源去撬动整个项目的发展。","ja":"問題の鍵となる点を見つけられれば、限られた資源でプロジェクト全体の発展を推進することができる。","ja_ai":false},{"zh":"如果只是靠传统的方法，那么我们很难撬动这些沉年的问题，必须寻求新的思路。","ja":"従来の方法だけに頼っていては、これらの長年の問題を解決するのは難しい。新しい考え方を模索しなければならない。","ja_ai":false}],"related":[],"parent":"","pages":[237,240],"notes":"単語のまとめページには無いが、語釈・例文付きで解説されているため見出し語とした。例文3の「沉年」は「陈年」の誤字の可能性（資料どおり）。"},{"id":"2026春-4-028","lesson":4,"type":"成語","role":"関連語","zh":"骁勇善战","pinyin":"xiāo yǒng shàn zhàn","ja":"勇敢で戦いに優れ","ja_ai":false,"ja_note":"","def_zh":"形容勇猛矫健，善于作战。","def_zh_ai":true,"examples":[{"zh":"人人骁勇善战（xiāo yǒng shàn zhàn），武艺高强","ja":"彼らは皆、勇敢で戦いに優れ（骁勇善战）、武芸にも秀でていました。","ja_ai":false}],"related":[],"parent":"","pages":[198],"notes":"知识补充「十三太保」の本文中にピンイン注付きで出た成語。ja は p198 の日本語訳の該当箇所をそのまま採用。例文は同ページの一節（文の途中まで）とその対応訳。中国語語釈は資料に無い。"},{"id":"2026春-4-029","lesson":4,"type":"単語","role":"関連語","zh":"嘉年华","pinyin":"jiā nián huá","ja":"カーニバル","ja_ai":false,"ja_note":"","def_zh":"大型的狂欢节、娱乐庆典活动。","def_zh_ai":true,"examples":[{"zh":"在“村超”赛场，侗族大歌、苗族舞蹈与足球竞技同台绽放，地方美食与激情呐喊交织共鸣；在“苏超”看台，“水蜜桃加油”“盐水鸭必胜”的趣味口号，以及各赛区融入的地方戏曲、非遗展示，将一场场比赛升级为地域文化展示的嘉年华（jiā nián huá カーニバル），让更多人为家乡自豪、为中国喝彩。","ja":"「村超」の会場では、トン族大歌やミャオ族の踊りがサッカーの試合とともに披露され、地元グルメと熱い声援が響き合う。「蘇超」の観客席では、「水蜜桃がんばれ」「塩水鴨必勝」といったユーモラスなスローガンや、各会場に取り入れられた地方劇・無形文化遺産の展示によって、一つ一つの試合が地域文化を披露するカーニバルへと格上げされ、より多くの人が故郷を誇りに思い、中国に喝采を送るようになっている。","ja_ai":true}],"related":[],"parent":"","pages":[237],"notes":"本文 p237 にピンインと日本語（カーニバル）の注付きで出た語。中国語語釈は資料に無い。"},{"id":"2026春-4-030","lesson":4,"type":"成語","role":"関連語","zh":"畅所欲言","pinyin":"chàng suǒ yù yán","ja":"思う存分に意見を述べる、言いたいことを遠慮なく話す","ja_ai":true,"ja_note":"","def_zh":"尽情地说出想说的话。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[205],"notes":"p205 の討論問題に「畅所欲言」（自由に話そう）という指示として出た成語。例文は資料に無い。ピンイン補完。"},{"id":"2026春-4-031","lesson":4,"type":"成語","role":"関連語","zh":"朴实无华","pinyin":"pǔ shí wú huá","ja":"質素で飾り気がない、素朴で華美でない","ja_ai":true,"ja_note":"","def_zh":"朴素实在，不加修饰，没有浮华。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[205],"notes":"p205 の学生回答メモ（选手有种没有修饰的像泥土一样的样子质朴 朴实无华）に出た成語。メモは文の断片のため例文にしていない。ピンイン補完。 【重複】第1課にも同じ語あり"},{"id":"2026春-4-032","lesson":4,"type":"慣用句","role":"関連語","zh":"有所为有所不为","pinyin":"yǒu suǒ wéi yǒu suǒ bù wéi","ja":"なすべきことはなし、なすべきでないことはしない","ja_ai":true,"ja_note":"","def_zh":"有些事情要做，有些事情不做，指做事有选择、有分寸。","def_zh_ai":true,"examples":[{"zh":"当管理部门从“台前”走到“幕后”，从“主导者”转成“共建者”“服务者”，有所为有所不为，来自民间的创造力、创新力就会如江河破冰、奔流不息。","ja":"管理部門が「表舞台」から「舞台裏」へと移り、「主導者」から「共に築く者」「サービスを提供する者」へと役割を変え、なすべきことはなし、なすべきでないことはしないようにすれば、民間から生まれる創造力や革新力は、氷を割って流れ出す大河のように絶え間なく湧き出てくる。","ja_ai":true}],"related":[],"parent":"","pages":[226],"notes":"本文 p226 に出た慣用句。ピンイン補完。"}]};
