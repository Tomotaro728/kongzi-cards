<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="孔子学院 復習カード">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>孔子学院 復習カード</title>
<style>
:root{
  --base:100%;
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#faf9f6; --text:#1d1f23; --muted:#646a73; --faint:#9aa0a8; --line:#e4e1da;
  --accent:#b3362c; --accent-ink:#ffffff; --accent-weak:#f8e6e3;
  --known:#2a8f3c; --known-ink:#ffffff; --known-weak:#e2f2e5;
  --unknown:#c25a1f; --unknown-ink:#ffffff; --unknown-weak:#fbe9dd;
  --chip:#eeebe5; --chip-on:#b3362c; --chip-on-ink:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.07);
  --rt:#4f555d; --overlay:rgba(0,0,0,.45); --toast-bg:#26282c; --toast-ink:#fff;
  --t1:#d33; --t2:#2a8f3c; --t3:#2458c5; --t4:#8a3ab9; --t5:#777;
  --font-zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-ja:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  --font-py:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141518; --surface:#1f2125; --surface2:#25282d; --text:#ececec; --muted:#a6abb3; --faint:#7a8089; --line:#34373d;
    --accent:#e46b5f; --accent-ink:#1b0f0d; --accent-weak:#3b2522;
    --known:#5cc477; --known-ink:#0d1f12; --known-weak:#1e3324;
    --unknown:#ec9a63; --unknown-ink:#25150a; --unknown-weak:#3a2a1f;
    --chip:#2b2e33; --chip-on:#e46b5f; --chip-on-ink:#1b0f0d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    --rt:#c3c8cf; --overlay:rgba(0,0,0,.6); --toast-bg:#eceef1; --toast-ink:#16171a;
    --t1:#ff6b6b; --t2:#5fd17c; --t3:#7aa7ff; --t4:#c994f3; --t5:#a3a3a3;
  }
}
*{box-sizing:border-box}
html{font-size:var(--base);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ja);line-height:1.6;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button,input,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[lang="zh-Hans"]{font-family:var(--font-zh)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
main.wrap{overflow-x:clip;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:6px;min-height:54px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;min-height:44px;
  font-weight:800;font-size:.95rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt{overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-zh);font-size:.95rem;font-weight:700}
nav.tabs{display:flex;gap:2px;flex:none}
nav.tabs button{min-height:44px;min-width:44px;padding:0 9px;border:0;background:transparent;border-radius:10px;font-weight:700;font-size:.88rem;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-weak)}

/* common controls */
h2.ttl{font-size:1.1rem;margin:18px 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:16px}
.field+.field{margin-top:18px}
.lbl{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
.lbl .sub{font-weight:500}
select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:max(16px,1rem)}
.seg{display:flex;background:var(--chip);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;min-height:44px;border:0;background:transparent;border-radius:10px;font-weight:700;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.checklist{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.lrow .ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);position:relative}
.lrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak)}
.lrow[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.lrow[aria-pressed="true"] .ck::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.lrow .lt{flex:1;min-width:0;line-height:1.35}
.lrow .lt b{display:block;font-size:.95rem}
.lrow .lt small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .n{flex:none;color:var(--muted);font-size:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:6px 18px;line-height:1.3;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:1rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.known{background:var(--known);border-color:var(--known);color:var(--known-ink)}
.btn.unknown{background:var(--unknown);border-color:var(--unknown);color:var(--unknown-ink)}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:grid;gap:10px;margin-top:14px}
.home-cta{position:sticky;bottom:0;z-index:10;margin-top:12px;padding:8px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.count{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.count b{font-size:1.35rem;color:var(--text);margin-right:2px}
.cta-row{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.resume{width:100%;margin-bottom:8px;min-height:44px;font-size:.92rem}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.icon-btn{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0}
.icon-btn svg{width:20px;height:20px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* study */
.study-top{display:flex;align-items:center;gap:8px;margin-top:12px}
.prog{flex:1;min-width:0}
.prog-txt{display:flex;justify-content:space-between;gap:6px;font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stage{position:relative;margin:14px 0 4px}
.swipe{position:relative;will-change:transform}
.card{perspective:1400px;cursor:pointer;-webkit-user-select:none;user-select:none;border-radius:var(--r)}
.card-inner{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);--card-h:clamp(300px,52vh,520px)}
.card.noanim .card-inner{transition:none}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;align-self:start;min-width:0;min-height:var(--card-h);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px 18px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.card:not(.flipped) .back,.card.flipped .front{pointer-events:none}
/* 表を見ているあいだは裏面の高さを表に合わせ、カードが縦に間延びしないようにする */
.card:not(.flipped) .back{max-height:var(--card-h);overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--chip);margin-right:4px;font-weight:700}
.badge.rel{background:transparent;border:1px solid var(--line)}
.src{white-space:nowrap}
.front-body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 0}
.ja-q{font-size:1.55rem;font-weight:800;line-height:1.55;overflow-wrap:anywhere}
.tap-hint{text-align:center;font-size:.75rem;color:var(--faint)}
.zh-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0;max-width:100%}
.back .zh-head{margin:20px 0 2px}
.zh-word{font-weight:600;line-height:1.3;overflow-wrap:anywhere;cursor:pointer;max-width:100%}
.zh-word.s1{font-size:3rem}.zh-word.s2{font-size:2.5rem}.zh-word.s3{font-size:2.1rem}.zh-word.s4{font-size:1.8rem}.zh-word.s5{font-size:1.5rem}
.zh-word ruby{ruby-position:over;-webkit-ruby-position:before;ruby-align:center;margin:0 .03em}
.zh-word rt{font-size:.6em;font-family:var(--font-py);font-weight:500;color:var(--rt);line-height:1.15;letter-spacing:0}
.card:not(.pin-on) .zh-word rt{visibility:hidden}
.zh-tools{display:flex;gap:8px;justify-content:center}
.ja-ans{font-size:1.25rem;font-weight:800;text-align:center;margin:10px 0 0;overflow-wrap:anywhere}
.sec{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.sec-h{font-size:.72rem;color:var(--muted);font-weight:800;letter-spacing:.06em;margin-bottom:4px}
.def{margin:0;font-size:1rem;overflow-wrap:anywhere}
.note{margin:0;font-size:.92rem;line-height:1.7;overflow-wrap:anywhere;white-space:pre-line}
ol.ex{margin:0;padding-left:1.4em}
ol.ex li{margin:4px 0 10px}
ol.ex li.ex-more{display:none}
.card.ex-open ol.ex li.ex-more{display:list-item}
.card.ex-open .more{display:none}
.ex-zh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-zh span{font-size:1.05rem;padding-top:8px;overflow-wrap:anywhere;min-width:0}
.ex-ja{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.more{min-height:44px;border:0;background:transparent;color:var(--accent);font-weight:800;padding:0 4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:.85rem}
.tag.parent{background:transparent;border:1px solid var(--line)}
.ai{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;border:1px solid var(--line);color:var(--faint);
  font-family:var(--font-ja);font-size:.6rem;font-weight:700;line-height:1.7;vertical-align:middle;white-space:nowrap}
.sw-tag{position:absolute;top:22px;z-index:5;padding:2px 12px;border:3px solid;border-radius:10px;font-weight:900;font-size:1.15rem;opacity:0;pointer-events:none;background:var(--surface)}
.sw-known{left:20px;color:var(--known);border-color:var(--known);transform:rotate(-10deg)}
.sw-unknown{right:20px;color:var(--unknown);border-color:var(--unknown);transform:rotate(10deg)}
.judge{position:sticky;bottom:0;z-index:10;display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;background:var(--bg);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.judge .btn{min-height:54px;font-size:1.05rem}
.judge #b-prev{padding:0 14px;font-size:.92rem}
.hint-line{text-align:center;font-size:.75rem;color:var(--faint);margin:0}

/* done */
.done h2{margin:4px 0 12px;font-size:1.2rem;text-align:center}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{border-radius:14px;padding:12px;text-align:center;font-weight:800}
.sc span{display:block;font-size:.85rem}
.sc b{font-size:2.2rem;line-height:1.2}
.sc.known{background:var(--known-weak);color:var(--known)}
.sc.unknown{background:var(--unknown-weak);color:var(--unknown)}
.done p{text-align:center;margin:12px 0 0}

/* list */
.search{margin-top:16px}
.search input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:max(16px,1rem)}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:table}
.tbl th{font-size:.75rem;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem;overflow-wrap:anywhere}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl .c-zh{font-size:1.15rem;font-weight:600;white-space:nowrap}
.tbl .c-py{font-family:var(--font-py);min-width:7em}
.tbl .c-ja{min-width:12em}
body.wide .wrap{max-width:960px}
.tbl .c-ls,.tbl .c-ty{white-space:nowrap;color:var(--muted);font-size:.8rem}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:800;white-space:nowrap}
.st.known{background:var(--known-weak);color:var(--known)}
.st.unknown{background:var(--unknown-weak);color:var(--unknown)}
.st.none{color:var(--faint);border:1px solid var(--line)}
@media (max-width:599px){
  .tbl,.tbl tbody{display:block}
  .tbl thead{display:none}
  .tbl tbody tr{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"zh zh st" "py py py" "ja ja ja" "ls ty ty";
    column-gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{padding:0;border:0}
  .tbl .c-zh{grid-area:zh;white-space:normal}
  .tbl .c-st{grid-area:st;justify-self:end;align-self:center}
  .tbl .c-py{grid-area:py;white-space:normal;font-size:.85rem}
  .tbl .c-ja{grid-area:ja;margin-top:2px;min-width:0}
  .tbl .c-ls{grid-area:ls;margin-top:4px}
  .tbl .c-ty{grid-area:ty;margin-top:4px}
}
.empty{text-align:center;color:var(--muted);padding:30px 0}

/* settings */
.set-note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.tone-demo{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-py);font-size:1rem;margin-top:8px}
.tone-demo span{white-space:nowrap}
.tone-on .t1{color:var(--t1)}.tone-on .t2{color:var(--t2)}.tone-on .t3{color:var(--t3)}.tone-on .t4{color:var(--t4)}.tone-on .t5{color:var(--t5)}
.reset-btns{display:grid;gap:8px}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:100;background:var(--overlay);display:grid;place-items:center;padding:16px}
.modal-box{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.modal-box p{margin:0 0 16px;white-space:pre-line}
.m-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:110;transform:translateX(-50%) translateY(10px);
  max-width:calc(100% - 32px);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  .card-inner,.bar i,.toast{transition:none!important}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button type="button" class="brand" data-nav="home"><span class="logo" lang="zh-Hans" aria-hidden="true">孔</span><span class="bt">孔子学院 復習カード</span></button>
  <nav class="tabs" aria-label="画面切替">
    <button type="button" data-nav="home">ホーム</button>
    <button type="button" data-nav="list">一覧</button>
    <button type="button" data-nav="settings">設定</button>
  </nav>
</div></header>

<main class="wrap" id="main">
  <!-- ホーム / フィルタ -->
  <section id="v-home" class="view">
    <div class="panel">
      <div class="field" id="f-sem-wrap" hidden><label class="lbl" for="f-sem">学期</label><select id="f-sem"></select></div>
      <div class="field"><div class="lbl">方向</div>
        <div class="seg" id="f-dir" role="group" aria-label="方向"><button type="button" data-v="ja2zh">日→中</button><button type="button" data-v="zh2ja">中→日</button></div></div>
      <div class="field"><div class="lbl">課 <span class="sub">（複数選択可）</span></div><div class="checklist" id="f-lessons"></div></div>
      <div class="field"><div class="lbl">種類</div><div class="chips" id="f-types"></div></div>
      <div class="field"><div class="lbl">見出し語／関連語</div><div class="chips" id="f-roles"></div></div>
      <div class="field"><div class="lbl">覚えた状況 <span class="sub" id="f-status-note"></span></div>
        <div class="seg" id="f-status" role="group" aria-label="覚えた状況"><button type="button" data-v="all">すべて</button><button type="button" data-v="unknown">まだ</button><button type="button" data-v="known">覚えた</button></div></div>
      <div class="field toggle-row"><div class="lbl" style="margin:0">出題順</div>
        <div class="seg" id="f-shuffle" role="group" aria-label="出題順" style="flex:1;max-width:240px"><button type="button" data-v="0">資料順</button><button type="button" data-v="1">シャッフル</button></div></div>
    </div>
    <div class="home-cta">
      <div class="count"><b id="h-count">0</b> 枚が該当</div>
      <button type="button" id="b-resume" class="btn ghost resume" hidden></button>
      <div class="cta-row">
        <button type="button" id="b-study" class="btn primary">カードで学習</button>
        <button type="button" id="b-tolist" class="btn">一覧を見る</button>
      </div>
    </div>
  </section>

  <!-- カード学習 -->
  <section id="v-study" class="view" hidden>
    <div class="study-top">
      <div class="prog"><div class="prog-txt"><span id="s-pos">0 / 0</span><span id="s-dir"></span></div><div class="bar"><i id="s-bar"></i></div></div>
      <button type="button" id="b-shuffle" class="pill" aria-pressed="false">シャッフル</button>
      <button type="button" id="b-quit" class="pill">終了</button>
    </div>
    <div class="stage">
      <div class="swipe" id="swipe">
        <div class="card" id="card" tabindex="0" role="button" aria-label="カード（タップでめくる）">
          <div class="card-inner">
            <div class="face front" id="face-front"></div>
            <div class="face back" id="face-back" aria-hidden="true"></div>
          </div>
        </div>
        <div class="sw-tag sw-known" id="tag-known" aria-hidden="true">覚えた</div>

window.CARD_DATA = {"semester":"2026春","lessons":[{"semester":"2026春","id":1,"title":"张雪：按照你想干的去干，一直干","pages":"1-44"},{"semester":"2026春","id":2,"title":"全款买房的年轻人 不想给银行打工了","pages":"45-113"},{"semester":"2026春","id":3,"title":"有耐心，好电影会自己长出来—从《给阿嬷的情书》谈起","pages":"114-185"},{"semester":"2026春","id":4,"title":"从“村超”到“苏超”，为啥都能踢进你我心门？","pages":"186-250"}],"cards":[{"id":"2026春-1-001","lesson":1,"type":"単語","role":"見出し語","zh":"别","pinyin":"bié","ja":"留める／差し込んで固定する","ja_ai":false,"ja_note":"","def_zh":"用针、夹等把物体固定在某处。","def_zh_ai":false,"examples":[{"zh":"衣领上别满近20个话筒，张雪被记者层层“包围”。","ja":"襟には20本近いマイクがびっしりと留められ、張雪は記者たちに幾重にも「包囲」された。","ja_ai":true},{"zh":"她把一枚胸针别在衣服上，让整体妆造显得更精致。","ja":"彼女はブローチを服につけて、全体のスタイルがより洗練されて見えるようにした。","ja_ai":false},{"zh":"他习惯把工作证别在胸前，这样进出办公楼比较方便。","ja":"彼はいつも社員証を胸元に留めているので、オフィスビルの出入りがしやすい。","ja_ai":true},{"zh":"她把头发别到耳后，看起来更加干净利落。","ja":"彼女は髪を耳にかけて、よりすっきりとして清潔感のある印象に見える。","ja_ai":false},{"zh":"他随手把笔别在本子边上，这样用起来更方便。","ja":"彼はペンを何気なくノートの端に挟んでおき、使うときに便利なようにしている。","ja_ai":true},{"zh":"演讲前，她把麦克风别在衣领上，然后开始发言。","ja":"スピーチの前に、彼女はマイクを襟に留めてから話し始めた。","ja_ai":true}],"related":[],"parent":"","pages":[3,4,19],"notes":"資料の例文5文のうち日本語訳は2文のみ（訳文の内容から「胸针」「头发」の例文に対応と判断）。1件目の例文は本文（p3）の引用。"},{"id":"2026春-1-002","lesson":1,"type":"単語","role":"見出し語","zh":"大呼","pinyin":"dà hū","ja":"大声で叫ぶ／（大勢が）口々に声を上げる","ja_ai":true,"ja_note":"","def_zh":"字面意思是大声地喊出来，对某件事产生强烈反应，并明显表达出来（常表达集体反应）","def_zh_ai":false,"examples":[{"zh":"几天前，以他名字命名的摩托车，在世界超级摩托车锦标赛上夺冠，让不少欧美日车队大呼“不可思议”。","ja":"数日前、彼の名を冠したオートバイがスーパーバイク世界選手権で優勝し、欧米や日本の多くのチームに「信じられない」と言わしめた。","ja_ai":true},{"zh":"这场比赛节奏紧张又精彩，观众看完后纷纷大呼过瘾，还意犹未尽。","ja":"この試合はテンポが速くて非常に精彩で、観客は見終わったあと皆「最高だ」と感じ、まだ物足りない様子だった。","ja_ai":false},{"zh":"服务质量下降后，顾客纷纷大呼不满，甚至有人提出投诉。","ja":"サービスの質が低下した後、顧客たちは次々と不満を表し、さらに苦情を申し立てる人もいた。","ja_ai":false},{"zh":"他突然宣布辞职，让同事们大呼意外，一时间难以接受。","ja":"彼が突然辞職を発表し、同僚たちは大いに驚き、しばらく受け入れられなかった。","ja_ai":false}],"related":["大呼过瘾","大呼不满","大呼意外","不可思议"],"parent":"","pages":[3,5,19],"notes":"ピンイン補完。資料見出しは「让……大呼“不可思议”」。まとめ（p19）では「大呼 不可思议」と並記。例文中のピンイン注: 节奏 jiézòu／意犹未尽 yì yóu wèi jìn／纷纷 fēnfēn／投诉 tóusù／辞职 cízhí／过瘾 guò yǐn（意犹未尽 は関連語カード化、他はカード化せず）。1件目の例文は本文（p3）の引用。"},{"id":"2026春-1-003","lesson":1,"type":"成語","role":"見出し語","zh":"不可思议","pinyin":"bù kě sī yì","ja":"信じられない／不思議だ／想像もつかない","ja_ai":true,"ja_note":"","def_zh":"难以理解或难以想象。","def_zh_ai":false,"examples":[{"zh":"他在这么短的时间内完成任务，让人觉得非常不可思议。","ja":"彼がこんなに短い時間で任務をやり遂げたことは、本当に信じられないと感じさせる。","ja_ai":true},{"zh":"他在这么短的时间内学会三门语言，简直不可思议。","ja":"彼がこんなに短期間で3つの言語を習得したなんて、まったく信じられない。","ja_ai":true},{"zh":"听到他放弃这么好的机会，我感到不可思议，一直想不通原因。","ja":"彼がこんなに良い機会を手放したと聞いて、私は信じられない思いで、ずっと理由がわからなかった。","ja_ai":true},{"zh":"这个结果实在太不可思议了，大家一时都无法接受。","ja":"この結果はあまりにも信じがたく、みんなしばらく受け入れられなかった。","ja_ai":true}],"related":["大呼"],"parent":"","pages":[5,6,19,38],"notes":"ピンイン補完。まとめページ p19（2回）・p38 に掲載。"},{"id":"2026春-1-004","lesson":1,"type":"単語","role":"見出し語","zh":"出圈","pinyin":"chū quān","ja":"広い層に拡散する／一般層に知られるようになる","ja_ai":false,"ja_note":"","def_zh":"突破原有小范围，被更广泛的人群关注或传播","def_zh_ai":false,"examples":[{"zh":"一夜之间，张雪“出圈”。","ja":"一夜にして、張雪は一躍「世間に知られる存在」となった。","ja_ai":true},{"zh":"这部小众电影突然出圈，被很多不看电影的人也关注到了。","ja":"このマイナーな映画は突然話題になり、普段映画を見ない多くの人にも注目された。","ja_ai":true},{"zh":"他原本只是业内有名，但这次比赛后彻底出圈了。","ja":"彼はもともと業界内で知られているだけだったが、今回の試合をきっかけに一気に広く知られるようになった。","ja_ai":false}],"related":[],"parent":"","pages":[7,19],"notes":"例文中のピンイン注: 彻底 chèdǐ。本文 p33 にも「“出圈”后」として再出。"},{"id":"2026春-1-005","lesson":1,"type":"成語","role":"見出し語","zh":"死缠烂打","pinyin":"sǐ chán làn dǎ","ja":"しつこく食い下がる／執拗に食らいつく","ja_ai":false,"ja_note":"","def_zh":"纠缠不休，用各种方式反复请求或跟随。","def_zh_ai":false,"examples":[{"zh":"一段20年前他“死缠烂打”追记者的视频，被人们反复观看。","ja":"20年前に彼が記者に「しつこく食い下がって」ついて回った映像が、人々に繰り返し視聴された。","ja_ai":true},{"zh":"他一直死缠烂打地请求对方帮忙，让人有点不舒服。","ja":"彼はしつこく相手に助けを求め続け、周りを少し不快にさせた。","ja_ai":true},{"zh":"他向对方表白被拒绝后，还天天打电话、发信息死缠烂打，这种行为很不礼貌。","ja":"彼は告白して断られた後も、毎日電話をかけたりメッセージを送ったりしてしつこく付きまとっており、こうした行為はとても失礼だ。","ja_ai":true}],"related":[],"parent":"","pages":[7,19],"notes":"例文中の「礼貌」に（lǐ mào）のピンイン注あり（例文 zh からは除去）。"},{"id":"2026春-1-006","lesson":1,"type":"単語","role":"見出し語","zh":"上百","pinyin":"shàng bǎi","ja":"（数が）百を超える／百以上に達する","ja_ai":true,"ja_note":"百、千、万、億といった大きな数の単位と概数にのみ使われ、正確な数字には使いません。数が多いことを強調するニュアンスがあり、距離、人数、時間、金額、生産量などによく使われます。","def_zh":"表示数量达到并超出某个标准。只用于大数（百、千、万、亿）、概数，不用于精确数字，带有强调数量多的语气，多用于距离、人数、时间、金额、产量等。","def_zh_ai":false,"examples":[{"zh":"视频里，19岁的张雪跟随电视台摄制组冒雨骑行上百公里，只为在镜头前展示他的摩托车技术。","ja":"映像の中で、19歳の張雪はテレビ局の撮影クルーについて雨の中を100キロ以上もバイクで走った。ただカメラの前で自分のバイクの腕前を見せるためだった。","ja_ai":true},{"zh":"会场里聚集了上百人。","ja":"会場には100人以上が集まった。","ja_ai":true},{"zh":"节假日期间，这个景点接待游客上万人次。","ja":"連休期間中、この観光地は延べ1万人以上の観光客を受け入れた。","ja_ai":true},{"zh":"从这座城市到海边，距离有上百公里。","ja":"この町から海辺までは、100キロ以上の距離がある。","ja_ai":true},{"zh":"这部新款耳机价格上千元，有点贵。","ja":"この新型イヤホンは価格が1000元以上もして、少し高い。","ja_ai":true}],"related":["上千","上万","成百上千","成千上万"],"parent":"","pages":[3,8],"notes":"ピンイン補完。資料見出しは「上百公里」、型の例として「上百人 上千元 上万次」を提示（上+百/千/万/亿 の文型）。語釈は「上百公里表示数量达到并超出某个标准」＋用法説明を連結。資料の日本語解説（用法説明）は ja_note に収録、ja は補完。まとめページには無し。1件目の例文は本文（p3）の引用。"},{"id":"2026春-1-007","lesson":1,"type":"成語","role":"見出し語","zh":"成百上千","pinyin":"chéng bǎi shàng qiān","ja":"何百何千もの／非常に多くの","ja_ai":true,"ja_note":"","def_zh":"形容数量很多，成百成千。","def_zh_ai":true,"examples":[{"zh":"每天都有成百上千的游客来这里参观。","ja":"毎日、何百何千もの観光客がここを見学に訪れる。","ja_ai":true}],"related":["上百","成千上万"],"parent":"","pages":[8,19],"notes":"ピンイン補完。p8 で 上百 の関連表現として提示、まとめ p19 に掲載のため見出し語。"},{"id":"2026春-1-008","lesson":1,"type":"成語","role":"見出し語","zh":"成千上万","pinyin":"chéng qiān shàng wàn","ja":"何千何万もの／数えきれないほど多くの","ja_ai":true,"ja_note":"","def_zh":"形容数量极多。","def_zh_ai":true,"examples":[{"zh":"网络上成千上万的人都在关注这件事。","ja":"ネット上で何千何万もの人がこの件に注目している。","ja_ai":true}],"related":["上百","成百上千"],"parent":"","pages":[8,19],"notes":"ピンイン補完。p8 で 上百 の関連表現として提示、まとめ p19 に掲載のため見出し語。"},{"id":"2026春-1-009","lesson":1,"type":"慣用句","role":"見出し語","zh":"赛道上的车展","pinyin":"sài dào shang de chē zhǎn","ja":"サーキット上のモーターショー","ja_ai":false,"ja_note":"","def_zh":"比喻WSBK赛事：参赛车辆基于量产车改装，是厂商展示量产车技术实力的舞台。","def_zh_ai":true,"examples":[{"zh":"与世界摩托车锦标赛（MotoGP）原型车体系不同，WSBK赛事最大特点是参赛车辆基于量产车进行有限改装，因此被誉为“赛道上的车展”，是摩托车制造商展示量产车技术实力的重要舞台之一。","ja":"世界ロードレース選手権（MotoGP）のプロトタイプ車両体系とは異なり、WSBKの最大の特徴は、参戦車両が量産車をベースに限定的な改造を施したものである点にある。そのため、「サーキット上のモーターショー」とも呼ばれ、各メーカーが量産車の技術力を示す重要な舞台の一つとされている。","ja_ai":false}],"related":[],"parent":"","pages":[11,19],"notes":"ピンイン補完（「上」は方位詞として軽声表記）。出典は「知识补充」（WSBK の説明）だが、まとめ p19 に掲載されているため見出し語にした。ja は p11 の日本語訳中の表現。"},{"id":"2026春-1-010","lesson":1,"type":"慣用句","role":"見出し語","zh":"拨开乌云见明月","pinyin":"bō kāi wū yún jiàn míng yuè","ja":"暗雲を払って明月を見る（長い苦難の末にようやく成功・希望が訪れる）","ja_ai":true,"ja_note":"","def_zh":"经历长期困难之后，终于迎来成功或希望。","def_zh_ai":false,"examples":[{"zh":"夺冠后，朋友给他发信息说，“终于拨开乌云见明月了”。","ja":"優勝後、友人は彼に「ついに暗雲が晴れて明月が見えたね」とメッセージを送った。","ja_ai":true}],"related":["守得云开见月明"],"parent":"","pages":[13],"notes":"ピンイン補完。p13 の問い「拨开乌云见明月是什么意思？」への答えを語釈とした。まとめページには無いが語釈付きのため見出し語扱い。"},{"id":"2026春-1-011","lesson":1,"type":"慣用句","role":"関連語","zh":"道不同不相为谋","pinyin":"dào bù tóng bù xiāng wéi móu","ja":"志す道が異なれば、共に事を図ることはできない","ja_ai":true,"ja_note":"","def_zh":"主张、志向不同的人，无法在一起共事、谋划。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[13],"notes":"ピンイン補完。p13 本文の行末に「道不同 不相为谋」と単独で書き込まれており、どの見出し語に付随するか不明のため parent は空。出典は『論語』。"},{"id":"2026春-1-012","lesson":1,"type":"慣用句","role":"見出し語","zh":"守得云开见月明","pinyin":"shǒu de yún kāi jiàn yuè míng","ja":"耐え抜けば雲が晴れて月が見える／辛抱を続ければいつか必ず報われる","ja_ai":true,"ja_note":"","def_zh":"是一种坚持和永不放弃的积极乐观的精神。意思就是说只有坚持到底的人才能等到拨云见日，云散月明的一天。","def_zh_ai":false,"examples":[{"zh":"人生再难，也要相信守得云开见月明。","ja":"人生がどんなに困難でも、耐え抜けばいつか雲が晴れて月が見えると信じなければならない。","ja_ai":true},{"zh":"只要你继续努力，总有一天守得云开见月明。","ja":"努力を続けさえすれば、いつか必ず雲が晴れて月が見える日が来る。","ja_ai":true}],"related":["拨开乌云见明月","拨云见日"],"parent":"","pages":[14,19],"notes":"ピンイン補完。"},{"id":"2026春-1-013","lesson":1,"type":"成語","role":"見出し語","zh":"心甘情愿","pinyin":"xīn gān qíng yuàn","ja":"心から進んで〜する／喜んで〜する","ja_ai":false,"ja_note":"","def_zh":"完全出于自愿，没有一点勉强。","def_zh_ai":true,"examples":[{"zh":"他愿意为梦想一直努力，即使最终无法成功、看不到希望，也心甘情愿，无怨无悔。","ja":"彼は夢のためにずっと努力し続けたいと思っており、たとえ最終的に成功できず希望が見えなくても、喜んでそれを受け入れ、悔いはない。","ja_ai":true}],"related":["无怨无悔"],"parent":"","pages":[14,19],"notes":"例文は p14 の問い（張雪の言葉の意味）に対する解説文。資料では語の後に（xīn gān qíng yuàn）の注（例文 zh からは除去）。"},{"id":"2026春-1-014","lesson":1,"type":"成語","role":"見出し語","zh":"无怨无悔","pinyin":"wú yuàn wú huǐ","ja":"後悔も不満もない／悔いはない","ja_ai":false,"ja_note":"","def_zh":"没有抱怨，也不后悔。","def_zh_ai":true,"examples":[{"zh":"他愿意为梦想一直努力，即使最终无法成功、看不到希望，也心甘情愿，无怨无悔。","ja":"彼は夢のためにずっと努力し続けたいと思っており、たとえ最終的に成功できず希望が見えなくても、喜んでそれを受け入れ、悔いはない。","ja_ai":true}],"related":["心甘情愿"],"parent":"","pages":[14,19],"notes":"例文は p14 の問い（張雪の言葉の意味）に対する解説文。資料では語の後に（wú yuàn wú huǐ）の注（例文 zh からは除去）。"},{"id":"2026春-1-015","lesson":1,"type":"単語","role":"見出し語","zh":"痴迷","pinyin":"chī mí","ja":"夢中になる／熱中する","ja_ai":false,"ja_note":"","def_zh":"深深地迷恋某种事物，到了难以自拔的程度。","def_zh_ai":true,"examples":[{"zh":"本田宗一郎痴迷机械，张雪也是。","ja":"本田宗一郎は機械に夢中だったが、張雪もそうだ。","ja_ai":true}],"related":[],"parent":"","pages":[14,35],"notes":"p14 に「痴迷 身体发肤」と単独で書き込み。p35 本文中に（chī mí 夢中になる／熱中する）の注があり、そこからピンイン・訳を採用。まとめページには無い。"},{"id":"2026春-1-016","lesson":1,"type":"成語","role":"関連語","zh":"身体发肤","pinyin":"shēn tǐ fà fū","ja":"体・髪・皮膚（親から授かったこの身）","ja_ai":true,"ja_note":"","def_zh":"指人的身体，语出《孝经》“身体发肤，受之父母”。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[14,33],"notes":"ピンイン補完。p14・p33 の本文ページ末尾に単独で書き込み（授業中の話題と思われる）。親見出し語不明のため parent は空。"},{"id":"2026春-1-017","lesson":1,"type":"単語","role":"見出し語","zh":"灵光","pinyin":"líng guāng","ja":"頭の回転が速い／機転が利く","ja_ai":false,"ja_note":"","def_zh":"头脑反应快、聪明、思路清楚","def_zh_ai":false,"examples":[{"zh":"“我脑袋灵光些，想问题能想到点上去。”","ja":"「自分は頭の回転が少し速くて、物事のポイントをつかむことができるんです。」","ja_ai":false},{"zh":"她脑子很灵光，一点就通。","ja":"彼女は頭の回転が速くて、少し言えばすぐに理解できる。","ja_ai":false},{"zh":"遇到问题要脑子灵光一点，别钻牛角尖。","ja":"問題にぶつかったときは頭を柔軟にして、考え込みすぎないようにしなさい。","ja_ai":false}],"related":["一点就通","钻牛角尖"],"parent":"","pages":[17,19],"notes":"ピンイン補完。まとめ p19 では「灵光 一点就通」と並記。"},{"id":"2026春-1-018","lesson":1,"type":"成語","role":"見出し語","zh":"一点就通","pinyin":"yī diǎn jiù tōng","ja":"少し言えばすぐ分かる／飲み込みが早い","ja_ai":true,"ja_note":"","def_zh":"稍微一点拨就能明白，形容人聪明、理解力强。","def_zh_ai":true,"examples":[{"zh":"她脑子很灵光，一点就通。","ja":"彼女は頭の回転が速くて、少し言えばすぐに理解できる。","ja_ai":false}],"related":["灵光"],"parent":"","pages":[17,19],"notes":"ピンイン補完（「一」は本来声調 yī で表記）。まとめ p19 に「灵光 一点就通」と並記されているため見出し語。"},{"id":"2026春-1-019","lesson":1,"type":"成語","role":"関連語","zh":"钻牛角尖","pinyin":"zuān niú jiǎo jiān","ja":"袋小路に入り込む／些細なことにこだわって考え込む","ja_ai":true,"ja_note":"","def_zh":"比喻费力研究不值得研究或无法解决的问题，也指固执地坚持某种看法，不知变通。","def_zh_ai":true,"examples":[{"zh":"遇到问题要脑子灵光一点，别钻牛角尖。","ja":"問題にぶつかったときは頭を柔軟にして、考え込みすぎないようにしなさい。","ja_ai":false}],"related":["灵光","一根筋"],"parent":"灵光","pages":[17,39],"notes":"ピンイン補完。p17 灵光 の例文中に登場し、p39 課堂討論記録にも記載。四字の固定表現のため type は成語とした（中国語学上は惯用语）。"},{"id":"2026春-1-020","lesson":1,"type":"成語","role":"関連語","zh":"不厌其烦","pinyin":"bù yàn qí fán","ja":"面倒をいとわない／根気よく繰り返す","ja_ai":true,"ja_note":"","def_zh":"不嫌麻烦，形容很有耐心。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[17],"notes":"ピンイン補完。p17 のページ末尾に単独で書き込み。どの語に付随するか不明のため parent は空。"},{"id":"2026春-1-021","lesson":1,"type":"慣用句","role":"見出し語","zh":"到点上","pinyin":"dào diǎn shang","ja":"要点を押さえられる／核心を突ける","ja_ai":false,"ja_note":"","def_zh":"能抓住问题的关键/本质","def_zh_ai":false,"examples":[{"zh":"她考虑问题总能想到点上，所以大家都很信任她的判断。","ja":"彼女は物事を考えるときいつも要点を押さえられるので、みんな彼女の判断を信頼している。","ja_ai":true},{"zh":"有些人说了很多，但一句都没说到点上。","ja":"話はたくさんしているのに、肝心な点にはまったく触れていない人もいる。","ja_ai":false},{"zh":"如果分析不到点上，就很难找到真正的解决办法。","ja":"分析が要点を押さえていなければ、本当の解決策を見つけるのは難しい。","ja_ai":false},{"zh":"你刚才那个问题问到点上了，大家都开始认真思考。","ja":"さっきのあなたの質問は要点を突いていて、みんな真剣に考え始めた。","ja_ai":false},{"zh":"“我脑袋灵光些，想问题能想到点上去。”","ja":"「自分は頭の回転が少し速くて、物事のポイントをつかむことができるんです。」","ja_ai":false}],"related":["想到点上","说到点上","问到点上","灵光"],"parent":"","pages":[17,18,19],"notes":"ピンイン補完（「上」は方向補語として軽声表記）。資料の見出しは文型「V+到点上」（zh は記号を除くため「到点上」とした）。三字の文型のため type は慣用句とした（単語扱いも可）。"},{"id":"2026春-1-022","lesson":1,"type":"単語","role":"見出し語","zh":"产业集群","pinyin":"chǎn yè jí qún","ja":"産業集積","ja_ai":false,"ja_note":"","def_zh":"同一产业的众多企业及相关机构在某一地区集中分布而形成的群体。","def_zh_ai":true,"examples":[{"zh":"“产业集群。”张雪答得干脆。","ja":"「産業集積です」と張雪はきっぱりと答えた。","ja_ai":false},{"zh":"目前正从传统燃油向电动化、高端化转型，形成庞大产业集群，并在高性能大排量越野摩托车领域领先，出口排名前十企业占5席。","ja":"現在、同地域は従来のガソリン車から電動化・高付加価値化への転換を進めており、大規模な産業クラスターを形成している。また、高性能・大排気量のオフロードバイク分野で先行しており、輸出額上位10社のうち5社を占めている。","ja_ai":false}],"related":[],"parent":"","pages":[20,21,22],"notes":"ピンイン補完。p20 本文末に日本語訳「産業集積」のみ付記（語釈・例文の解説スライドは無く、まとめページにも無い）。訳付きのため見出し語扱いとしたが、関連語扱いでもよい。p22（知识补充）では「産業クラスター」と訳出。四字だが複合名詞のため type は単語。"},{"id":"2026春-1-023","lesson":1,"type":"成語","role":"見出し語","zh":"身兼数职","pinyin":"shēn jiān shù zhí","ja":"一人で複数の役割を兼ねる／多役をこなす","ja_ai":false,"ja_note":"","def_zh":"一个人同时做多个工作 / 担任多个角色","def_zh_ai":false,"examples":[{"zh":"刚来重庆，他先靠手艺赚钱：通过论坛发帖、网店销售，帮车友改装摩托车，一人身兼美工、客服、售后。","ja":"重慶に来たばかりの頃、彼はまず自分の技術で生計を立てた。フォーラムに投稿したり、ネットショップで販売したりして、バイク仲間のためにカスタムを手がけ、美工・カスタマーサポート・アフターサービスを一人で兼任していた。","ja_ai":false},{"zh":"创业初期人手不足，他一人身兼数职，既做管理又负责销售。","ja":"創業初期は人手が足りず、彼は一人で何役もこなし、管理も販売も担当した。","ja_ai":true},{"zh":"在小公司里，员工常常身兼数职，因此工作压力比较大。","ja":"小さな会社では社員が複数の役割を兼ねることが多く、そのため仕事のプレッシャーが比較的大きい。","ja_ai":true}],"related":[],"parent":"","pages":[23,24,25,38],"notes":"本文は「一人身兼美工、客服、售后」（身兼＋具体的な役割）の形。1件目の例文は本文 p23、訳は p24。"},{"id":"2026春-1-024","lesson":1,"type":"単語","role":"見出し語","zh":"众筹","pinyin":"zhòng chóu","ja":"クラウドファンディング","ja_ai":false,"ja_note":"","def_zh":"通过很多人一起筹集资金","def_zh_ai":false,"examples":[{"zh":"缺少资金，他就“众筹”，让车友先付钱，他再买零件改装。","ja":"資金が不足すると、「クラウドファンディング」の形で仲間に先に代金を支払ってもらい、その後で部品を購入して改装を行った。","ja_ai":false},{"zh":"他通过网络发起众筹项目，成功筹集到启动资金。","ja":"彼はネットでクラウドファンディングのプロジェクトを立ち上げ、立ち上げ資金を集めることに成功した。","ja_ai":true},{"zh":"她把自己的创意发布到平台上进行众筹，一方面解决了资金问题，另一方面也积累了第一批用户。","ja":"彼女は自分のアイデアをプラットフォームに公開してクラウドファンディングを行い、資金問題を解決すると同時に、最初のユーザーも獲得した。","ja_ai":false}],"related":[],"parent":"","pages":[23,24,25,38],"notes":"1件目の例文は本文 p23、訳は p24。"},{"id":"2026春-1-025","lesson":1,"type":"成語","role":"見出し語","zh":"自立门户","pinyin":"zì lì mén hù","ja":"独立する／独自に一派を立てる","ja_ai":true,"ja_note":"独立して家庭を築くことを指す。また、学問の分野で先人に依存せず独自の一派を立てることもいう。現在では、ある集団を離れて独自に別のやり方を行うことも指す。","def_zh":"指单独成立家庭。也指学术上不依赖前人而另立一派。现也指离开某一集体，自己另搞一套。","def_zh_ai":false,"examples":[{"zh":"2024年4月，他自立门户，创立张雪机车。","ja":"2024年4月には独立して、自身の名を冠した「張雪機車」を創立。","ja_ai":false},{"zh":"兄弟俩原本一起经营店铺，后来理念不合，便各自自立门户，分开做生意。","ja":"兄弟二人はもともと一緒に店を経営していたが、のちに考え方が合わなくなり、それぞれ独立して別々に商売をするようになった。","ja_ai":true},{"zh":"他在公司积累了经验和人脉后，选择自立门户，创办了自己的工作室。","ja":"彼は会社で経験と人脈を積んだ後、独立して自分のスタジオを立ち上げた。","ja_ai":true},{"zh":"这位设计师不愿再受雇于人，决定自立门户，开设个人设计事务所。","ja":"このデザイナーはもう人に雇われたくないと考え、独立して個人のデザイン事務所を開くことにした。","ja_ai":true}],"related":[],"parent":"","pages":[23,24,26,38],"notes":"資料の日本語は語釈の訳（長文）のため ja_note に収録し、ja は短い訳語を補完。1件目の例文の訳は本文訳 p24。"},{"id":"2026春-1-026","lesson":1,"type":"単語","role":"見出し語","zh":"发帖","pinyin":"fā tiě","ja":"投稿する／書き込みをする","ja_ai":false,"ja_note":"","def_zh":"在网络平台发布帖子 / 发言","def_zh_ai":false,"examples":[{"zh":"他在论坛发帖求助，很快就有人给出了建议。","ja":"彼が掲示板に投稿して助けを求めると、すぐに誰かがアドバイスをくれた。","ja_ai":true},{"zh":"她经常发帖分享生活，因此积累了不少粉丝。","ja":"彼女はよく投稿して日常をシェアしているので、たくさんのフォロワーを獲得した。","ja_ai":true},{"zh":"有人发帖吐槽这个产品质量不好，没想到评论区一下子热闹起来。","ja":"ある人がこの製品の品質がよくないと投稿して不満を述べたところ、コメント欄が一気に盛り上がった。","ja_ai":false},{"zh":"刚来重庆，他先靠手艺赚钱：通过论坛发帖、网店销售，帮车友改装摩托车，一人身兼美工、客服、售后。","ja":"重慶に来たばかりの頃、彼はまず自分の技術で生計を立てた。フォーラムに投稿したり、ネットショップで販売したりして、バイク仲間のためにカスタムを手がけ、美工・カスタマーサポート・アフターサービスを一人で兼任していた。","ja_ai":false}],"related":["帖子","回帖","请帖"],"parent":"","pages":[23,24,27,38],"notes":"例文中のピンイン注: 吐槽 tǔ cáo（カード化せず）。4件目の例文は本文 p23、訳は p24。"},{"id":"2026春-1-027","lesson":1,"type":"単語","role":"関連語","zh":"帖子","pinyin":"tiě zi","ja":"（ネット掲示板などの）投稿／書き込み","ja_ai":true,"ja_note":"","def_zh":"在网络论坛等处发布的文章或留言。","def_zh_ai":true,"examples":[],"related":["发帖"],"parent":"发帖","pages":[27],"notes":"ピンイン補完（資料は「tiě 帖子 回帖 请帖」と「帖」の読み tiě の語例として列挙）。"},{"id":"2026春-1-028","lesson":1,"type":"単語","role":"関連語","zh":"回帖","pinyin":"huí tiě","ja":"返信を書き込む／返信の投稿","ja_ai":true,"ja_note":"","def_zh":"在论坛中回复别人的帖子；也指回复的帖子。","def_zh_ai":true,"examples":[],"related":["发帖"],"parent":"发帖","pages":[27],"notes":"ピンイン補完（資料は「tiě 帖子 回帖 请帖」と「帖」の読み tiě の語例として列挙）。"},{"id":"2026春-1-029","lesson":1,"type":"単語","role":"関連語","zh":"请帖","pinyin":"qǐng tiě","ja":"招待状","ja_ai":true,"ja_note":"","def_zh":"邀请客人时送去的通知，请柬。","def_zh_ai":true,"examples":[],"related":["发帖"],"parent":"发帖","pages":[27],"notes":"ピンイン補完（資料は「tiě 帖子 回帖 请帖」と「帖」の読み tiě の語例として列挙）。"},{"id":"2026春-1-030","lesson":1,"type":"単語","role":"見出し語","zh":"曲折","pinyin":"qū zhé","ja":"曲がりくねっている／紆余曲折がある","ja_ai":false,"ja_note":"","def_zh":"（具体）弯弯曲曲（抽象）过程不顺利、有变化","def_zh_ai":false,"examples":[{"zh":"我走的每一步，哪怕有些曲折，但是一定朝着这个方向。","ja":"自分の歩む一歩一歩は、たとえ多少の曲折があっても、必ずその方向に向かっているんです。","ja_ai":false},{"zh":"这条山路非常曲折，所以开车时一定要小心。","ja":"この山道はとても曲がりくねっているので、運転するときは必ず気をつけなければならない。","ja_ai":true},{"zh":"虽然过程有些曲折，但他最终还是实现了目标。","ja":"過程には多少の紆余曲折があったが、彼は最終的に目標を達成した。","ja_ai":true}],"related":["歌曲"],"parent":"","pages":[23,24,27,38],"notes":"1件目の例文は本文 p23、訳は p24。"},{"id":"2026春-1-031","lesson":1,"type":"単語","role":"関連語","zh":"歌曲","pinyin":"gē qǔ","ja":"歌／歌曲","ja_ai":true,"ja_note":"","def_zh":"供人歌唱的作品。","def_zh_ai":true,"examples":[],"related":["曲折"],"parent":"曲折","pages":[27],"notes":"「曲」の読み分け（曲折 qū／歌曲 qǔ）として提示された語。ピンインは資料どおり。"},{"id":"2026春-1-032","lesson":1,"type":"単語","role":"見出し語","zh":"调校","pinyin":"tiáo jiào","ja":"調整する／チューニングする／セッティングする","ja_ai":false,"ja_note":"","def_zh":"对设备、系统、参数等进行细致调整，使其性能更好、更准确","def_zh_ai":false,"examples":[{"zh":"这次夺冠的车型，发动机、关键零部件到整车调校，均实现国产化。","ja":"今回優勝した車両は、エンジンや主要部品から車体のセッティングに至るまで、すべて国産化が実現されている。","ja_ai":false},{"zh":"这款车经过专业团队调校，因此在性能和稳定性方面表现得非常出色。","ja":"この車は専門チームによってチューニングされているため、性能と安定性の面で非常に優れている。","ja_ai":true},{"zh":"工程师对系统进行了多次调校，最终达到了理想的运行效果。","ja":"エンジニアはシステムに何度も調整を加え、最終的に理想的な動作を実現した。","ja_ai":true}],"related":["校对","校正","校准"],"parent":"","pages":[23,24,28,38],"notes":"資料に字解「调 = 调整　校 = 校正」あり。1件目の例文は本文 p23、訳は p24。"},{"id":"2026春-1-033","lesson":1,"type":"単語","role":"見出し語","zh":"校对","pinyin":"jiào duì","ja":"校正","ja_ai":false,"ja_note":"","def_zh":"按照原稿或标准核对文字、数据等，改正其中的错误。","def_zh_ai":true,"examples":[{"zh":"正式印刷前要再校对一遍。","ja":"正式に印刷する前に、もう一度校正しなければならない。","ja_ai":true}],"related":["校正","校准","调校"],"parent":"","pages":[28,38],"notes":"ピンイン補完。p28 下部の日本語対訳欄「校正／補正 修正／較正 調整」を 校对・校正・校准 の順に対応すると判断（日本語の「校正」＝中国語の校对）。要確認。まとめ p38 に掲載。"},{"id":"2026春-1-034","lesson":1,"type":"単語","role":"見出し語","zh":"校正","pinyin":"jiào zhèng","ja":"補正／修正","ja_ai":false,"ja_note":"","def_zh":"校对并改正（错误）；也指对仪器等进行校准修正。","def_zh_ai":true,"examples":[{"zh":"老师帮我校正了作文中的错误。","ja":"先生が作文の誤りを直してくれた。","ja_ai":true}],"related":["校对","校准","调校"],"parent":"","pages":[28,38],"notes":"ピンイン補完。ja は p28 対訳欄「補正  修正」（対応関係は推定、校对 の notes 参照）。資料では 调校 の字解（校 = 校正）にも登場。"},{"id":"2026春-1-035","lesson":1,"type":"単語","role":"見出し語","zh":"校准","pinyin":"jiào zhǔn","ja":"較正／調整","ja_ai":false,"ja_note":"","def_zh":"对仪器、钟表等的精度进行核对并调整，使其准确。","def_zh_ai":true,"examples":[{"zh":"钟表店帮我校准了手表时间。","ja":"時計店で腕時計の時刻を合わせてもらった。","ja_ai":true}],"related":["校对","校正","调校"],"parent":"","pages":[28,38],"notes":"ピンイン補完。ja は p28 対訳欄「較正  調整」（対応関係は推定、校对 の notes 参照）。"},{"id":"2026春-1-036","lesson":1,"type":"成語","role":"関連語","zh":"慕名而来","pinyin":"mù míng ér lái","ja":"評判を聞いて（慕って）やって来る","ja_ai":true,"ja_note":"","def_zh":"因仰慕对方的名声而来。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[29],"notes":"ピンイン補完。p29 本文の段落末に単独で書き込み。親見出し語不明のため parent は空。"},{"id":"2026春-1-037","lesson":1,"type":"単語","role":"見出し語","zh":"瓶颈","pinyin":"píng jǐng","ja":"ボトルネック／発展の制約となる要因","ja_ai":false,"ja_note":"","def_zh":"比喻事物发展过程中遇到的限制或关键难点","def_zh_ai":false,"examples":[{"zh":"“瓶颈在研发。”张雪有点着急，公司现在有200多名工程师，只能同时推进三四个项目，“如果有500个工程师，上市的车型就会更多、更快。”","ja":"「ボトルネックは研究開発だ」。張雪は少し焦っている。会社には現在200人余りのエンジニアがいるが、同時に進められるプロジェクトは三つか四つだけだ。「もしエンジニアが500人いれば、発売できる車種はもっと多く、もっと速くなる。」","ja_ai":true},{"zh":"目前公司发展的最大瓶颈在于技术创新能力不足。","ja":"現在、会社の発展における最大のボトルネックは技術革新力の不足にある。","ja_ai":true},{"zh":"很多人在减肥过程中都会经历瓶颈期，这时候更需要坚持。","ja":"多くの人はダイエットの途中で停滞期を経験するが、そういうときこそ続けることが大切だ。","ja_ai":true}],"related":["瓶颈期"],"parent":"","pages":[30,31,38],"notes":"1件目の例文は本文 p30 の引用（本文訳は資料に無し）。"},{"id":"2026春-1-038","lesson":1,"type":"単語","role":"見出し語","zh":"垮","pinyin":"kuǎ","ja":"崩れる／倒産する／ダメになる","ja_ai":false,"ja_note":"","def_zh":"倒下、失败、崩溃（多用于组织/身体/心理）","def_zh_ai":false,"examples":[{"zh":"跟了张雪7年的员工尹中意对记者说，最艰难时，他曾担心公司会垮。","ja":"張雪のもとで7年働いてきた社員の尹中意は記者に、最も苦しかった時期には会社がつぶれるのではないかと心配したこともあると語った。","ja_ai":true},{"zh":"如果资金链断裂，公司可能很快就垮了。","ja":"資金繰りが途絶えれば、会社はすぐにつぶれてしまうかもしれない。","ja_ai":true},{"zh":"连续加班让他身体差点儿垮掉。","ja":"連日の残業で、彼は危うく体を壊すところだった。","ja_ai":true},{"zh":"精神一旦垮了，就很难再坚持下去。","ja":"心が一度折れてしまうと、もう頑張り続けるのは難しい。","ja_ai":true}],"related":["垮掉"],"parent":"","pages":[30,31,38],"notes":"1件目の例文は本文 p30 の引用（本文訳は資料に無し）。"},{"id":"2026春-1-039","lesson":1,"type":"成語","role":"見出し語","zh":"烟消云散","pinyin":"yān xiāo yún sàn","ja":"跡形もなく消える／雲散霧消する","ja_ai":false,"ja_note":"","def_zh":"像烟和云一样消散，完全消失、不复存在","def_zh_ai":false,"examples":[{"zh":"如今，这些忧虑已烟消云散。","ja":"今では、そうした心配はすっかり消え去った。","ja_ai":true},{"zh":"随着问题的解决，所有误会都烟消云散了。","ja":"問題が解決するにつれて、すべての誤解はきれいに消えた。","ja_ai":true},{"zh":"真相大白后，谣言自然烟消云散。","ja":"真相が明らかになった後、デマは自然と跡形もなく消え去った。","ja_ai":false}],"related":[],"parent":"","pages":[30,32,38],"notes":"1件目の例文は本文 p30 の引用（本文訳は資料に無し）。"},{"id":"2026春-1-040","lesson":1,"type":"単語","role":"見出し語","zh":"怀揣","pinyin":"huái chuāi","ja":"～を胸に抱く／心に抱く","ja_ai":false,"ja_note":"","def_zh":"心里带着（理想、情感、希望等）","def_zh_ai":false,"examples":[{"zh":"张雪希望，来应聘的，不仅仅是把这里当成一份工作，更是像他一样，怀揣着热爱而来。","ja":"張雪は、応募してくる人がここを単なる仕事の場と考えるのではなく、自分と同じように情熱を胸に抱いて来てほしいと願っている。","ja_ai":true},{"zh":"她怀揣着对未来的期待开始了新的生活。","ja":"彼女は未来への期待を胸に、新しい生活を始めた。","ja_ai":true},{"zh":"很多年轻人怀揣理想走上创业之路。","ja":"多くの若者が理想を胸に起業の道へ踏み出す。","ja_ai":true},{"zh":"带着不安和希望，他怀揣复杂的心情出发了。","ja":"不安と希望を抱えながら、彼は複雑な思いを胸に出発した。","ja_ai":true}],"related":[],"parent":"","pages":[30,32,38],"notes":"1件目の例文は本文 p30 の引用（本文訳は資料に無し）。"},{"id":"2026春-1-041","lesson":1,"type":"成語","role":"関連語","zh":"朴实无华","pinyin":"pǔ shí wú huá","ja":"素朴で飾り気がない","ja_ai":true,"ja_note":"","def_zh":"质朴实在，没有浮华的修饰。","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[33],"notes":"ピンイン補完。p 調侃の訳・補足訳）は ja_note に改行区切りで収録し、ja は短い訳語を補完。語釈の2文は資料の別行を連結（1文目末尾の句点は補った）。"},{"id":"2026春-1-075","lesson":1,"type":"単語","role":"見出し語","zh":"鸡汤","pinyin":"jī tāng","ja":"心のチキンスープ（空疎な励ましの言葉）","ja_ai":true,"ja_note":"ここでいう「チキンスープ」は飲み物のことではなく、「心のチキンスープ」の略である。それは、聞くととても励まされ、温かく、ポジティブに感じられるが、しばしば内容がやや空虚で現実的ではない慰めの言葉や格言を指す。","def_zh":"这里不是指喝的鸡汤，而是心灵鸡汤的简称。指那些听起来很励志、很温暖、很正能量，但往往有点空洞、不切实际的安慰话或格言。","def_zh_ai":false,"examples":[],"related":["心灵鸡汤","反鸡汤"],"parent":"","pages":[40],"notes":"ピンイン補完。資料見出しは【鸡汤】。資料の説明文の訳（長文）は ja_note に収録し、ja は短い訳語を補完。"},{"id":"2026春-1-076","lesson":1,"type":"慣用句","role":"見出し語","zh":"胜败乃兵家常事","pinyin":"shèng bài nǎi bīng jiā cháng shì","ja":"勝ち負けはよくあることであり、特別なことではない","ja_ai":false,"ja_note":"","def_zh":"胜利和失败都是很正常的事情（原指打仗，现泛指各种竞争）","def_zh_ai":false,"examples":[{"zh":"比赛输了也没关系，胜败乃兵家常事，重要的是总结经验。","ja":"試合に負けても構わない。勝ち負けは兵家の常であり、大切なのは経験を振り返ることだ。","ja_ai":true}],"related":["胜不骄，败不馁"],"parent":"","pages":[42],"notes":"ピンイン補完。"},{"id":"2026春-1-077","lesson":1,"type":"慣用句","role":"見出し語","zh":"胜不骄，败不馁","pinyin":"shèng bù jiāo bài bù něi","ja":"勝っても驕らず、負けてもくじけない","ja_ai":false,"ja_note":"","def_zh":"胜利时不骄傲，失败时不气馁","def_zh_ai":false,"examples":[{"zh":"一个成熟的人应该胜不骄，败不馁，保持稳定的心态。","ja":"成熟した人は、勝っても驕らず負けてもくじけず、安定した心の状態を保つべきだ。","ja_ai":true}],"related":["胜败乃兵家常事"],"parent":"","pages":[42],"notes":"資料表記は「胜不骄  败不馁」と空白区切り（zh は全角読点で区切った）。資料に補足「接受结果 + 调整心态」あり。"},{"id":"2026春-1-078","lesson":1,"type":"成語","role":"関連語","zh":"意犹未尽","pinyin":"yì yóu wèi jìn","ja":"まだ物足りない／名残惜しい","ja_ai":true,"ja_note":"","def_zh":"意思还没有尽，形容余味无穷、兴致未尽。","def_zh_ai":true,"examples":[{"zh":"这场比赛节奏紧张又精彩，观众看完后纷纷大呼过瘾，还意犹未尽。","ja":"この試合はテンポが速くて非常に精彩で、観客は見終わったあと皆「最高だ」と感じ、まだ物足りない様子だった。","ja_ai":false}],"related":["大呼"],"parent":"大呼","pages":[5],"notes":"p5 大呼 の例文中にピンイン注（資料では「jiézòu yì yóu wèi jìnfēnfēn」と隣接語と連結して抽出、分離した）。ピンインは資料どおり。出現順では 大呼 の直後だが、追加分のため末尾に連番。"},{"id":"2026春-1-079","lesson":1,"type":"成語","role":"関連語","zh":"泪如泉涌","pinyin":"lèi rú quán yǒng","ja":"涙がとめどなくあふれる","ja_ai":true,"ja_note":"","def_zh":"眼泪像泉水一样涌出来，形容极度悲伤或激动。","def_zh_ai":true,"examples":[{"zh":"张雪泪如泉涌，那一刻，也许只有失败过的人才懂。","ja":"張雪の目からは涙がとめどなくあふれた。その瞬間の思いは、失敗を経験した者にしかわからないのかもしれない。","ja_ai":true}],"related":[],"parent":"","pages":[29],"notes":"ピンイン補完。p29 本文中の成語（スライドでの解説は無し）。親見出し語が無いため parent は空。追加分のため末尾に連番。"},{"id":"2026春-2-001","lesson":2,"type":"単語","role":"見出し語","zh":"热衷","pinyin":"rè zhōng","ja":"熱中する／夢中になる","ja_ai":false,"ja_note":"","def_zh":"非常爱好、十分积极地投入某件事情","def_zh_ai":false,"examples":[{"zh":"他一直热衷于理财投资，经常研究各种金融产品，希望让自己的资产不断增值。","ja":"彼は資産運用に熱中しており、さまざまな金融商品を研究して資産を増やそうとしている。","ja_ai":false},{"zh":"很多年轻人热衷于打卡网红景点，把旅行当成一种社交方式。","ja":"多くの若者は人気スポットに行って写真を撮るのに熱中し、旅行を一種の社交の手段と考えている。","ja_ai":false}],"related":["热衷于"],"parent":"","pages":[49],"notes":""},{"id":"2026春-2-002","lesson":2,"type":"単語","role":"見出し語","zh":"攒钱","pinyin":"zǎn qián","ja":"お金を貯める","ja_ai":true,"ja_note":"","def_zh":"一点一点地积存钱财","def_zh_ai":true,"examples":[{"zh":"全款买房成为可能出自几个方面：一个是热衷于攒钱的年轻人随着时间累积手握大额流动资金；另一方面是由于一线城市房价持续下跌，刚需门槛还在不断探底，刚好落入刚需购房者全款买房的可承受区间。","ja":"一括購入が可能になっている背景には、いくつかの要因がある。ひとつは、貯蓄を重視する若者が時間をかけて資金を積み上げ、多額の流動資金を手元に持つようになったこと。もうひとつは、一線都市における住宅価格の下落が続き、実需向け住宅の参入ハードルが下がり続けているため、ちょうど一括購入が可能な範囲に収まってきていることである。","ja_ai":false}],"related":[],"parent":"","pages":[46,49,73],"notes":"まとめ（p73）のみ掲載、語釈なし。ピンイン補完。例文は本文から採録。例文訳は本文訳（p47）。"},{"id":"2026春-2-003","lesson":2,"type":"単語","role":"見出し語","zh":"下跌","pinyin":"xià diē","ja":"下落する／下がる","ja_ai":false,"ja_note":"","def_zh":"价格、数量等向下降低","def_zh_ai":false,"examples":[{"zh":"近期房价出现明显下跌，影响了很多购房者的决策。","ja":"最近、住宅価格が明らかに下落し、多くの購入希望者の判断に影響を与えた。","ja_ai":true},{"zh":"股市连续下跌，让不少投资者感到不安。","ja":"株式市場が続落し、多くの投資家が不安を感じている。","ja_ai":true},{"zh":"如果经济持续低迷，消费水平也可能下跌。","ja":"景気の低迷が続けば、消費水準も下がる可能性がある。","ja_ai":true}],"related":["跌幅"],"parent":"","pages":[50],"notes":"p50 の行内に混入した「老破小」「刚性需求」は書き込みとみなし除外（それぞれ別カード）。"},{"id":"2026春-2-004","lesson":2,"type":"単語","role":"見出し語","zh":"刚需门槛","pinyin":"gāng xū mén kǎn","ja":"実需の参入ハードル","ja_ai":false,"ja_note":"","def_zh":"满足基本需求（如住房）所需要达到的最低条件或标准","def_zh_ai":false,"examples":[{"zh":"随着房价下降，刚需门槛逐渐降低，更多人开始考虑买房。","ja":"住宅価格の下落に伴い実需の参入ハードルが徐々に下がり、より多くの人が住宅購入を考え始めた。","ja_ai":true},{"zh":"对年轻人来说，首付比例直接影响刚需门槛。","ja":"若者にとって、頭金の比率は実需の参入ハードルに直接影響する。","ja_ai":true},{"zh":"如果收入不稳定，很难跨过购房的刚需门槛。","ja":"収入が不安定だと、住宅購入の実需ハードルを越えるのは難しい。","ja_ai":true}],"related":["落户门槛","入学门槛","入职门槛","行业门槛","技术门槛","准入门槛","刚性需求"],"parent":"","pages":[50],"notes":""},{"id":"2026春-2-005","lesson":2,"type":"単語","role":"見出し語","zh":"探底","pinyin":"tàn dǐ","ja":"底を打つ／底値を探る","ja_ai":false,"ja_note":"","def_zh":"价格或情况下降到最低点","def_zh_ai":false,"examples":[{"zh":"房价是否已经探底，目前还存在争议。","ja":"住宅価格がすでに底を打ったかどうかについては、現在も議論がある。","ja_ai":true},{"zh":"如果经济继续下行，价格可能进一步探底。","ja":"景気がさらに下向けば、価格はさらに底値を探る可能性がある。","ja_ai":true},{"zh":"很多投资者选择观望，等待价格真正探底之后再决定是否入场。","ja":"多くの投資家は様子見を選び、価格が本当に底を打ってから参入するかどうかを決めようとしている。","ja_ai":true}],"related":[],"parent":"","pages":[51],"notes":""},{"id":"2026春-2-006","lesson":2,"type":"単語","role":"見出し語","zh":"落入……区间","pinyin":"luò rù … qū jiān","ja":"〜の範囲に入る","ja_ai":false,"ja_note":"","def_zh":"进入某一个范围之内","def_zh_ai":false,"examples":[{"zh":"物价涨幅落入可控区间，不会影响日常生活。","ja":"物価の上昇幅が管理可能な範囲に収まっており、日常生活には影響しない。","ja_ai":true},{"zh":"房价调整后，逐渐落入年轻人可承受的区间。","ja":"住宅価格が調整された後、次第に若者が負担できる範囲に収まってきた。","ja_ai":true},{"zh":"这款手机定价落入大众消费区间，销量持续走高。","ja":"この携帯電話は価格が一般消費者向けの価格帯に収まり、販売台数が伸び続けている。","ja_ai":true}],"related":[],"parent":"","pages":[51],"notes":"1つ目の例文（物价涨幅…）は p51 の冒頭に単独で出ており、ページ配置上この語の例文と判断。"},{"id":"2026春-2-007","lesson":2,"type":"単語","role":"見出し語","zh":"上车","pinyin":"shàng chē","ja":"（住宅を）購入する／マイホームを手に入れる","ja_ai":true,"ja_note":"","def_zh":"入手买房、购房定居。","def_zh_ai":false,"examples":[{"zh":"同时更值得注意的是，新上车的年轻人对“房贷”的态度发生了明显转变。","ja":"同時に、より注目すべきなのは、新たに住宅市場に参入した若者たちの「住宅ローン」に対する考え方が明らかに変化している点である。","ja_ai":false}],"related":["全款上车"],"parent":"","pages":[53,55,58,60,63,64],"notes":"ピンイン補完。本文訳（p54）では「新たに住宅市場に参入した」と訳出。例文は本文から採録。"},{"id":"2026春-2-008","lesson":2,"type":"単語","role":"見出し語","zh":"资产缩水","pinyin":"zī chǎn suō shuǐ","ja":"資産価値が目減りする","ja_ai":true,"ja_note":"","def_zh":"资产价值变少、贬值。","def_zh_ai":false,"examples":[{"zh":"害怕资产缩水，还要背负房贷利息，担心“两头亏”，越来越多的人抵触房贷，高杠杆买房、背上高额房贷的情况越来越少。","ja":"資産価値の下落を恐れ、さらにローン利息を背負うことになり、「両損になる」ことを懸念して、住宅ローンに抵抗感を持つ人が増えている。高いレバレッジで住宅を購入し、多額の住宅ローンを抱えるケースはますます減少している。","ja_ai":false}],"related":["贬值"],"parent":"","pages":[53,55,58,60],"notes":"ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-009","lesson":2,"type":"単語","role":"見出し語","zh":"房贷利息","pinyin":"fáng dài lì xī","ja":"住宅ローンの利息","ja_ai":true,"ja_note":"","def_zh":"买房贷款要付给银行的额外利息。","def_zh_ai":false,"examples":[{"zh":"害怕资产缩水，还要背负房贷利息，担心“两头亏”，越来越多的人抵触房贷，高杠杆买房、背上高额房贷的情况越来越少。","ja":"資産価値の下落を恐れ、さらにローン利息を背負うことになり、「両損になる」ことを懸念して、住宅ローンに抵抗感を持つ人が増えている。高いレバレッジで住宅を購入し、多額の住宅ローンを抱えるケースはますます減少している。","ja_ai":false}],"related":[],"parent":"","pages":[53,55,58,60,73],"notes":"ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-010","lesson":2,"type":"単語","role":"見出し語","zh":"抵触","pinyin":"dǐ chù","ja":"抵抗感を持つ／反発する","ja_ai":true,"ja_note":"","def_zh":"内心抗拒、不愿意接受。","def_zh_ai":false,"examples":[{"zh":"害怕资产缩水，还要背负房贷利息，担心“两头亏”，越来越多的人抵触房贷，高杠杆买房、背上高额房贷的情况越来越少。","ja":"資産価値の下落を恐れ、さらにローン利息を背負うことになり、「両損になる」ことを懸念して、住宅ローンに抵抗感を持つ人が増えている。高いレバレッジで住宅を購入し、多額の住宅ローンを抱えるケースはますます減少している。","ja_ai":false},{"zh":"大家对高房价的抵触情绪，从冷清的楼市成交量可见一斑。","ja":"高い住宅価格に対する人々の反発は、低迷する不動産取引量からも見て取れる。","ja_ai":true}],"related":["抵触情绪"],"parent":"","pages":[53,55,58,60,61,73],"notes":"p61 末尾に「dǐ chù qíng xù」（抵触情绪）のピンインのみ記載。2つ目の例文は 可见一斑 の例文（p61）から。"},{"id":"2026春-2-011","lesson":2,"type":"単語","role":"見出し語","zh":"高杠杆买房","pinyin":"gāo gàng gǎn mǎi fáng","ja":"高レバレッジで住宅を購入する","ja_ai":false,"ja_note":"","def_zh":"首付比例很低、贷款额度很高，自有资金投入极少，几乎全靠借钱买房。","def_zh_ai":false,"examples":[{"zh":"害怕资产缩水，还要背负房贷利息，担心“两头亏”，越来越多的人抵触房贷，高杠杆买房、背上高额房贷的情况越来越少。","ja":"資産価値の下落を恐れ、さらにローン利息を背負うことになり、「両損になる」ことを懸念して、住宅ローンに抵抗感を持つ人が増えている。高いレバレッジで住宅を購入し、多額の住宅ローンを抱えるケースはますます減少している。","ja_ai":false}],"related":["杠杆"],"parent":"","pages":[53,55,58,60],"notes":"ピンイン補完。五字だが決まり文句ではない語句のため 単語 扱い。例文は本文から採録。"},{"id":"2026春-2-012","lesson":2,"type":"単語","role":"見出し語","zh":"截至2025年底","pinyin":"jié zhì èr líng èr wǔ nián dǐ","ja":"2025年末時点で","ja_ai":true,"ja_note":"","def_zh":"到2025年12月31日为止的时间节点。","def_zh_ai":false,"examples":[{"zh":"根据央行近期公布的数据，截至2025年底，中国居民个人住房贷款余额37.01万亿，同比下降1.8%，这已是居民房贷连续三年下降。","ja":"中央銀行が最近公表したデータによると、2025年末時点で中国の個人住宅ローン残高は37.01兆元で、前年同期比1.8％減となっており、これで住宅ローン残高は3年連続の減少となった。","ja_ai":false}],"related":["截至"],"parent":"","pages":[53,55,58,60],"notes":"ピンイン補完（数字は èr líng èr wǔ と読む表記にしたため漢字数と音節数が一致しない）。見出しは資料どおり数字入り。例文は本文から採録。"},{"id":"2026春-2-013","lesson":2,"type":"単語","role":"見出し語","zh":"同比下降","pinyin":"tóng bǐ xià jiàng","ja":"前年同期比で減少する","ja_ai":true,"ja_note":"","def_zh":"和去年同一时期相比，数量变少、数值变低。","def_zh_ai":false,"examples":[{"zh":"根据央行近期公布的数据，截至2025年底，中国居民个人住房贷款余额37.01万亿，同比下降1.8%，这已是居民房贷连续三年下降。","ja":"中央銀行が最近公表したデータによると、2025年末時点で中国の個人住宅ローン残高は37.01兆元で、前年同期比1.8％減となっており、これで住宅ローン残高は3年連続の減少となった。","ja_ai":false}],"related":[],"parent":"","pages":[53,55,58,60],"notes":"ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-014","lesson":2,"type":"単語","role":"見出し語","zh":"零负债","pinyin":"líng fù zhài","ja":"無借金（ゼロ負債）","ja_ai":false,"ja_note":"","def_zh":"没有任何欠款，不欠银行、不欠别人钱。","def_zh_ai":false,"examples":[{"zh":"在“零负债”成为年轻人维持财务健康的新趋势下，人们的买房逻辑也变了。","ja":"「無借金（ゼロ負債）」が若者にとって財務健全性を維持する新たなトレンドとなる中、人々の住宅購入に対する考え方も変化している。","ja_ai":false}],"related":[],"parent":"","pages":[53,55,58,60,104],"notes":"ピンイン補完。ja は本文訳（p54）の訳語を採用。例文は本文から採録。"},{"id":"2026春-2-015","lesson":2,"type":"単語","role":"見出し語","zh":"逻辑","pinyin":"luó jí","ja":"論理／ロジック、（物事の）筋道・考え方","ja_ai":true,"ja_note":"","def_zh":"思维规律、事理条理；也指事情的因果道理。","def_zh_ai":false,"examples":[{"zh":"在“零负债”成为年轻人维持财务健康的新趋势下，人们的买房逻辑也变了。","ja":"「無借金（ゼロ負債）」が若者にとって財務健全性を維持する新たなトレンドとなる中、人々の住宅購入に対する考え方も変化している。","ja_ai":false}],"related":["买房逻辑","购房逻辑"],"parent":"","pages":[53,55,58,60,64,73],"notes":"例文は本文から採録。"},{"id":"2026春-2-016","lesson":2,"type":"単語","role":"見出し語","zh":"刚性需求","pinyin":"gāng xìng xū qiú","ja":"必需の需要／実需（硬直的需要）","ja_ai":true,"ja_note":"","def_zh":"刚性：不能减少、不能代替、必须要有。需求：需要、想要、离不开的东西。刚需：不管价格涨不涨、收入高不高，人必须要有的东西，不能省、不能不买，就叫刚需。","def_zh_ai":false,"examples":[],"related":["刚需","弹性需求","刚需门槛"],"parent":"","pages":[50,56,73],"notes":"ピンイン補完。p56「刚需=刚性需求」の説明3項目を句点でつないで def_zh とした。p56 の分類（生存基础刚需：粮食、大米…／日常生活刚需：衣服、鞋子…／人生大事刚需：住房、教育、医疗、养老、通勤交通／现代社会刚需：智能手机、手机流量…）は省略。p50 にも書き込みあり。"},{"id":"2026春-2-017","lesson":2,"type":"単語","role":"見出し語","zh":"弹性需求","pinyin":"tán xìng xū qiú","ja":"弾力的需要（価格や収入に応じて増減する需要）","ja_ai":true,"ja_note":"","def_zh":"会随价格、收入等变化而明显增减的需求，可以减少、推迟或用别的东西代替。","def_zh_ai":true,"examples":[],"related":["刚性需求"],"parent":"","pages":[56,73],"notes":"ピンイン補完。p56 で 刚性需求 の「反义词」として提示、まとめ p73 掲載。語釈・例文なし。"},{"id":"2026春-2-018","lesson":2,"type":"成語","role":"見出し語","zh":"可见一斑","pinyin":"kě jiàn yì bān","ja":"一部から全体がうかがえる","ja_ai":true,"ja_note":"斑：まだら模様。竹の筒から豹をのぞくと、全体を見ることはできないが、体の一部の斑紋は見ることができる。そこから、物事の一部分から全体の様子を推し量ることができるというたとえである。","def_zh":"斑：斑纹。从竹管里看豹，虽然不能看到豹的全体，但也能看到豹身上的一块斑纹。比喻从一点可推知全貌。","def_zh_ai":false,"examples":[{"zh":"年轻人购房意愿降低，从观望人数大增可见一斑。","ja":"若者の住宅購入意欲が低下していることは、様子見の人が大幅に増えていることからもうかがえる。","ja_ai":true},{"zh":"大家对高房价的抵触情绪，从冷清的楼市成交量可见一斑。","ja":"高い住宅価格に対する人々の反発は、低迷する不動産取引量からも見て取れる。","ja_ai":true},{"zh":"他平时做事十分细心，从整理笔记的认真程度可见一斑。","ja":"彼が普段から非常に几帳面であることは、ノートの整理ぶりの丁寧さからもうかがえる。","ja_ai":true},{"zh":"这个现象从近年来连续下滑的房贷规模可见一斑。","ja":"この現象は、近年の住宅ローン残高の継続的な減少からも見て取れる。","ja_ai":false}],"related":["管中窥豹"],"parent":"","pages":[53,58,61,73],"notes":"資料のピンインは「bān」のみ。kě jiàn yì 補完（一 は資料の 一团糟 yì tuán zāo に合わせ変調表記）。4つ目の例文は本文（p53）と本文訳（p54）。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-019","lesson":2,"type":"成語","role":"見出し語","zh":"管中窥豹","pinyin":"guǎn zhōng kuī bào","ja":"管中から豹を窺う（一部だけを見る）","ja_ai":true,"ja_note":"","def_zh":"从管子里看豹。比喻只见到事物的一小部分。也比喻可以从观察到的部分推测全貌。","def_zh_ai":false,"examples":[{"zh":"仅靠一次表现就评价一个人，无异于管中窥豹。","ja":"僅か一度の振る舞いだけで人を評価するのは、まさに管中窺豹のようなものだ。","ja_ai":false}],"related":["可见一斑"],"parent":"","pages":[61,73],"notes":"可见一斑 のスライド内で解説。まとめ p73 掲載のため見出し語。"},{"id":"2026春-2-020","lesson":2,"type":"単語","role":"見出し語","zh":"人才房","pinyin":"rén cái fáng","ja":"人材住宅","ja_ai":true,"ja_note":"人材住宅は地方政府が資格を満たす専門人材向けに設けた政策的な安居住宅で、一般の分譲住宅より価格が安く、特定人材に限定供給され、取引には規定の制約が設けられている。","def_zh":"人才房是地方政府面向符合资质的专业人才推出的政策性安居住房，售价低于普通商品住房，面向特定人才定向供应，并有相应交易约束规定。","def_zh_ai":false,"examples":[{"zh":"在犹豫了很久之后，33岁的Bella和她的先生小项最终决定，全款200万拿下深圳光明区一处70平米的人才房。","ja":"長い間迷った末、33歳のBellaと夫の小項は、200万元を一括で支払い、深圳市光明区にある70平方メートルの人材住宅を購入することに決めた。","ja_ai":true}],"related":[],"parent":"","pages":[63],"notes":"ピンイン補完。本文中の用語解説（まとめには無し）。例文は本文から採録。 資料の日本語説明文は ja_note に移し、ja は短い訳語を補完。"},{"id":"2026春-2-021","lesson":2,"type":"単語","role":"見出し語","zh":"纠结","pinyin":"jiū jié","ja":"思い悩む／迷う、葛藤する","ja_ai":true,"ja_note":"","def_zh":"心里矛盾，犹豫不决，难以做出决定","def_zh_ai":true,"examples":[{"zh":"但是，在全款买房和贷款买更大的房子上，两人纠结过一段时间。","ja":"しかし、一括で家を買うか、ローンを組んでより大きな家を買うかで、二人はしばらく悩んだ。","ja_ai":true}],"related":[],"parent":"","pages":[63,73,107],"notes":"まとめ p73 掲載、語釈なし。ピンインは p107 末尾の「jiūjié」による。例文は本文から採録。"},{"id":"2026春-2-022","lesson":2,"type":"単語","role":"見出し語","zh":"倾向于","pinyin":"qīng xiàng yú","ja":"〜する傾向がある／〜の方に傾く","ja_ai":true,"ja_note":"","def_zh":"偏向于某一方面，更愿意选择某种做法或观点","def_zh_ai":true,"examples":[{"zh":"按照以往的购房逻辑，手握200万现金的购房者大多会倾向于加杠杆，以此作为首付，购置一套远超200万的房产。","ja":"これまでの住宅購入の考え方に従えば、200万元の現金を持つ購入者の多くはレバレッジをかけてそれを頭金とし、200万元をはるかに超える物件を購入する傾向がある。","ja_ai":true}],"related":[],"parent":"","pages":[64,73],"notes":"まとめ p73 掲載。ピンインは p64 本文注「qīng xiàng」、yú は補完。例文は本文から採録。例文中の読み注（qīng xiàng）は除いた。"},{"id":"2026春-2-023","lesson":2,"type":"単語","role":"見出し語","zh":"首付","pinyin":"shǒu fù","ja":"頭金","ja_ai":true,"ja_note":"","def_zh":"分期付款购买房子、汽车等时，第一次支付的那部分款项","def_zh_ai":true,"examples":[{"zh":"对年轻人来说，首付比例直接影响刚需门槛。","ja":"若者にとって、頭金の比率は実需の参入ハードルに直接影響する。","ja_ai":true}],"related":["首付比例"],"parent":"","pages":[50,64,73],"notes":"まとめ p73 掲載、語釈なし。ピンイン補完。例文は 刚需门槛 の例文（p50）から。"},{"id":"2026春-2-024","lesson":2,"type":"単語","role":"見出し語","zh":"杠杆","pinyin":"gàng gǎn","ja":"てこ／レバレッジ","ja_ai":true,"ja_note":"","def_zh":"原指撬动重物的工具；在金融中指借钱投资或消费，用较少的自有资金撬动更大的资金规模","def_zh_ai":true,"examples":[{"zh":"要加杠杆去买一个跌幅空间挺大的东西，确实不划算，风险也很大。","ja":"下落の余地がかなり大きいものをレバレッジをかけて買うのは、確かに割に合わないし、リスクも大きい。","ja_ai":true}],"related":["加杠杆","高杠杆买房"],"parent":"","pages":[64,73,94],"notes":"まとめ p73 掲載、語釈なし。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-025","lesson":2,"type":"単語","role":"見出し語","zh":"稳妥起见","pinyin":"wěn tuǒ qǐ jiàn","ja":"念のため、万全を期すため、安心のため","ja_ai":false,"ja_note":"","def_zh":"为了稳当可靠、不出差错（而这样做）","def_zh_ai":true,"examples":[{"zh":"但是二人最终还是稳妥起见，选择全款上车。","ja":"しかし二人は結局、万全を期して一括購入を選んだ。","ja_ai":true}],"related":[],"parent":"","pages":[64],"notes":"本文中の注釈語（本文に読み・日本語注のみ付記、まとめスライドには無し）。採否要確認。ピンインは「wěn tuǒ」のみ資料、qǐ jiàn 補完。例文は本文から採録。例文中の注釈は除いた。"},{"id":"2026春-2-026","lesson":2,"type":"単語","role":"見出し語","zh":"宁可","pinyin":"nìng kě","ja":"むしろ、～するほうがましだ","ja_ai":false,"ja_note":"","def_zh":"表示比较两方面的利害得失后，选取其中一面","def_zh_ai":true,"examples":[{"zh":"我不想扛这么多房贷，宁可再攒一攒。","ja":"こんなに多くの住宅ローンを背負いたくない。むしろもう少しお金を貯めたい。","ja_ai":true}],"related":["宁愿"],"parent":"","pages":[64,73],"notes":"まとめ p73 掲載。ピンイン・ja は p64 本文注による。例文は本文から採録。例文中の注釈は除いた。"},{"id":"2026春-2-027","lesson":2,"type":"単語","role":"関連語","zh":"月供","pinyin":"yuè gòng","ja":"（ローンの）毎月の返済（額）","ja_ai":true,"ja_note":"","def_zh":"按月偿还贷款的固定金额","def_zh_ai":true,"examples":[{"zh":"更重要的是，即便小贷一笔，每月的“月供”本身也会成为一种心理负担。","ja":"さらに重要なのは、たとえ少額のローンでも、毎月の「返済」そのものが心理的な負担になるということだ。","ja_ai":true}],"related":["断供","上供","供品"],"parent":"","pages":[65,72,74,76],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p72 の書き込み「月供 断供 上供 供品」（「供」を含む語のまとめと思われる）。本文 p65・p74・p76 にも出現。ピンイン補完。"},{"id":"2026春-2-028","lesson":2,"type":"単語","role":"見出し語","zh":"并非个例","pinyin":"bìng fēi gè lì","ja":"決して特別な例ではない","ja_ai":true,"ja_note":"","def_zh":"并不是个别的例子，说明这种情况并不少见","def_zh_ai":true,"examples":[{"zh":"Bella全款买房并非个例。","ja":"Bellaのように一括で家を買うのは決して特別な例ではない。","ja_ai":true}],"related":["不是个例"],"parent":"","pages":[65,73,94],"notes":"まとめ p73 掲載、語釈なし。ピンイン補完。四字だが成語ではない語句のため 単語 扱い。例文は本文から採録。"},{"id":"2026春-2-029","lesson":2,"type":"単語","role":"見出し語","zh":"对……的执念","pinyin":"duì … de zhí niàn","ja":"……に対するこだわり／執着","ja_ai":false,"ja_note":"","def_zh":"对某种事物念念不忘、难以放下的执着想法","def_zh_ai":true,"examples":[{"zh":"国人对房子的执念，在90后这代人身上并没有被淡化，随着年岁渐长，房子给人带来的安全感和归属感反而日渐浓烈。","ja":"中国人の家に対するこだわりは、90年代生まれの世代でも薄れておらず、年齢を重ねるにつれて、家がもたらす安心感や帰属感はむしろ日に日に強まっている。","ja_ai":true},{"zh":"能看到夕阳，是她在选房时一个小小的执念。","ja":"夕日が見えることは、彼女が部屋を選ぶときの小さなこだわりだった。","ja_ai":true}],"related":["执念"],"parent":"","pages":[65,104,105],"notes":"まとめ p105 の表記は「对…… 的执念」。p65 本文注は「执念（zhí niàn 執着、こだわり、未練）」。ピンインの duì … de は補完。例文は本文から採録。"},{"id":"2026春-2-030","lesson":2,"type":"単語","role":"見出し語","zh":"不无道理","pinyin":"bù wú dào lǐ","ja":"一理ある","ja_ai":true,"ja_note":"","def_zh":"并不是没有道理，有一定的道理","def_zh_ai":true,"examples":[{"zh":"朋友的说法不无道理。","ja":"友人の言うことにも一理ある。","ja_ai":true}],"related":[],"parent":"","pages":[67,73],"notes":"まとめ p73 掲載、語釈なし。ピンイン補完。四字だが成語ではない語句のため 単語 扱い。例文は本文から採録。"},{"id":"2026春-2-031","lesson":2,"type":"単語","role":"見出し語","zh":"上岸","pinyin":"shàng àn","ja":"無事合格して安定した身分になる／定職に就いて落ち着く","ja_ai":false,"ja_note":"","def_zh":"从水里走到岸上。从不稳定、压力大、漂泊不确定的状态，成功进入稳定、有编制、有保障的人生状态，叫上岸。","def_zh_ai":false,"examples":[{"zh":"两年前，她花了3个月的时间备战考公，成功上岸了另一座小城的体制内工作，开始异地上班。","ja":"2年前、彼女は3か月かけて公務員試験の準備をし、見事に別の小さな町の公務員職に合格して、よその町で働き始めた。","ja_ai":true}],"related":["考公上岸","考研上岸","大厂上岸"],"parent":"","pages":[67,69,73],"notes":"p69 は「知识补充」だが、まとめ p73 掲載のため見出し語化。ピンイン補完。用例: 考公上岸：考上公务员、事业编，有稳定体制内工作／考研上岸：考研成功被录取，考上研究生／大厂上岸：成功通过面试，进入知名大厂正式工作。例文は本文から採録。"},{"id":"2026春-2-032","lesson":2,"type":"成語","role":"見出し語","zh":"忽冷忽热","pinyin":"hū lěng hū rè","ja":"熱くなったり冷たくなったり／気まぐれ","ja_ai":true,"ja_note":"","def_zh":"一会儿冷，一会儿热；也比喻态度、感情不稳定","def_zh_ai":true,"examples":[{"zh":"虽然可以住宿舍，但是宿舍条件有限，洗澡水忽冷忽热，上厕所要排队，食堂饭菜高油高盐把老同事吃出了三高。","ja":"寮に住むこともできるが、寮の設備は限られていて、シャワーのお湯は熱くなったり冷たくなったりし、トイレは順番待ち、食堂の食事は油と塩分が多く、古株の同僚は三高（高血圧・高血糖・脂質異常）になってしまった。","ja_ai":true}],"related":[],"parent":"","pages":[67,73],"notes":"まとめ p73 掲載、語釈なし。ピンイン補完。例文は本文から採録。"},{"id":"2026春-2-033","lesson":2,"type":"単語","role":"見出し語","zh":"大厂","pinyin":"dà chǎng","ja":"大手企業（特に大手IT企業）","ja_ai":true,"ja_note":"","def_zh":"大型工厂、大型企业厂房。特指国内头部大型互联网公司、知名高科技大企业。","def_zh_ai":false,"examples":[{"zh":"关于贷款的风险，她想起一位在大厂工作的男性朋友，这位朋友早几年赶在房价高点买了房，月供小2万，如今房产缩水50%，贷款照还，两头亏。","ja":"ローンのリスクについて、彼女は大手企業で働く男性の友人を思い出した。その友人は数年前、住宅価格が高い時期に家を買い、毎月の返済は2万元近く。今では物件価値が50%目減りしたのにローンは返し続けなければならず、両方で損をしている。","ja_ai":true}],"related":["大厂上岸","拿命换钱","拿钱买命"],"parent":"","pages":[68,73,74],"notes":"p68「知识补充」だが、まとめ p73 掲載のため見出し語化。ピンイン補完。資料の「大型工x厂」は抽出ノイズとみなし「大型工厂」とした（要原本確認）。例: 阿里巴巴、腾讯、字节跳动、百度、华为、京东、网易等。特徴: 规模大、名气大、薪资高、福利好／工作压力大、节奏快、有裁员风险／大学生、求职者最向往的就业去向之一。例文は本文から採録。"},{"id":"2026春-2-034","lesson":2,"type":"成語","role":"関連語","zh":"拿命换钱","pinyin":"ná mìng huàn qián","ja":"命を削って金を稼ぐ","ja_ai":true,"ja_note":"","def_zh":"以牺牲健康甚至生命为代价去挣钱，形容工作极度辛苦","def_zh_ai":true,"examples":[],"related":["拿钱买命"],"parent":"大厂","pages":[68],"notes":"p68 大厂 の知识补充に「拿命换钱／拿钱买命」と並記。ピンイン補完。四字の決まり文句として 成語 扱い（俗語）。"},{"id":"2026春-2-035","lesson":2,"type":"成語","role":"関連語","zh":"拿钱买命","pinyin":"ná qián mǎi mìng","ja":"（稼いだ）金で命（健康）を買い戻す","ja_ai":true,"ja_note":"","def_zh":"用挣来的钱去换回健康、治病保命","def_zh_ai":true,"examples":[],"related":["拿命换钱"],"parent":"大厂","pages":[68],"notes":"p68 大厂 の知识补充に「拿命换钱／拿钱买命」と並記。ピンイン補完。四字の決まり文句として 成語 扱い（俗語）。"},{"id":"2026春-2-036","lesson":2,"type":"慣用句","role":"関連語","zh":"苍蝇腿也是肉","pinyin":"cāng ying tuǐ yě shì ròu","ja":"わずかな利益でも利益は利益","ja_ai":true,"ja_note":"","def_zh":"比喻利益再小也是利益，不应轻视","def_zh_ai":true,"examples":[],"related":[],"parent":"","pages":[70],"notes":"ページ上の書き込み語（授業メモと思われる）。特定の見出し語との関係は資料上明示されていない。採否要確認。p70 下部（本文「多出小几万的利息」付近）。ピンイン補完。"},{"id":"2026春-2-037","lesson":2,"type":"単語","role":"関連語","zh":"超前消费","pinyin":"chāo qián xiāo fèi","ja":"先行消費（将来の収入を前提にした消費）","ja_ai":false,"ja_note":"","def_zh":"超出当前收入水平，提前使用未来收入（如贷款、分期付款）进行消费","def_zh_ai":true,"examples":[{"zh":"这个故事原本用来推崇超前消费、贷款买房的观念，如今随着楼市逻辑改变，已经不再贴合当下人们的生活选择。","ja":"この話はもともと先取り消費やローンでの住宅購入を肯定するために語られてきたが、今は不動産市場の考え方が変わり、現代の人々の生活選択にはもう合わなくなっている。","ja_ai":false}],"related":["延迟满足"],"parent":"","pages":[71,74,75],"notes":"本文のキーワード（p71・p74）で
